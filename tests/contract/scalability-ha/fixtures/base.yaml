# The values the contract test installs the chart with: what an operator has to give it, an engine
# with the settings the test then reads back, and two worker pools (one of them scaled).
database: {existingSecret: sagat-db}
oidc:
  issuer: https://idp.example/
  audience: sagat
  jwksUri: https://idp.example/jwks.json
secrets: {existingSecret: sagat-keys}
nats: {url: "nats://nats.nats:4222", credentialsSecret: nats-creds}
controlPlane: {allowPlaintextSecrets: true}
engine:
  shardLeaseSeconds: 21
  schedulerConcurrency: 6
  schedulerBatch: 150
  grpc: {allowPlaintextSecrets: true}
  autoscaling:
    keda:
      enabled: true
      prometheusAddress: http://prometheus.monitoring:9090
      maxReplicaCount: 32
workerPoolAutoscaling: {prometheusAddress: "http://prometheus.monitoring:9090"}
networkPolicy:
  apiFrom:
    - podSelector:
        matchLabels: {app.kubernetes.io/name: sagat-octopus-orchestrator}
        matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values: [worker-render, worker-export]
  workersFrom:
    - podSelector:
        matchLabels: {app.kubernetes.io/name: sagat-octopus-orchestrator}
        matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values: [worker-render, worker-export]
  egress:
    dnsTo:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: kube-system}
        podSelector:
          matchLabels: {k8s-app: kube-dns}
    postgres:
      port: 5432
      to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: database}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql}
    oidc:
      port: 443
      to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: identity}
          podSelector:
            matchLabels: {app.kubernetes.io/name: identity-provider}
    nats:
      port: 4222
      to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: nats}
          podSelector:
            matchLabels: {app.kubernetes.io/name: nats}
    controlPlaneExtra: []
    engineExtra: []
workerPools:
  - name: render
    language: python
    image: registry.example.com/team/render:1.0.0
    activities: [act.render, act.upscale]
    networkPolicy:
      extraEgress:
        - ports: [{port: 8443, protocol: TCP}]
          to:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: render-assets}
              podSelector:
                matchLabels: {app.kubernetes.io/name: asset-api}
      extraIngress:
        - ports: [{port: 9443, protocol: TCP}]
          from:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: job-control}
              podSelector:
                matchLabels: {app.kubernetes.io/name: pool-controller}
    autoscaling: {enabled: true, maxReplicaCount: 20}
  - name: export
    image: registry.example.com/team/export:1.0.0
    activities: [act.export]
    networkPolicy: {extraEgress: [], extraIngress: []}
