[package]
name = "sagat-tests"
description = "Cross-crate integration, fault, contract and end-to-end test suites (paths follow specs/*/plan.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dev-dependencies]
async-nats.workspace = true
axum.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rskafka = { version = "0.6", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jsonschema = { version = "0.58", default-features = false }
hmac = "0.13"
jsonwebtoken.workspace = true
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
h2 = "0.4"
rcgen = "0.13"
regex = "1"
reqwest = { workspace = true, features = ["json", "form"] }
sagat-api-grpc.workspace = true
sagat-api-http.workspace = true
sagat-application.workspace = true
sagat-control-plane.workspace = true
sagat-domain.workspace = true
sagat-execution-engine.workspace = true
sagat-infra-connectors = { workspace = true, features = ["unguarded-for-tests"] }
sagat-infra-egress.workspace = true
sagat-infra-ir.workspace = true
sagat-infra-nats.workspace = true
sagat-infra-postgres.workspace = true
sagat-infra-sandbox.workspace = true
sagat-infra-schema.workspace = true
sagat-infra-secrets.workspace = true
sagat-sandbox-runner.workspace = true
sagat-scheduler.workspace = true
sagat-telemetry.workspace = true
serde_json.workspace = true
sha2 = "0.11"
serde_yaml_ng = "0.10"
sqlx.workspace = true
testcontainers-modules.workspace = true
time.workspace = true
uuid.workspace = true
tonic.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true

