[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/infra-postgres", "crates/telemetry", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/ortisun/sagat-octopus-orchestrator"
publish = false

# Dependencies are declared once here and inherited with `workspace = true`.
# Layering rules (enforced by scripts/check-architecture.py) restrict which crate may use what.
[workspace.dependencies]
sagat-domain = { path = "crates/domain" }
sagat-application = { path = "crates/application" }
sagat-infra-postgres = { path = "crates/infra-postgres" }
sagat-telemetry = { path = "crates/telemetry" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid", "time"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "watchdog"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "ansi"] }
time = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
