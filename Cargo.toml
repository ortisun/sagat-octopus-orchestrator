[workspace]
resolver = "3"
members = ["crates/domain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/ortisun/sagat-octopus-orchestrator"
publish = false

# Dependencies are declared once here and inherited with `workspace = true`.
# Layering rules (enforced by scripts/check-architecture.py) restrict which crate may use what.
[workspace.dependencies]
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
