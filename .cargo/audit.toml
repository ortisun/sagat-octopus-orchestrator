# cargo-audit policy. Every ignore needs a written justification in
# specs/001-platform-foundation/research.md and must be revisited when it can be removed.
[advisories]
ignore = [
  # rsa 0.9 "Marvin Attack" (timing side channel in RSA *private-key* operations). This service only
  # VERIFIES signatures with public keys (jsonwebtoken, feature `rust_crypto`, for RS256 tokens), and
  # never signs or decrypts with RSA. See research.md, gap G16.
  "RUSTSEC-2023-0071",
  # 2026-10-24 advisories (published 2026-10-13 to 2026-10-23). Their fixes were younger than the
  # two-week rule for dependencies, so each was a time-boxed ignore. The ones whose fix had passed the
  # rule were taken on 2026-11-05 and their entries deleted (rustls 0346 to 0349, tokio 0386,
  # rustls-webpki 0382, webpki-roots and webpki-root-certs 0381 and 0383; research.md, gaps G271, G700
  # and G701). Each entry below says when its fix passes the rule and the date by which the ignore
  # must be gone. See research.md, gap G700 and decision D700.

  # crypto-bigint 0.5.5 (timing variability in operations meant to be constant-time), reached only
  # through elliptic-curve 0.13.8, which p256 0.13 and p384 0.13 pull in for jsonwebtoken 11.1.0.
  # The fix (0.7.6, 2026-10-23) needs elliptic-curve 0.14, a major bump that jsonwebtoken has not
  # taken (no release after 11.1.0, 2026-09-16), and `[patch]` cannot cross a major version. The
  # control plane only VERIFIES ES256 tokens, with public keys and public inputs; the one signing path
  # is the development identity provider (apps/dev-idp) with a throwaway key. Re-evaluated on
  # 2026-11-12: jsonwebtoken still has no release after 11.1.0. Re-evaluate on 2026-12-02 (research.md,
  # gap G703).
  "RUSTSEC-2026-0387",

  # Feature 035 independent reader (research.md, gap G035-024 and decision D035-072, owner decision
  # 2026-11-02): `iceberg` 0.10.1 and `iceberg-storage-opendal` 0.10.1 are dev-dependencies of
  # `sagat-tests` ONLY (scripts/check-architecture.py fails if any other package depends on an
  # `iceberg*` crate), so nothing below is linked into a binary that ships.
  #
  # quick-xml 0.39.4 comes from opendal 0.57.0 (S3 service) and is the version opendal pins; both fixes
  # need quick-xml >= 0.41, a different 0.x series that `[patch]` cannot substitute. The reader parses
  # only the S3 responses of the disposable fixtures of infra/docker/compose.lake.yaml, never data from
  # a customer or a network the test does not start. Re-evaluate on 2026-12-02 or when opendal moves to
  # quick-xml >= 0.41, whichever is first.
  "RUSTSEC-2026-0194", # quadratic run time checking a start tag for duplicate attribute names
  "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation in `NsReader` (memory exhaustion)
  # paste 1.0.15 (unmaintained, informational) comes from parquet 58.4.1 under `iceberg`. It is a
  # compile-time procedural macro: it executes at build time and leaves no runtime code behind.
  # Re-evaluate on 2026-12-02 or when parquet drops it.
  "RUSTSEC-2024-0436",

  # 2026-11-05: two "unmaintained" notices (informational, no patched version), published 2026-10-01 and
  # 2026-11-03, that `--deny warnings` turns into a red job for every release. See research.md, gaps G705
  # and G706 (decided by delegate on the owner's instruction "Tome as decisoes por mim").
  #
  # astral-tokio-tar 0.6.4 (maintenance ended 2026-11-03), reached only through `testcontainers` 0.27.3,
  # a dev-dependency of the test crates: `cargo tree -i astral-tokio-tar -e normal,build` prints nothing,
  # so no binary that ships links it. testcontainers 0.28.0 still depends on it and the advisory names no
  # patched version. Re-evaluate on 2026-12-02 (with G035-024) or when testcontainers drops it.
  "RUSTSEC-2026-0440",

  # 2026-11-12: libsqlite3-sys 0.37.0 (bundled C SQLite, CVE-2026-119375), fixed in 0.39.0 (2026-10-24).
  # It is in Cargo.lock only because sqlx-sqlite 0.9.0 is listed there; no feature of this workspace
  # enables SQLite, `cargo tree -i libsqlite3-sys --target all` prints nothing, and nothing compiles or
  # links it. sqlx-sqlite 0.9.0 requires `>=0.30.1, <0.38.0`, so the fix needs a sqlx release. Re-evaluate
  # on 2026-12-02 or when sqlx takes libsqlite3-sys >= 0.39 (research.md, gap G707).
  "RUSTSEC-2026-0459",
]
