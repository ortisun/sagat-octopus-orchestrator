{{- $cp := .Values.controlPlane }}
{{- $nativeTls := ne $cp.nativeTls.tlsSecret "" }}
{{- $ctx := dict "root" . "component" "control-plane" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sagat.fullname" . }}-control-plane
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  {{- if not $cp.autoscaling.enabled }}
  replicas: {{ $cp.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sagat.selector" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        {{- include "sagat.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      {{- if or .Values.podAnnotations .Values.openbao.enabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.openbao.enabled }}
        checksum/openbao-agent: {{ include (print .Template.BasePath "/openbao-agent.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sagat.openbao.serviceAccount" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext: {runAsNonRoot: true, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.openbao.enabled }}
      initContainers:
        {{- include "sagat.openbao.agent" $ctx | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "sagat.image" (dict "root" . "repository" .Values.image.controlPlane) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve]
          env:
            {{- include "sagat.oidcEnv" . | nindent 12 }}
            {{- include "sagat.openbao.env" $ctx | nindent 12 }}
            - {name: SAGAT_BIND_ADDR, value: "0.0.0.0:8080"}
            # Metrics: unauthenticated, so the NetworkPolicy keeps them to the monitoring namespace. The probes are
            # the API's own, on its port: /v1/health touches nothing (a database outage must not restart pods) and
            # /v1/ready asks the database (docs/runbooks/control-plane.md). /livez and /readyz are the engine's.
            - {name: SAGAT_ADMIN_ADDR, value: "0.0.0.0:9090"}
            - {name: SAGAT_SHUTDOWN_GRACE_SECS, value: "30"}
            {{- if $nativeTls }}
            - {name: SAGAT_HTTP_TLS_CERT, value: /etc/sagat/http-tls/tls.crt}
            - {name: SAGAT_HTTP_TLS_KEY, value: /etc/sagat/http-tls/tls.key}
            - {name: SAGAT_HTTP_TLS_CLIENT_CA, value: /etc/sagat/http-client-ca/ca.crt}
            - {name: SAGAT_HEALTHCHECK_TLS_SERVER_NAME, value: {{ $cp.nativeTls.healthcheckServerName | quote }}}
            {{- if $cp.nativeTls.healthcheckCaSecret }}
            - {name: SAGAT_HEALTHCHECK_TLS_CA_FILE, value: /etc/sagat/healthcheck-ca/ca.crt}
            {{- end }}
            {{- end }}
            {{- if $cp.webhookOidcProfilesSecret }}
            - {name: SAGAT_WEBHOOK_OIDC_PROFILES_FILE, value: /etc/sagat/webhook-oidc/profiles.json}
            {{- end }}
            {{- if $cp.allowPlaintextSecrets }}
            - {name: SAGAT_API_ALLOW_PLAINTEXT_SECRETS, value: "true"}
            {{- end }}
            {{- if $cp.studio }}
            - {name: SAGAT_STUDIO_DIR, value: /srv/studio}
            {{- else }}
            - {name: SAGAT_STUDIO_DIR, value: ""}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9090}
          startupProbe:
            httpGet: {path: /v1/health, port: http{{ if $nativeTls }}, scheme: HTTPS{{ end }}}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /v1/health, port: http{{ if $nativeTls }}, scheme: HTTPS{{ end }}}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /v1/ready, port: http{{ if $nativeTls }}, scheme: HTTPS{{ end }}}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml $cp.resources | nindent 12 }}
          {{- include "sagat.containerSecurity" . | nindent 10 }}
          volumeMounts:
            {{- include "sagat.openbao.mounts" $ctx | nindent 12 }}
            - {name: tmp, mountPath: /tmp}
            {{- if $nativeTls }}
            - {name: http-tls, mountPath: /etc/sagat/http-tls, readOnly: true}
            - {name: http-client-ca, mountPath: /etc/sagat/http-client-ca, readOnly: true}
            {{- if $cp.nativeTls.healthcheckCaSecret }}
            - {name: healthcheck-ca, mountPath: /etc/sagat/healthcheck-ca, readOnly: true}
            {{- end }}
            {{- end }}
            {{- if $cp.webhookOidcProfilesSecret }}
            - {name: webhook-oidc, mountPath: /etc/sagat/webhook-oidc, readOnly: true}
            {{- end }}
      volumes:
        {{- include "sagat.openbao.volumes" $ctx | nindent 8 }}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- if $nativeTls }}
        - name: http-tls
          secret:
            secretName: {{ $cp.nativeTls.tlsSecret | quote }}
            defaultMode: 288 # 0440
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
        - name: http-client-ca
          secret:
            secretName: {{ $cp.nativeTls.clientCaSecret | quote }}
            defaultMode: 288 # 0440
            items: [{key: ca.crt, path: ca.crt}]
        {{- if $cp.nativeTls.healthcheckCaSecret }}
        - name: healthcheck-ca
          secret:
            secretName: {{ $cp.nativeTls.healthcheckCaSecret | quote }}
            defaultMode: 288 # 0440
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- end }}
        {{- if $cp.webhookOidcProfilesSecret }}
        - name: webhook-oidc
          secret:
            secretName: {{ $cp.webhookOidcProfilesSecret | quote }}
            defaultMode: 288 # 0440
            items: [{key: profiles.json, path: profiles.json}]
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "sagat.topologySpread" $ctx | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sagat.fullname" . }}-control-plane
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ $cp.service.type }}
  selector:
    {{- include "sagat.selector" $ctx | nindent 4 }}
  ports:
    - {name: http, port: {{ $cp.service.port }}, targetPort: http, appProtocol: {{ if $nativeTls }}https{{ else }}http{{ end }}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sagat.fullname" . }}-control-plane
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $cp.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "sagat.selector" $ctx | nindent 6 }}
{{- if $cp.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sagat.fullname" . }}-control-plane
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "sagat.fullname" . }}-control-plane}
  minReplicas: {{ $cp.autoscaling.minReplicas }}
  maxReplicas: {{ $cp.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $cp.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
