{{- if .Values.networkPolicy.enabled }}
{{- include "sagat.networkPolicy.validate" . }}
{{- $egress := .Values.networkPolicy.egress }}
{{- $postgres := $egress.postgres }}
{{- $oidc := $egress.oidc }}
{{- $cp := dict "root" . "component" "control-plane" }}
{{- $en := dict "root" . "component" "execution-engine" }}
# Control-plane dependencies are explicit. NetworkPolicy cannot restrict an HTTPS peer to one
# hostname, so external OIDC peers must be narrowed to operator-managed CIDRs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sagat.fullname" . }}-control-plane-egress
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sagat.selector" $cp | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
      to:
        {{- toYaml $egress.dnsTo | nindent 8 }}
    - ports: [{port: {{ $postgres.port }}, protocol: TCP}]
      to:
        {{- toYaml $postgres.to | nindent 8 }}
    - ports: [{port: {{ $oidc.port }}, protocol: TCP}]
      to:
        {{- toYaml $oidc.to | nindent 8 }}
    {{- if .Values.openbao.enabled }}
    - ports: [{port: {{ .Values.openbao.network.port }}, protocol: TCP}]
      to:
        {{- toYaml .Values.openbao.network.to | nindent 8 }}
    {{- end }}
    {{- with $egress.controlPlaneExtra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sagat.fullname" . }}-engine-egress
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sagat.selector" $en | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
      to:
        {{- toYaml $egress.dnsTo | nindent 8 }}
    - ports: [{port: {{ $postgres.port }}, protocol: TCP}]
      to:
        {{- toYaml $postgres.to | nindent 8 }}
    - ports: [{port: {{ $oidc.port }}, protocol: TCP}]
      to:
        {{- toYaml $oidc.to | nindent 8 }}
    {{- if and .Values.nats.url (or (eq .Values.eventTransport "") (eq .Values.eventTransport "nats")) }}
    - ports: [{port: {{ $egress.nats.port }}, protocol: TCP}]
      to:
        {{- toYaml $egress.nats.to | nindent 8 }}
    {{- end }}
    {{- if eq .Values.eventTransport "redis" }}
    - ports: [{port: {{ $egress.redis.port }}, protocol: TCP}]
      to:
        {{- toYaml $egress.redis.to | nindent 8 }}
    {{- end }}
    {{- if .Values.openbao.enabled }}
    - ports: [{port: {{ .Values.openbao.network.port }}, protocol: TCP}]
      to:
        {{- toYaml .Values.openbao.network.to | nindent 8 }}
    {{- end }}
    {{- with $egress.engineExtra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- range $pool := .Values.workerPools }}
{{- $component := printf "worker-%s" $pool.name }}
{{- $selector := dict "root" $ "component" $component }}
{{- $poolPolicy := default (dict) $pool.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sagat.fullname" $ }}-worker-{{ $pool.name }}
  labels:
    {{- include "sagat.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sagat.selector" $selector | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with $poolPolicy.extraIngress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
      to:
        {{- toYaml $egress.dnsTo | nindent 8 }}
    - ports: [{port: 8080, protocol: TCP}]
      to:
        - podSelector:
            matchLabels:
              {{- include "sagat.selector" (dict "root" $ "component" "control-plane") | nindent 14 }}
    - ports: [{port: {{ $.Values.engine.grpc.port }}, protocol: TCP}]
      to:
        - podSelector:
            matchLabels:
              {{- include "sagat.selector" (dict "root" $ "component" "execution-engine") | nindent 14 }}
    {{- with $poolPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
