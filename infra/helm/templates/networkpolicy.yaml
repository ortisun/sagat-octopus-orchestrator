{{- if .Values.networkPolicy.enabled }}
{{- $cp := dict "root" . "component" "control-plane" }}
{{- $en := dict "root" . "component" "execution-engine" }}
# The admin listeners (metrics, probes) answer anyone, so only explicit monitoring peers reach them.
# API and worker API peers are also mandatory: omission fails rendering instead of opening a port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sagat.fullname" . }}-control-plane
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sagat.selector" $cp | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
      {{- with .Values.networkPolicy.apiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports: [{port: 9090, protocol: TCP}]
      from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sagat.fullname" . }}-engine
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sagat.selector" $en | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: {{ .Values.engine.grpc.port }}, protocol: TCP}]
      {{- with .Values.networkPolicy.workersFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.databaseRunner.enabled }}
        - podSelector:
            matchLabels:
              {{- include "sagat.selector" (dict "root" . "component" "database-runner") | nindent 14 }}
      {{- end }}
    - ports: [{port: 9091, protocol: TCP}]
      from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
{{- end }}
