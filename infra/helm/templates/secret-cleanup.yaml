{{- if and .Values.openbao.enabled .Values.openbao.cleanup.enabled }}
{{- $ctx := dict "root" . "component" "secret-cleanup" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sagat.fullname" . }}-secret-cleanup
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.openbao.cleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "sagat.selector" $ctx | nindent 12 }}
        spec:
          serviceAccountName: {{ include "sagat.openbao.serviceAccount" $ctx }}
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 10
          securityContext: {runAsNonRoot: true, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            {{- include "sagat.openbao.agent" $ctx | nindent 12 }}
          containers:
            - name: secret-cleanup
              image: {{ include "sagat.image" (dict "root" . "repository" .Values.image.controlPlane) | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: [cleanup-secrets]
              env:
                - {name: SAGAT_ENV, value: {{ .Values.environment | quote }}}
                - {name: SAGAT_LOG_FORMAT, value: json}
                - {name: SAGAT_DB_MAX_CONNECTIONS, value: "2"}
                - {name: SAGAT_DB_STATEMENT_TIMEOUT_MS, value: {{ .Values.database.statementTimeoutMs | quote }}}
                - {name: SAGAT_SECRET_CLEANUP_BATCH, value: {{ .Values.openbao.cleanup.batch | quote }}}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: {{ .Values.database.existingSecret | quote }}, key: DATABASE_URL}
                {{- include "sagat.openbao.env" $ctx | nindent 16 }}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              {{- include "sagat.containerSecurity" . | nindent 14 }}
              volumeMounts:
                {{- include "sagat.openbao.mounts" $ctx | nindent 16 }}
          volumes:
            {{- include "sagat.openbao.volumes" $ctx | nindent 12 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sagat.fullname" . }}-secret-cleanup
spec:
  podSelector:
    matchLabels:
      {{- include "sagat.selector" $ctx | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
      to:
        {{- toYaml .Values.networkPolicy.egress.dnsTo | nindent 8 }}
    - ports: [{port: {{ .Values.networkPolicy.egress.postgres.port }}, protocol: TCP}]
      to:
        {{- toYaml .Values.networkPolicy.egress.postgres.to | nindent 8 }}
    - ports: [{port: {{ .Values.openbao.network.port }}, protocol: TCP}]
      to:
        {{- toYaml .Values.openbao.network.to | nindent 8 }}
{{- end }}
{{- end }}
