{{- include "sagat.validate" . -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sagat.fullname" . }}
  labels:
    {{- include "sagat.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in the platform calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
