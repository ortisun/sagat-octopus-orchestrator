        finishedAt: {type: string, format: date-time}
    ScriptTestRunList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScriptTestRunSummary'}}
    ScriptExecution:
      type: object
      required: [id, artifactDigest, status, log, logTruncated, denied, wallMs, startMs, createdAt, expiresAt]
