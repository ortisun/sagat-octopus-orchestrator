        '200': {description: 'The policy', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerEgressPolicy'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /script-runner/namespaces/{namespaceId}/pending-activities:
    get:
      operationId: listRunnerPendingActivities
      summary: List the script activities that have a step ready
      tags: [Scripts]
      x-implemented: '005'
      description: |
        Needs `script:execute`. At most 256 names (`script.sha256-<hex>`): what a runner advertises in a worker session to be handed those steps.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
      responses:
        '200': {description: 'The activities', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PendingActivities'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /script-runner/executions:
    post:
      operationId: recordScriptExecution
      summary: Keep the record of what a script did
      tags: [Scripts]
      x-implemented: '005'
      description: |
        Needs `script:execute`. Once per run, node and attempt (`recorded` is `false` for a repeat). What the script was refused (`denied`, at most ten entries, as `fetch <scheme>://<host>` or `secret <name>`) is audited once per script and kind, however often it asks. The log is cut at 1 MiB and redacted again.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordExecutionRequest'}
      responses:
        '201': {description: 'Recorded', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Recorded'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /script-runner/incidents:
    post:
      operationId: recordScriptRunnerIncident
      summary: Commit a supervisor denial before acknowledging it to a script
      tags: [Scripts]
      x-implemented: '009'
      description: |
        Needs `script:execute`. Validates the authenticated runner against the current production
        step lease, worker session and binding, or against the current test-run lease. The request
        accepts only a closed denial category and fenced identifiers; it cannot carry a destination,
        actor, digest, URL, headers, payload or free-form reason. `204` is returned only after the
        audit transaction commits. An identical retry is an idempotent `204`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordRunnerIncidentRequest'}
      responses:
        '204': {description: 'Incident committed, or committed already', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    webhookHmac: {type: apiKey, in: header, name: X-Octopus-Signature, description: 'Required only for endpoints configured with the HMAC profile.'}
    webhookOidc: {type: http, scheme: bearer, bearerFormat: JWT, description: 'Requires the exact deployment-approved verifier and endpoint subject.'}
    webhookMtls: {type: mutualTLS, description: 'Native TLS client identity must match the endpoint leaf certificate fingerprint.'}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    HttpRequestId:
      description: Server-generated id unique to this HTTP request; independent of the caller's traceparent or X-Request-Id.
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
    TraceId:
      description: W3C trace id (32 lowercase hex characters) of the request, for log and trace correlation.
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  parameters:
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional retry key for identity creation. Same tenant, operation and key with the
        same body returns the original 201 response without another audit record.
        A different body returns 409 IDEMPOTENCY_KEY_REUSED. Namespace keys are scoped
        to the workspace. Without a key, a repeated slug returns 409 as before.
        Replay records follow the platform command retention window (7 days by default).
      schema: {type: string, minLength: 8, maxLength: 160, pattern: '^[!-~]+$'}
    Namespace:
      name: X-Octopus-Namespace
      in: header
      required: true
      description: Namespace; authorization derives tenant from token, not header.
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 160}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `nextCursor` by the previous page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size; values outside 1..200 are clamped.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    WorkerSubject:
      name: subject
      in: path
      required: true
      description: The identity (the `sub` of its token), URL-encoded.
      schema: {type: string, minLength: 1, maxLength: 255}
    SecretName:
      name: secretName
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DeadLetterId:
      name: deadLetterId
      in: path
      required: true
      schema: {type: string, format: uuid}
    QuotaResourceName:
      name: resource
      in: path
      required: true
      schema: {type: string, enum: [active_runs, tenant_active_runs, workflows, worker_sessions, activity_concurrency, secrets, event_endpoints, webhook_subscriptions, broker_subscriptions, event_connectors, scripts, script_jobs, tenant_content_bytes, tenant_log_bytes, api_requests_per_second, events_per_second, event_retention_seconds, script_retention_days]}
    ActivityName:
      name: activity
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: {type: string}
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    RequestId:
      name: requestId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ScriptId:
      name: scriptId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TestRunId:
      name: testRunId
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactDigest:
      name: digest
      in: path
      required: true
      schema: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    ScriptAfter:
      name: after
      in: query
      required: false
      schema: {type: string}
    VersionBefore:
      name: before
      in: query
      required: false
      schema: {type: integer, minimum: 1}
    PageLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200}
    ExecutionDigest:
      name: digest
      in: query
      required: false
      schema: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExecutionBefore:
      name: before
      in: query
      required: false
      schema: {type: string, format: uuid}
  schemas:
    PayloadInspectionSelector:
      oneOf:
        - type: object
          additionalProperties: false
          required: [source]
          properties:
            source: {type: string, const: input}
        - type: object
          additionalProperties: false
          required: [source, sequence]
          properties:
            source: {type: string, const: journal}
            sequence: {type: integer, minimum: 1, maximum: 9223372036854775807}
    PayloadStructure:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, childCount, children, omittedChildren]
          properties:
            type: {type: string, enum: [object, array]}
            childCount: {type: integer, minimum: 0}
            children:
              type: array
              maxItems: 32
              items: {$ref: '#/components/schemas/PayloadStructure'}
            omittedChildren: {type: integer, minimum: 0}
        - type: object
          additionalProperties: false
          required: [type, redacted]
          properties:
            type: {type: string, enum: [string, number, boolean, 'null']}
            redacted: {type: boolean, const: true}
    PayloadInspection:
      allOf:
        - type: object
          required: [runId, runVersion, selection, policy]
          properties:
            runId: {type: string, format: uuid}
            runVersion: {type: integer, minimum: 0}
            selection: {$ref: '#/components/schemas/PayloadInspectionSelector'}
            nodeId: {type: string}
            attempt: {type: integer, minimum: 0}
            policy: {type: string, const: structure-only-v1}
        - oneOf:
            - type: object
              required: [kind, sizeBytes, truncated, tree]
              properties:
                kind: {type: string, const: inline-json}
                sizeBytes: {type: integer, minimum: 0}
                truncated: {type: boolean}
                tree: {$ref: '#/components/schemas/PayloadStructure'}
            - type: object
              required: [kind, sizeBytes, contentKind, reason]
              properties:
                kind: {type: string, const: external}
                sizeBytes: {type: integer, minimum: 0}
                contentKind: {type: string, enum: [json, text, binary, other]}
                reason: {type: string, const: EXTERNAL_CONTENT_NOT_INSPECTED}
            - type: object
              required: [kind, reason]
              properties:
                kind: {type: string, const: unavailable}
                reason: {type: string, enum: [NO_RETAINED_PAYLOAD, UNSUPPORTED_FORMAT]}
                sizeBytes: {type: integer, minimum: 0}
      unevaluatedProperties: false
    JsonObject: {type: object, additionalProperties: true}
    Error:
      type: object
      required: [code, message, retryable, traceId]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, RATE_LIMITED, QUOTA_EXCEEDED, UNAVAILABLE, INTERNAL]
        message: {type: string, description: "Safe, human-readable summary. Never contains secrets, payloads or other tenants' data."}
        retryable: {type: boolean}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
        requestId: {type: string, pattern: '^[0-9a-f]{32}$', description: 'Server-generated request correlation id; equals X-Request-Id. Absent on older servers.'}
        remediation:
          type: string
          description: >-
            What can be done about it, in a sentence from a closed table: the same for every error of a `code`, refined
            by `details.reason` when that changes what to do. It never carries a payload, a secret or another tenant's
            data. Absent from the errors of a platform older than feature 008.
        details:
          type: object
          additionalProperties: true
          description: >-
            Extra, safe context. `reason` is a stable machine-readable refinement of `code` (for example
            `IDEMPOTENCY_KEY_REUSED`, `STATE_CONFLICT`). A call the server does not have is `NOT_FOUND` with the
            reason `ROUTE_NOT_FOUND` (an unknown path) or `BAD_REQUEST` with `METHOD_NOT_ALLOWED` (a known path,
            another method): an SDK newer than the server tells that from a resource that does not exist, which is
            `NOT_FOUND` without those reasons.
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    PlatformVersion:
      type: object
      required: [service, version, apiVersion, workerProtocol]
      properties:
        service: {type: string, const: sagat-octopus-orchestrator}
        version: {type: string, description: 'The build, as `control-plane version` prints it.'}
        apiVersion: {type: string, const: v1}
        workerProtocol:
          type: object
          required: [minimum, maximum]
          properties:
            minimum: {type: string, pattern: '^1\.[0-9]+$'}
            maximum: {type: string, pattern: '^1\.[0-9]+$'}
    AuthContext:
      type: object
      required: [tenant, subject, role, permissions, traceId]
      properties:
        tenant: {type: string, description: Slug of the caller's tenant.}
        subject: {type: string}
        role: {type: string, enum: [admin, developer, operator, viewer, worker, runner, database-runner]}
        permissions:
          type: array
          items: {type: string, example: 'workspace:read'}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
    Workspace:
      type: object
      required: [id, slug, createdAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        createdAt: {type: string, format: date-time}
    CreateWorkspaceRequest:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', description: 'Unique inside the tenant. 3-63 characters; no consecutive hyphens.'}
    WorkspacePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Workspace'}}
        nextCursor: {type: [string, 'null']}
    NamespaceResource:
      type: object
      required: [id, workspaceId, slug, environment, createdAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        environment: {type: string, enum: [dev, staging, prod]}
        createdAt: {type: string, format: date-time}
    CreateNamespaceRequest:
      type: object
      required: [slug, environment]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', description: 'Unique inside the tenant (not only inside the workspace).'}
        environment: {type: string, enum: [dev, staging, prod]}
    NamespacePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/NamespaceResource'}}
        nextCursor: {type: [string, 'null']}
    CreateWorkflowRequest:
      type: object
      required: [name, ir]
      properties:
        name: {type: string, description: 'Workflow name (a slug); the document must name the same workflow.'}
        ir: {$ref: '#/components/schemas/JsonObject'}
    UpdateDraftRequest:
      type: object
      required: [draftRevision, ir]
      additionalProperties: false
      properties:
        draftRevision: {type: integer, minimum: 1, description: 'The revision the client edited; a stale one is refused with 409.'}
        ir: {$ref: '#/components/schemas/JsonObject'}
    PublishRequest:
      type: object
      required: [draftRevision]
      additionalProperties: false
      properties:
        draftRevision: {type: integer, minimum: 1}
        releaseNotes: {type: string, maxLength: 2048}
    VersionSummary:
      type: object
      required: [workflowId, versionId, versionNumber, digest]
      properties:
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        versionNumber: {type: integer, minimum: 1}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        publishedBy: {type: string}
        publishedAt: {type: string, format: date-time}
    WorkflowDraft:
      type: object
      required: [id, name, draftRevision, ir]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        draftRevision: {type: integer, minimum: 1}
        ir: {$ref: '#/components/schemas/JsonObject'}
        activeVersion: {oneOf: [{$ref: '#/components/schemas/VersionSummary'}, {type: 'null'}]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    WorkflowVersion:
      allOf:
        - $ref: '#/components/schemas/VersionSummary'
        - type: object
          required: [created, warnings]
          properties:
            created: {type: boolean, description: 'False when the document was identical to an existing version, which was re-activated.'}
            warnings: {type: array, items: {type: string}}
    WorkflowVersionDocument:
      allOf:
        - $ref: '#/components/schemas/VersionSummary'
        - type: object
          required: [document]
          properties:
            releaseNotes: {type: [string, 'null']}
            document: {$ref: '#/components/schemas/JsonObject'}
            scripts: {type: array, items: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}, description: 'The digests of the script artifacts the version pins (feature 011), sorted. Present when a single version is read.'}
    VersionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkflowVersionDocument'}}
        nextCursor: {type: [string, 'null']}
    WorkflowPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkflowDraft'}}
        nextCursor: {type: [string, 'null']}
    StartRunRequest:
      type: object
      required: [workflowId]
      additionalProperties: false
      oneOf:
        - required: [input]
          not: {required: [inputBlobRef]}
        - required: [inputBlobRef]
          not: {required: [input]}
      properties:
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid, description: 'Optional explicit pin; the active version otherwise.'}
        input: {$ref: '#/components/schemas/JsonObject'}
        inputBlobRef: {type: string, format: uuid, description: 'An unused run-input blob uploaded by this subject in this namespace. The run input is its canonical $blob descriptor.'}
        correlationId: {type: string, maxLength: 160}
        deadline: {type: string, format: date-time, description: 'Must be in the future and within a year; the run times out at this instant.'}
    BlobDescriptor:
      type: object
      required: [id, size, sha256, contentType]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        size: {type: integer, format: int64, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        contentType: {type: string, maxLength: 127}
    Run:
      type: object
      required: [runId, workflowId, versionId, status, version, createdAt]
      properties:
        runId: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        status: {type: string, enum: [RUNNING, WAITING, PAUSED, CANCELLING, COMPENSATING, MANUAL_REVIEW, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, COMPENSATED, PARTIAL, COMPENSATION_FAILED]}
        version: {type: integer, format: int64, minimum: 0, description: 'Number of journal events applied; usable as expectedRunVersion.'}
        paused: {type: boolean}
        startedBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        deadline: {type: [string, 'null'], format: date-time}
        traceId: {type: [string, 'null']}
        correlationId: {type: [string, 'null']}
        rerunOf: {type: string, format: uuid, description: 'The ended run this one was started again from (RERUN_AS_NEW), when it was.'}
        depth: {type: integer, minimum: 0, maximum: 8, description: 'Nesting of child runs: 0 for a run started through the API.'}
        parent:
          type: [object, 'null']
          description: 'Set when this run is the child of a `child` node of another run.'
          required: [runId, node, cancelPolicy]
          properties:
            runId: {type: string, format: uuid}
            node: {type: string}
            cancelPolicy: {type: string, enum: [PROPAGATE, REQUEST_CANCEL, DETACH]}
    RunPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Run'}}
        nextCursor: {type: [string, 'null']}
    JournalEvent:
      type: object
      required: [seq, eventType, occurredAt, actor]
      properties:
        seq: {type: integer, format: int64, minimum: 1}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        stepId: {type: [string, 'null'], description: 'The node id the event concerns.'}
        attempt: {type: [integer, 'null']}
        actor: {type: string, description: 'user:<sub>, worker:<id> or system:<component>.'}
        traceId: {type: [string, 'null']}
        payloadRef: {type: [string, 'null'], description: 'SHA-256 of the output payload the event refers to.'}
        cause: {anyOf: [{$ref: '#/components/schemas/Cause'}, {type: 'null'}], description: 'Why it happened, when the event is the result of something going wrong, a person''s choice or the clock.'}
        spanId: {type: [string, 'null'], pattern: '^[0-9a-f]{16}$', description: 'For the events of an attempt: its span in the run''s trace (`traceId` of the run).'}
    Cause:
      type: object
      required: [kind, code]
      properties:
        kind: {type: string, enum: [failure, retry, review, abort, unknown_outcome, reconciliation, stop, timeout, cancel, decision, request, outcome], description: 'A closed set.'}
        code: {type: string, description: 'A failure code, a stop reason, what an operator decided or asked for, or the status a run ended with.'}
    RunTelemetry:
      type: object
      required: [runId, state, lagMs, budgetMs]
      properties:
        runId: {type: string, format: uuid}
        traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
        state: {type: string, enum: [CURRENT, CATCHING_UP, BEHIND, NO_TRACE, UNTRACKED]}
        headSeq: {type: [integer, 'null'], format: int64, description: 'The last sequence of the run''s journal, as the projector was told.'}
        appliedSeq: {type: [integer, 'null'], format: int64, description: 'The last sequence whose spans were taken by the collector.'}
        lagMs: {type: integer, format: int64, minimum: 0, description: 'For how long the run has had changes that are not projected.'}
        budgetMs: {type: integer, format: int64, minimum: 0, description: 'How late spans may be before the state is BEHIND.'}
    Attempt:
      type: object
      required: [node, attempt, generation, spanId, leasedAt, outcome]
      properties:
        node: {type: string}
        attempt: {type: integer, minimum: 1}
        generation: {type: integer, format: int64, minimum: 0}
        spanId: {type: string, pattern: '^[0-9a-f]{16}$'}
        readyAt: {type: [string, 'null'], format: date-time}
        leasedAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        outcome: {type: string, enum: [open, succeeded, failed, retry, review, unknown_outcome, cancelled]}
        code: {type: [string, 'null'], description: 'The failure code, when the attempt did not succeed.'}
        scheduleLatencyMs: {type: [integer, 'null'], format: int64, minimum: 0, description: 'From ready to leased, when the journal says when it became ready.'}
    AttemptList:
      type: object
      required: [runId, items]
      properties:
        runId: {type: string, format: uuid}
        traceId: {type: [string, 'null']}
        items: {type: array, items: {$ref: '#/components/schemas/Attempt'}}
    JournalPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/JournalEvent'}}
        nextCursor: {type: [string, 'null']}
    ValidateRequest:
      type: object
      additionalProperties: false
      properties:
        ir: {$ref: '#/components/schemas/JsonObject'}
    DefinitionProblem:
      type: object
      required: [severity, code, message]
      properties:
        severity: {type: string, enum: [error, warning]}
        code: {type: string, description: 'Stable, upper snake case: SCHEMA, DOCUMENT_TOO_LARGE, DOCUMENT_MALFORMED, UNSUPPORTED_NODE, EXPRESSION, NAME_MISMATCH, UNKNOWN_SCRIPT, SECRET_UNAVAILABLE, CYCLE, UNREACHABLE, UNKNOWN_TARGET, UNKNOWN_ENTRYPOINT, DUPLICATE_NODE, and the other graph rules; a warning has its own (COMPENSATION_OUTSIDE_SAGA, RECURSIVE_CHILD).'}
        message: {type: string, description: 'Safe: never holds a value of the document beyond a clipped fragment.'}
        nodeId: {type: [string, 'null'], description: 'The node the problem is about, when a rule names one.'}
        path: {type: [string, 'null'], description: 'A JSON pointer into the document, for a schema problem.'}
    Validation:
      type: object
      required: [valid, problems, warnings]
      properties:
        valid: {type: boolean}
        digest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'The digest of the canonical document, when it is valid.'}
        problems: {type: array, items: {$ref: '#/components/schemas/DefinitionProblem'}}
        warnings: {type: array, items: {$ref: '#/components/schemas/DefinitionProblem'}}
    DiffSide:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [version, draft, empty]}
        number: {type: [integer, 'null'], description: 'The version number, for `version`.'}
        revision: {type: [integer, 'null'], description: 'The draft revision, for `draft`.'}
    DiffFinding:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: 'TRIGGER_REMOVED, TRIGGER_CHANGED, INPUT_PROPERTY_REMOVED, INPUT_TYPE_CHANGED, INPUT_REQUIRED_ADDED, OUTPUT_PROPERTY_REMOVED, OUTPUT_TYPE_CHANGED, EVENT_TYPE_REMOVED (breaking); ACTIVITY_ADDED, ACTIVITY_CHANGED, SECRET_ADDED, SCRIPT_CHANGED (attention).'}
        message: {type: string}
        nodeId: {type: [string, 'null']}
        path: {type: [string, 'null']}
    DiffEdge:
      type: object
      required: [from, to, kind]
      properties:
        from: {type: string}
        to: {type: string}
        kind: {type: string}
    DefinitionDiff:
      type: object
      required: [from, to, identical, nodes, edges, changes, breaking, attention]
      properties:
        from: {$ref: '#/components/schemas/DiffSide'}
        to: {$ref: '#/components/schemas/DiffSide'}
        identical: {type: boolean}
        nodes:
          type: object
          required: [added, removed, changed]
          properties:
            added: {type: array, items: {type: string}}
            removed: {type: array, items: {type: string}}
            changed:
              type: array
              items:
                type: object
                required: [id, fields]
                properties:
                  id: {type: string}
                  fields: {type: array, items: {type: string}, description: 'The top-level fields of the node that differ.'}
        edges:
          type: object
          required: [added, removed]
          properties:
            added: {type: array, items: {$ref: '#/components/schemas/DiffEdge'}}
            removed: {type: array, items: {$ref: '#/components/schemas/DiffEdge'}}
        changes:
          type: array
          description: 'Differences outside the nodes: metadata, entrypoint, triggers, schemas.'
          items:
            type: object
            required: [path, change]
            properties:
              path: {type: string}
              change: {type: string, enum: [added, removed, changed]}
        changesOmitted: {type: integer, minimum: 0, description: 'How many differences outside the nodes are not in `changes`, which lists the first thousand.'}
        breaking: {type: array, description: 'At most a hundred; a last finding with the code `MORE_FINDINGS` says how many more there are.', items: {$ref: '#/components/schemas/DiffFinding'}}
        attention: {type: array, description: 'At most a hundred; a last finding with the code `MORE_FINDINGS` says how many more there are.', items: {$ref: '#/components/schemas/DiffFinding'}}
    GraphEvent:
      type: object
      required: [seq, eventType, occurredAt]
      properties:
        seq: {type: integer, format: int64, minimum: 1}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        stepId: {type: [string, 'null']}
        attempt: {type: [integer, 'null']}
    GraphChanges:
      type: object
      required: [runId, status, fromSeq, projectionSeq, reset, events, nodes]
      properties:
        runId: {type: string, format: uuid}
        status: {type: string}
        fromSeq: {type: integer, format: int64, minimum: 0, description: 'The `since` the answer is relative to.'}
        projectionSeq: {type: integer, format: int64, minimum: 0}
        reset: {type: boolean, description: 'True when `nodes` and `edges` are the whole graph and the client must replace what it has.'}
        events: {type: array, items: {$ref: '#/components/schemas/GraphEvent'}}
        nodes: {type: array, items: {$ref: '#/components/schemas/RuntimeNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/RuntimeEdge'}, description: 'Only when `reset` is true.'}
    RuntimeNode:
      type: object
      required: [id, type, status]
      properties:
        id: {type: string}
        type: {type: string}
        status: {type: string, enum: [NOT_STARTED, PENDING, READY, LEASED, RUNNING, WAITING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED, SKIPPED]}
        attempt: {type: integer}
        generation: {type: integer}
        cancelRequested: {type: boolean}
        failureCode: {type: [string, 'null']}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        dueAt: {type: [string, 'null'], format: date-time}
        waitingOn: {type: [string, 'null'], enum: [timer, event, branches, child, saga, reconciliation, operator, null], description: '`saga`: a saga node while its body works, compensates or waits. `reconciliation`: the lookup `<id>~r` is finding out whether the effect happened. `operator`: a person has to decide (RETRY_STEP, RETRY_COMPENSATION, SKIP_COMPENSATION or RESOLVE_STEP).'}
        childRunId: {type: [string, 'null'], format: uuid, description: 'The child run a `child` node reserved.'}
        kind: {type: string, enum: [FORWARD, COMPENSATION, RECONCILIATION], description: 'Forward work, the compensation `<id>~c` of a node, or the lookup `<id>~r` that finds out whether it happened.'}
        forward: {type: [string, 'null'], description: 'For a compensation or a reconciliation: the forward node it is about.'}
        saga:
          type: [object, 'null']
          description: 'For a `saga` node: what the run knows about it.'
          required: [phase, irreversible]
          properties:
            phase: {type: string, enum: [FORWARD, ABORTING, COMPENSATING, DONE]}
            cause: {type: [string, 'null'], description: 'Why the saga compensates, or did.'}
            outcome: {type: [string, 'null'], enum: [COMPENSATED, PARTIAL, COMPENSATION_FAILED, null]}
            irreversible: {type: array, items: {type: string}, description: 'Completed steps whose effect could not be undone.'}
    RuntimeEdge:
      type: object
      required: [from, to, kind]
      properties:
        from: {type: string}
        to: {type: string}
        kind: {type: string, enum: [next, error, 'true', 'false', branch, timeout, begin, compensation, reconcile], description: '`begin`: the first step of the body of a saga. `compensation`: the compensation at `to` waits for the one at `from`. `reconcile`: `to` finds out whether `from` happened.'}
    RuntimeGraph:
      type: object
      required: [runId, projectionSeq, nodes, edges]
      properties:
        runId: {type: string, format: uuid}
        status: {type: string}
        projectionSeq: {type: integer, format: int64}
        projectionLagMs: {type: integer, minimum: 0}
        nodes: {type: array, items: {$ref: '#/components/schemas/RuntimeNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/RuntimeEdge'}}
    CompensationPlans:
      type: object
      required: [sagas]
      properties:
        sagas:
          type: array
          items:
            type: object
            required: [saga, onCompensationFailure, cancelPolicy, irreversible, compensations]
            properties:
              saga: {type: string}
              onCompensationFailure: {type: string, enum: [manual_review, fail]}
              cancelPolicy: {type: string, enum: [compensate_completed, abort_no_compensation, wait_in_flight_then_compensate]}
              irreversible: {type: array, items: {type: string}, description: 'Nodes whose effect cannot be undone: a saga that compensates past one ends PARTIAL.'}
              compensations:
                type: array
                description: In an order a worker could follow one by one; the last forward node comes first.
                items:
                  type: object
                  required: [position, node, compensationId, activity, after]
                  properties:
                    position: {type: integer, minimum: 0}
                    node: {type: string, description: 'The forward node the compensation undoes.'}
                    compensationId: {type: string, format: uuid, description: 'Stable for this version and node; with the run id it makes the idempotency key a provider sees.'}
                    activity: {type: string, description: 'The activity that undoes the node (`compensateWith`).'}
                    after: {type: array, items: {type: string}, description: 'Forward nodes whose compensations must finish before this one starts.'}
    OperationRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [PAUSE, RESUME, CANCEL, RETRY_STEP, RETRY_COMPENSATION, SKIP_COMPENSATION, RESOLVE_STEP, RERUN_AS_NEW, MARK_MANUAL_REVIEW]}
        stepId: {type: string, description: 'The node id of the step the operation is about (`reserve~c` for the compensation of `reserve`). Required for RETRY_STEP, RETRY_COMPENSATION, SKIP_COMPENSATION, RESOLVE_STEP and MARK_MANUAL_REVIEW; refused for the others.'}
        outcome: {type: string, enum: [SUCCEEDED, FAILED], description: 'For RESOLVE_STEP: the step happened, or it did not.'}
        errorCode: {type: string, description: 'For RESOLVE_STEP with outcome FAILED: the code the step is recorded as failed with.'}
        reason: {type: string, minLength: 8, maxLength: 2000, description: 'Counted after trimming; for the decisions of a saga it is kept whole in the audit trail.'}
        expectedRunVersion: {type: integer, minimum: 0, description: 'Optimistic concurrency: refused with 409 if the run moved on.'}
    OperationResult:
      type: object
      required: [operationId, accepted]
      properties:
        operationId: {type: string, format: uuid, description: 'Derived from the run and the Idempotency-Key: a request sent again with its key is answered with the same id. It names the request; it is not a stored record (the journal holds what was decided).'}
        accepted: {type: boolean}
        runStatus: {type: string}
        runVersion: {type: integer, format: int64}
        newRunId: {type: string, format: uuid, description: 'For RERUN_AS_NEW: the run that was started. `runStatus` and `runVersion` are those of the run it was started from.'}
    RevokedWorkers:
      type: object
      required: [sessionsClosed, leasesReleased]
      properties:
        sessionsClosed: {type: integer, minimum: 0}
        leasesReleased: {type: integer, minimum: 0}
    WorkerBinding:
      type: object
      required: [subject, activities]
      properties:
        subject: {type: string}
        activities: {type: array, items: {type: string}, description: 'Activity names, `<prefix>.*` or `*`.'}
        revoked: {$ref: '#/components/schemas/RevokedWorkers'}
    WorkerBindingList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkerBinding'}}
    SetWorkerBindingRequest:
      type: object
      additionalProperties: false
      required: [activities]
      properties:
        activities: {type: array, minItems: 1, maxItems: 64, items: {type: string, minLength: 1, maxLength: 130}}
    Secret:
      type: object
      required: [name, version, keyId, createdBy, updatedAt]
      properties:
        name: {type: string}
        version: {type: integer, minimum: 1}
        keyId: {type: [string, 'null'], description: 'Local encryption key identifier; null for OpenBao.'}
        provider: {type: string, enum: [local, openbao], description: 'Authority for the current secret version.'}
        createdBy: {type: string}
        updatedAt: {type: string, format: date-time}
    SecretList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Secret'}}
    SecretAccess:
      type: object
      required: [subjects]
      properties:
        subjects: {type: array, items: {type: string}}
    SetSecretRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: string, minLength: 1, maxLength: 16384, writeOnly: true, description: 'The secret, UTF-8 text of 1 to 16384 bytes. Never returned.'}
        requestId: {type: string, format: uuid, description: 'Required with OpenBao. Stable identity for retries of this exact write.'}
        expectedVersion: {type: integer, minimum: 0, maximum: 2147483646, description: 'Required with OpenBao. Zero creates; otherwise matches the current logical version.'}
        requiredProvider: {type: string, enum: [openbao], description: 'Refuse with 503 when this authority is not configured. Database connection forms must send this field.'}
    DatabaseResult:
