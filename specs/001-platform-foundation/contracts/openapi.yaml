openapi: 3.1.0
info:
  title: Sagat Octopus Orchestrator Control & Execution API
  version: 0.1.0
  description: |
    Design contract. Operations tagged `Identity` are implemented by the control plane (feature 001);
    every other operation is a design proposal that is not implemented yet.
    The database is the source of truth; commands may be redelivered.
    Tenant resolved by authentication, never from a free-form tenant_id supplied by the client.

    Authentication: `Authorization: Bearer <JWT>` issued by the configured OIDC provider. The token MUST carry
    `iss`, `aud`, `sub`, `exp`, `iat` and a tenant claim (default name `tenant`, the tenant slug). Only
    asymmetric algorithms (RS256, ES256) are accepted. A tenant is NEVER read from a header or a body.

    Errors use one envelope (`Error`). A resource that exists only in another tenant is reported as
    `NOT_FOUND`, indistinguishable from a missing one.

    Known gap: creating workspaces and namespaces is not yet idempotent through `Idempotency-Key`; a retry after
    an ambiguous response returns `409 CONFLICT` and the client should read the resource back.
servers:
  - url: https://api.sagat-octopus-orchestrator.example/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Workflows
  - name: Runs
  - name: Events
  - name: Scripts
  - name: Operations
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [Identity]
      security: []
      responses:
        '200': {description: The process is alive, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe (checks the database)
      tags: [Identity]
      security: []
      responses:
        '200': {description: Ready to serve traffic, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/context:
    get:
      operationId: getAuthContext
      summary: Describe the authenticated caller
      tags: [Identity]
      responses:
        '200': {description: Resolved identity of the caller, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AuthContext'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces of the caller's tenant
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: Page of workspaces, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspacePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201': {description: Workspace created, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get a workspace
      tags: [Identity]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: The workspace, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspaceId}/namespaces:
    post:
      operationId: createNamespace
      summary: Create a namespace inside a workspace
      tags: [Identity]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateNamespaceRequest'}
      responses:
        '201': {description: Namespace created, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespaceResource'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /namespaces:
    get:
      operationId: listNamespaces
      summary: List namespaces of the caller's tenant
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: Page of namespaces, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespacePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /namespaces/{namespaceId}:
    get:
      operationId: getNamespace
      summary: Get a namespace
      tags: [Identity]
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: The namespace, headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespaceResource'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workflows:
    get:
      operationId: listWorkflows
      summary: List workflows
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {description: Page of workflows, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createWorkflowDraft
      summary: Create a workflow draft
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowDraft'}
      responses:
        '201': {description: Draft created, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowDraft'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workflows/{workflowId}/publish:
    post:
      operationId: publishWorkflow
      summary: Publish an immutable workflow version
      tags: [Workflows]
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draftRevision]
              properties:
                draftRevision: {type: integer, minimum: 1}
                releaseNotes: {type: string, maxLength: 2048}
      responses:
        '201': {description: Immutable version published, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowVersion'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /runs:
    get:
      operationId: listRuns
      summary: List runs
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/Cursor'
        - name: workflowId
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string}
      responses:
        '200': {description: Page of runs, content: {application/json: {schema: {$ref: '#/components/schemas/RunPage'}}}}
    post:
      operationId: startRun
      summary: Start a run
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartRunRequest'}
      responses:
        '202': {description: Run durably accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Get run state
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Namespace'
      responses:
        '200': {description: Run state, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/events:
    get:
      operationId: listRunJournalEvents
      summary: List run journal events
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': {description: Paged journal timeline, content: {application/json: {schema: {$ref: '#/components/schemas/JournalPage'}}}}
  /runs/{runId}/graph:
    get:
      operationId: getRuntimeGraph
      summary: Get the projected runtime graph
      tags: [Runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Namespace'
        - name: afterSeq
          in: query
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200': {description: Projected runtime graph; may lag behind journal, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeGraph'}}}}
  /runs/{runId}/operations:
    post:
      operationId: operateRun
      summary: Apply an operator action to a run
      tags: [Operations]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationRequest'}
      responses:
        '202': {description: Operation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/OperationResult'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/signals/{signalName}:
    post:
      operationId: signalRun
      summary: Send a signal to a run
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: signalName
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventPayload'}
      responses:
        '202': {description: Signal durably admitted}
        '404': {$ref: '#/components/responses/NotFound'}
  /events:
    post:
      operationId: publishEvent
      summary: Publish an event to the inbox
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IncomingEvent'}
      responses:
        '202': {description: Event persisted to inbox}
        '409': {$ref: '#/components/responses/Conflict'}
  /webhooks/{endpointId}:
    post:
      security: []
      operationId: receiveSignedWebhook
      summary: Receive a signed webhook
      tags: [Events]
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: {type: string}
        - name: X-Octopus-Signature
          in: header
          required: true
          schema: {type: string}
        - name: X-Octopus-Timestamp
          in: header
          required: true
          schema: {type: string}
        - name: X-Octopus-Event-Id
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventPayload'}
      responses:
        '202': {description: "Signature verified, event durably admitted"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /scripts/builds:
    post:
      operationId: buildInlineScript
      summary: Build an inline script
      tags: [Scripts]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BuildRequest'}
      responses:
        '202': {description: Async isolated build accepted, content: {application/json: {schema: {$ref: '#/components/schemas/BuildStatus'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    TraceId:
      description: W3C trace id (32 lowercase hex characters) of the request, for log and trace correlation.
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  parameters:
    Namespace:
      name: X-Octopus-Namespace
      in: header
      required: true
      description: Namespace; authorization derives tenant from token, not header.
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 160}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `nextCursor` by the previous page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size; values outside 1..200 are clamped.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: {type: string}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    JsonObject: {type: object, additionalProperties: true}
    Error:
      type: object
      required: [code, message, retryable, traceId]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, RATE_LIMITED, UNAVAILABLE, INTERNAL]
        message: {type: string, description: "Safe, human-readable summary. Never contains secrets, payloads or other tenants' data."}
        retryable: {type: boolean}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
        details: {type: object, additionalProperties: true}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    AuthContext:
      type: object
      required: [tenant, subject, role, permissions, traceId]
      properties:
        tenant: {type: string, description: Slug of the caller's tenant.}
        subject: {type: string}
        role: {type: string, enum: [admin, developer, operator, viewer]}
        permissions:
          type: array
          items: {type: string, example: 'workspace:read'}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
    Workspace:
      type: object
      required: [id, slug, createdAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        createdAt: {type: string, format: date-time}
    CreateWorkspaceRequest:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', description: 'Unique inside the tenant. 3-63 characters; no consecutive hyphens.'}
    WorkspacePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Workspace'}}
        nextCursor: {type: [string, 'null']}
    NamespaceResource:
      type: object
      required: [id, workspaceId, slug, environment, createdAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        environment: {type: string, enum: [dev, staging, prod]}
        createdAt: {type: string, format: date-time}
    CreateNamespaceRequest:
      type: object
      required: [slug, environment]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', description: 'Unique inside the tenant (not only inside the workspace).'}
        environment: {type: string, enum: [dev, staging, prod]}
    NamespacePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/NamespaceResource'}}
        nextCursor: {type: [string, 'null']}
    WorkflowDraft:
      type: object
      required: [name, ir]
      properties:
        id: {type: string}
        name: {type: string}
        draftRevision: {type: integer, minimum: 1}
        ir: {$ref: '#/components/schemas/JsonObject'}
    WorkflowVersion:
      type: object
      required: [workflowId, versionId, digest]
      properties:
        workflowId: {type: string}
        versionId: {type: string}
        digest: {type: string}
        publishedAt: {type: string, format: date-time}
    WorkflowPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkflowDraft'}}
        nextCursor: {type: [string, 'null']}
    StartRunRequest:
      type: object
      required: [workflowId, input]
      properties:
        workflowId: {type: string}
        versionId: {type: string, description: Optional explicit pin.}
        input: {$ref: '#/components/schemas/JsonObject'}
        correlationId: {type: string}
        deadline: {type: string, format: date-time}
    Run:
      type: object
      required: [runId, workflowId, versionId, status, createdAt]
      properties:
        runId: {type: string, format: uuid}
        workflowId: {type: string}
        versionId: {type: string}
        status: {type: string, enum: [CREATED, READY, RUNNING, WAITING, PAUSED, COMPENSATING, CANCELLING, SUCCEEDED, FAILED, COMPENSATED, COMPENSATION_FAILED, CANCELLED, TIMED_OUT]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        traceId: {type: string}
        correlationId: {type: string}
    RunPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Run'}}
        nextCursor: {type: [string, 'null']}
    JournalEvent:
      type: object
      required: [seq, eventType, occurredAt]
      properties:
        seq: {type: integer, format: int64}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        stepId: {type: string}
        attempt: {type: integer}
        traceId: {type: string}
        payloadRef: {type: string}
    JournalPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/JournalEvent'}}
        nextCursor: {type: [string, 'null']}
    RuntimeGraph:
      type: object
      required: [runId, projectionSeq, nodes, edges]
      properties:
        runId: {type: string, format: uuid}
        projectionSeq: {type: integer, format: int64}
        projectionLagMs: {type: integer, minimum: 0}
        nodes: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}
        edges: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}
    OperationRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [PAUSE, RESUME, CANCEL, RETRY_STEP, RETRY_COMPENSATION, RERUN_AS_NEW, MARK_MANUAL_REVIEW]}
        stepId: {type: string}
        reason: {type: string, minLength: 8, maxLength: 2000}
        expectedRunVersion: {type: integer}
    OperationResult:
      type: object
      required: [operationId, accepted]
      properties:
        operationId: {type: string, format: uuid}
        accepted: {type: boolean}
    EventPayload: {$ref: '#/components/schemas/JsonObject'}
    IncomingEvent:
      type: object
      required: [eventId, type, data]
      properties:
        eventId: {type: string}
        type: {type: string}
        subject: {type: string}
        occurredAt: {type: string, format: date-time}
        correlationKey: {type: string}
        data: {$ref: '#/components/schemas/JsonObject'}
    BuildRequest:
      type: object
      required: [language, source, lockfile]
      properties:
        language: {type: string, enum: [typescript, python, csharp, go, java]}
        source: {type: string}
        lockfile: {type: string}
        toolchain: {type: string}
    BuildStatus:
      type: object
      required: [buildId, status]
      properties:
        buildId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, BUILDING, SUCCEEDED, FAILED, CANCELLED]}
        artifactDigest: {type: string}
  responses:
    Unauthorized: {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflict or stale version, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Invalid input/schema/graph, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooManyRequests: {description: The tenant exceeded its request budget; retry after the delay in Retry-After, headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: A dependency is temporarily unavailable; retry later, headers: {Retry-After: {schema: {type: integer, minimum: 0}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InternalError: {description: Unexpected failure, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
