    DatabaseLimits:
      type: object
      additionalProperties: false
      description: Positive finite limits. Effective execution uses the minimum of operation, connection, namespace and deployment limits. Zero never means unlimited.
      properties:
        maxStatementBytes: {type: integer, minimum: 1, maximum: 65536, default: 16384}
        maxParameters: {type: integer, minimum: 1, maximum: 256, default: 64}
        maxParameterBytes: {type: integer, minimum: 1, maximum: 262144, default: 65536}
        maxRows: {type: integer, minimum: 1, maximum: 10000, default: 1000}
        maxResultBytes: {type: integer, minimum: 1, maximum: 4194304, default: 1048576}
        timeoutMs: {type: integer, minimum: 1, maximum: 30000, default: 10000}
        connectTimeoutMs: {type: integer, minimum: 1, maximum: 10000, default: 5000}
        poolSize: {type: integer, minimum: 1, maximum: 16, default: 4}
        idleTimeoutMs: {type: integer, minimum: 1, maximum: 60000, default: 30000}
    DatabaseTls:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: {type: string, const: verify-full}
            caPem: {type: string, maxLength: 65536, description: 'Optional public CA certificates, never a private key'}
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: {type: string, const: development-plaintext}
          description: Requires a development namespace and an explicitly permissive development runner deployment.
    PostgresConnectionConfig:
      type: object
      additionalProperties: false
      required: [driver, host, port, database, tls, secretName]
      properties:
        driver: {type: string, const: postgresql}
        host: {type: string, minLength: 1, maxLength: 253, description: 'Bare DNS hostname or IP, never a URL or credentials'}
        port: {type: integer, minimum: 1, maximum: 65535}
        database: {type: string, minLength: 1, maxLength: 63}
        tls: {$ref: '#/components/schemas/DatabaseTls'}
        secretName: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$'}
        limits: {$ref: '#/components/schemas/DatabaseLimits'}
    DatabaseConnection:
      type: object
      additionalProperties: false
      required: [id, namespaceId, name, revision, status, config, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        name: {type: string}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [ACTIVE, PAUSED, DELETED]}
        config: {$ref: '#/components/schemas/PostgresConnectionConfig'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DatabaseConnectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/DatabaseConnection'}}
    PutDatabaseConnectionRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision, config, status]
      properties:
        requestId: {type: string, format: uuid}
        expectedRevision: {type: integer, minimum: 0, maximum: 2147483646}
        config: {$ref: '#/components/schemas/PostgresConnectionConfig'}
        status: {type: string, enum: [ACTIVE, PAUSED]}
    DeleteDatabaseConnectionRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision]
      properties:
        requestId: {type: string, format: uuid}
        expectedRevision: {type: integer, minimum: 1, maximum: 2147483646}
    MigrateSecretRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedVersion]
      properties:
        requestId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 1, maximum: 2147483646}
    EgressPolicy:
      type: object
      required: [rules, ports, allowHttp]
      properties:
        rules: {type: array, items: {type: string}, description: 'Exact hosts, `*.domain` rules and CIDR networks, lower-cased and masked.'}
        ports: {type: array, items: {type: integer, minimum: 1, maximum: 65535}, description: 'Empty means 443 (and 80 when plain HTTP is allowed).'}
        allowHttp: {type: boolean}
    SetEgressPolicyRequest:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules: {type: array, maxItems: 256, items: {type: string, minLength: 1, maxLength: 260}}
        ports: {type: array, maxItems: 32, items: {type: integer, minimum: 1, maximum: 65535}}
        allowHttp: {type: boolean, default: false}
    Quota:
      description: |
        Limits use resource-specific units: existing count resources are items (maximum 1,000,000,000);
        tenant_content_bytes and tenant_log_bytes are logical retained bytes (maximum 2^50);
        api_requests_per_second and events_per_second are requests/second (maximum 1,000,000,
        fixed two-second burst); event_retention_seconds is 0 or 60..2,592,000 seconds;
        script_retention_days is 0..365 days. Zero disables new admission for that resource.
        Lowering a limit does not erase retained content or rewrite existing expiry.
      type: object
      required: [resource, limit, source, ceiling]
      properties:
        resource: {type: string, enum: [active_runs, tenant_active_runs, workflows, worker_sessions, activity_concurrency, secrets, event_endpoints, webhook_subscriptions, broker_subscriptions, event_connectors, scripts, script_jobs, tenant_content_bytes, tenant_log_bytes, api_requests_per_second, events_per_second, event_retention_seconds, script_retention_days]}
        limit: {type: integer, format: int64, minimum: 0, maximum: 1125899906842624}
        source: {type: string, enum: [default, tenant, namespace], description: 'Where the limit in force comes from. default means the tenant set nothing and the ceiling applies.'}
        ceiling: {type: integer, format: int64, minimum: 0, maximum: 1125899906842624, description: 'The most the tenant may set for this resource, and the most that can be in force. The platform default unless an operator granted the tenant more. No API call raises it.'}
        used: {type: integer, format: int64, minimum: 0, description: 'Exact charged items or bytes, including outstanding content reservations. Absent for rate/retention policies and for a per-namespace resource in the tenant-wide view.'}
    QuotaList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Quota'}}
    SetQuotaRequest:
      description: |
        The selected path resource determines the unit and valid range documented by Quota.
        Values outside that range or above the operator ceiling return 422. The general schema
        maximum accommodates byte quotas; it does not raise the maximum of count resources.
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit: {type: integer, format: int64, minimum: 0, maximum: 1125899906842624}
    ActivityQuota:
      type: object
      required: [activity, limit, used, ceiling, overridden]
      properties:
        activity: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]*$'}
        limit: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        used: {type: integer, format: int64, minimum: 0, description: 'Tasks of this activity holding an unexpired lease now.'}
        ceiling: {type: integer, format: int64, minimum: 0, maximum: 1000000000, description: 'The most the tenant may set for activity concurrency.'}
        overridden: {type: boolean, description: 'True for an explicit activity override; false after clearing it, when the generic limit applies.'}
    ActivityQuotaList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ActivityQuota'}}
    SignalResult:
      type: object
      required: [deliveredTo]
      properties:
        deliveredTo: {type: array, items: {type: string}, description: 'The waitEvent nodes the signal woke.'}
    EventPayload: {$ref: '#/components/schemas/JsonObject'}
    IncomingEvent:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        eventId: {type: string, minLength: 1, maxLength: 200, description: 'Unique within the source for the deduplication window. Printable ASCII without spaces. Absent: the platform makes one up.'}
        type: {type: string, description: 'What happened, such as order.created.'}
        subject: {type: string, maxLength: 256}
        occurredAt: {type: string, format: date-time}
        correlationKey: {type: string, maxLength: 256, description: 'What a waiting step correlates on.'}
        data: {$ref: '#/components/schemas/JsonObject'}
        dedupeTtlSeconds: {type: integer, minimum: 60, maximum: 2592000, description: 'How long the event id is remembered (24 hours by default), bounded by the current namespace event_retention_seconds policy. A remembered duplicate preserves its original expiry.'}
    EventAccepted:
      type: object
      required: [eventId, source, status]
      properties:
        eventId: {type: string}
        source: {type: string, description: 'api, or the slug of the endpoint or connector the event came through.'}
        status: {type: string, enum: [ACCEPTED, DUPLICATE]}
    WebhookAuthentication:
      description: 'Omitted on writes means HMAC and requires secretName. OIDC and MTLS prohibit secretName; OIDC names a deployment-approved verifier, never a URL. All profiles require timestamp and event ID.'
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {type: string, const: HMAC}
        - type: object
          additionalProperties: false
          required: [kind, profile, subject]
          properties:
            kind: {type: string, const: OIDC}
            profile: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', not: {pattern: '--'}}
            subject: {type: string, minLength: 1, maxLength: 255, description: 'At most 255 UTF-8 bytes; control characters are prohibited.'}
        - type: object
          additionalProperties: false
          required: [kind, certificateSha256]
          properties:
            kind: {type: string, const: MTLS}
            certificateSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    EventEndpoint:
      type: object
      allOf:
        - if:
            properties:
              authentication:
                properties:
                  kind: {const: HMAC}
          then: {required: [secretName]}
          else: {not: {required: [secretName]}}
      required: [id, namespaceId, slug, authentication, dedupeTtlSeconds, skewSeconds, maxBodyBytes, ratePerSecond, status, webhookPath, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        slug: {type: string, description: 'What a webhook trigger names, and the source of the events it admits.'}
        secretName: {type: string}
        authentication: {$ref: '#/components/schemas/WebhookAuthentication'}
        defaultEventType: {type: string}
        dedupeTtlSeconds: {type: integer}
        skewSeconds: {type: integer}
        maxBodyBytes: {type: integer}
        ratePerSecond: {type: integer}
        status: {type: string, enum: [ACTIVE, PAUSED]}
        webhookPath: {type: string, description: 'The path providers post to, relative to the host.'}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    EventEndpointList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EventEndpoint'}}
    CreateEventEndpointRequest:
      type: object
      allOf:
        - if:
            properties:
              authentication:
                properties:
                  kind: {const: HMAC}
          then: {required: [secretName]}
          else: {not: {required: [secretName]}}
      additionalProperties: false
      required: [slug]
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        secretName: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        authentication: {$ref: '#/components/schemas/WebhookAuthentication'}
        defaultEventType: {type: string}
        dedupeTtlSeconds: {type: integer, minimum: 60, maximum: 2592000, default: 86400, description: 'At least twice skewSeconds and 60 seconds more, bounded by event_retention_seconds. Incompatible windows are rejected, never silently shortened.'}
        skewSeconds: {type: integer, minimum: 1, maximum: 3600, default: 300}
        maxBodyBytes: {type: integer, minimum: 1024, maximum: 245760, default: 245760}
        ratePerSecond: {type: integer, minimum: 1, maximum: 10000, default: 50}
        status: {type: string, enum: [ACTIVE, PAUSED], default: ACTIVE}
    UpdateEventEndpointRequest:
      type: object
      allOf:
        - if:
            properties:
              authentication:
                properties:
                  kind: {const: HMAC}
          then: {required: [secretName]}
          else: {not: {required: [secretName]}}
      additionalProperties: false
      properties:
        secretName: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        authentication: {$ref: '#/components/schemas/WebhookAuthentication'}
        defaultEventType: {type: string}
        dedupeTtlSeconds: {type: integer, minimum: 60, maximum: 2592000, default: 86400}
        skewSeconds: {type: integer, minimum: 1, maximum: 3600, default: 300}
        maxBodyBytes: {type: integer, minimum: 1024, maximum: 245760, default: 245760}
        ratePerSecond: {type: integer, minimum: 1, maximum: 10000, default: 50}
        status: {type: string, enum: [ACTIVE, PAUSED], default: ACTIVE}
    EventDelivery:
      type: object
      required: [consumer, deliveredAt]
      properties:
        consumer: {type: string, description: '`wait:{run}/{node}` for a waiting step, `trigger:{id}` for a trigger.'}
        runId: {type: string, format: uuid}
        node: {type: string}
        triggerId: {type: string, format: uuid}
        deliveredAt: {type: string, format: date-time}
    InboxEvent:
      type: object
      required: [eventId, source, type, receivedAt, expiresAt, status, attempts, data, deliveries]
      properties:
        eventId: {type: string}
        source: {type: string}
        type: {type: string}
        subject: {type: string}
        correlationKey: {type: string}
        occurredAt: {type: string, format: date-time}
        receivedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: 'The end of the deduplication window.'}
        status: {type: string, enum: [PENDING, DISPATCHED, DEAD]}
        attempts: {type: integer, description: 'Dispatches that failed before the last.'}
        lastError: {type: string}
        dispatchedAt: {type: string, format: date-time}
        data: {$ref: '#/components/schemas/JsonObject'}
        deliveries: {type: array, items: {$ref: '#/components/schemas/EventDelivery'}}
    BrokerSubscription:
      type: object
      required: [id, namespaceId, name, kind, settings, events, ratePerSecond, timeoutMs, status, health, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [NATS, KAFKA, SQS]}
        settings: {$ref: '#/components/schemas/OutboundBrokerSettings'}
        secretName: {type: string, description: 'Optional namespace secret containing the broker credentials JSON.'}
        events: {type: array, items: {type: string, enum: [run.finished, ops.alert.fired, ops.alert.resolved]}}
        ratePerSecond: {type: integer}
        timeoutMs: {type: integer}
        status: {type: string, enum: [ACTIVE, PAUSED, DISABLED]}
        health: {$ref: '#/components/schemas/OutboundSubscriptionHealth'}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    BrokerSubscriptionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BrokerSubscription'}}
    CreateBrokerSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [name, kind, settings, events]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        kind: {type: string, enum: [NATS, KAFKA, SQS]}
        settings: {$ref: '#/components/schemas/OutboundBrokerSettings'}
        secretName: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        events: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string, enum: [run.finished, ops.alert.fired, ops.alert.resolved]}}
        ratePerSecond: {type: integer, minimum: 1, maximum: 100, default: 10}
        timeoutMs: {type: integer, minimum: 1000, maximum: 30000, default: 10000}
        status: {type: string, enum: [ACTIVE, PAUSED], default: ACTIVE}
    UpdateBrokerSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [kind, settings, events]
      properties:
        kind: {type: string, enum: [NATS, KAFKA, SQS], description: 'Must remain the subscription kind set at creation.'}
        settings: {$ref: '#/components/schemas/OutboundBrokerSettings'}
        secretName: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        events: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string, enum: [run.finished, ops.alert.fired, ops.alert.resolved]}}
        ratePerSecond: {type: integer, minimum: 1, maximum: 100, default: 10}
        timeoutMs: {type: integer, minimum: 1000, maximum: 30000, default: 10000}
        status: {type: string, enum: [ACTIVE, PAUSED], default: ACTIVE}
    OutboundBrokerSettings:
      oneOf:
        - {$ref: '#/components/schemas/OutboundNatsSettings'}
        - {$ref: '#/components/schemas/OutboundKafkaSettings'}
        - {$ref: '#/components/schemas/OutboundSqsSettings'}
    OutboundNatsSettings:
      type: object
      additionalProperties: false
      required: [servers, subject]
      properties:
        servers: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
        subject: {type: string}
    OutboundKafkaSettings:
      type: object
      additionalProperties: false
      required: [servers, topic]
      properties:
        servers: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
        topic: {type: string}
    OutboundSqsSettings:
      type: object
      additionalProperties: false
      required: [queueUrl, region]
      properties:
        queueUrl: {type: string, maxLength: 2048}
        region: {type: string}
    OutboundSubscriptionHealth:
      type: object
      required: [consecutiveDead]
      properties:
        consecutiveDead: {type: integer}
        lastSuccessAt: {type: string, format: date-time}
        lastFailureAt: {type: string, format: date-time}
        disabledReason: {type: string}
    WebhookSubscription:
      type: object
      required: [id, namespaceId, name, url, secretName, events, ratePerSecond, timeoutMs, status, health, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        name: {type: string}
        url: {type: string, description: 'For a caller who can manage events, the URL as it was set. For others only the scheme, host and a port that is not the default are shown, followed by `/…`: the path and query of a receiver''s URL can be its credential.'}
        secretName: {type: string}
        events: {type: array, items: {type: string, enum: [run.finished]}}
        ratePerSecond: {type: integer}
        timeoutMs: {type: integer}
        status: {type: string, enum: [ACTIVE, PAUSED, DISABLED], description: 'DISABLED is set by the platform after 20 deliveries in a row were set aside; set ACTIVE to turn it back on.'}
        health:
          type: object
          required: [consecutiveDead]
          properties:
            consecutiveDead: {type: integer}
            lastSuccessAt: {type: string, format: date-time}
            lastFailureAt: {type: string, format: date-time}
            disabledReason: {type: string}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    WebhookSubscriptionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WebhookSubscription'}}
    CreateWebhookSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [name, url, secretName, events]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        url: {type: string, maxLength: 2048}
        secretName: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        events: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string, enum: [run.finished]}}
        ratePerSecond: {type: integer, minimum: 1, maximum: 100, default: 10}
        timeoutMs: {type: integer, minimum: 1000, maximum: 30000, default: 10000}
        status: {type: string, enum: [ACTIVE, PAUSED], default: ACTIVE}
    UpdateWebhookSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [url, secretName, events]
      properties:
        url: {type: string, maxLength: 2048}
        secretName: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        events: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string, enum: [run.finished]}}
        ratePerSecond: {type: integer, minimum: 1, maximum: 100, default: 10}
        timeoutMs: {type: integer, minimum: 1000, maximum: 30000, default: 10000}
        status: {type: string, enum: [ACTIVE, PAUSED], default: ACTIVE}
    WebhookAttempt:
      type: object
      required: [attempt, startedAt, durationMs, outcome]
      properties:
        attempt: {type: integer}
        startedAt: {type: string, format: date-time}
        durationMs: {type: integer}
        outcome: {type: string, enum: [DELIVERED, REJECTED, SERVER_ERROR, THROTTLED, TIMEOUT, NETWORK, DENIED, UNSIGNED, CREDENTIAL_UNAVAILABLE]}
        httpStatus: {type: integer}
        error: {type: string, description: 'A class of failure written by the platform; never the receiver''s words.'}
    WebhookDelivery:
      type: object
      required: [id, subscriptionId, eventId, type, status, attempts, nextAttemptAt, createdAt]
      properties:
        id: {type: string, format: uuid, description: 'Also the X-Octopus-Delivery-Id the receiver sees on every attempt.'}
        subscriptionId: {type: string, format: uuid}
        eventId: {type: string}
        type: {type: string}
        status: {type: string, enum: [PENDING, DELIVERED, DEAD]}
        attempts: {type: integer, description: 'Attempts made in all.'}
        nextAttemptAt: {type: string, format: date-time}
        lastOutcome: {type: string, enum: [DELIVERED, REJECTED, SERVER_ERROR, THROTTLED, TIMEOUT, NETWORK, DENIED, UNSIGNED, CREDENTIAL_UNAVAILABLE]}
        lastHttpStatus: {type: integer}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        deliveredAt: {type: string, format: date-time}
        payload: {$ref: '#/components/schemas/JsonObject'}
        attemptsMade: {type: array, items: {$ref: '#/components/schemas/WebhookAttempt'}}
    WebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WebhookDelivery'}}
        nextCursor: {type: string}
    RedriveRequest:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 1000, default: 100}
    Redriven:
      type: object
      required: [redriven]
      properties:
        redriven: {type: integer}
    NatsConnectorSettings:
      type: object
      additionalProperties: false
      required: [servers, stream, consumer]
      properties:
        servers: {type: array, minItems: 1, maxItems: 8, items: {type: string, description: 'host:port, optionally with nats:// or tls://'}}
        stream: {type: string}
        consumer: {type: string, description: 'The durable pull consumer; created if the stream does not have it.'}
        filterSubject: {type: string}
    KafkaConnectorSettings:
      type: object
      additionalProperties: false
      required: [servers, topic]
      properties:
        servers: {type: array, minItems: 1, maxItems: 8, items: {type: string, description: 'host:port, optionally with kafka:// or tls://'}}
        topic: {type: string}
        startFrom: {type: string, enum: [earliest, latest], default: earliest, description: 'Where a partition without a stored position starts.'}
    SqsConnectorSettings:
      type: object
      additionalProperties: false
      required: [queueUrl, region]
      properties:
        queueUrl: {type: string}
        region: {type: string}
    Connector:
      type: object
      required: [id, namespaceId, slug, kind, settings, ratePerSecond, status, health, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        slug: {type: string, description: 'The source of the events it admits; what a message trigger names.'}
        kind: {type: string, enum: [NATS, KAFKA, SQS]}
        settings:
          oneOf:
            - {$ref: '#/components/schemas/NatsConnectorSettings'}
            - {$ref: '#/components/schemas/KafkaConnectorSettings'}
            - {$ref: '#/components/schemas/SqsConnectorSettings'}
        secretName: {type: string}
        defaultEventType: {type: string}
        ratePerSecond: {type: integer}
        status: {type: string, enum: [ACTIVE, PAUSED]}
        health:
          type: object
          required: [consumed, deadLettered]
          properties:
            lastError: {type: string, description: 'A class of failure written by the platform; never the broker''s words.'}
            lastMessageAt: {type: string, format: date-time}
            consumed: {type: integer}
            deadLettered: {type: integer}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ConnectorList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Connector'}}
    CreateConnectorRequest:
      type: object
      additionalProperties: false
      required: [slug, kind, settings]
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        kind: {type: string, enum: [NATS, KAFKA, SQS]}
        settings: {type: object, description: 'Shaped by kind: NatsConnectorSettings, KafkaConnectorSettings or SqsConnectorSettings.'}
        secretName: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        defaultEventType: {type: string}
        ratePerSecond: {type: integer, minimum: 1, maximum: 10000, default: 200}
        status: {type: string, enum: [ACTIVE, PAUSED], default: ACTIVE}
    UpdateConnectorRequest:
      type: object
      additionalProperties: false
      required: [kind, settings]
      properties:
        kind: {type: string, enum: [NATS, KAFKA, SQS], description: 'Must be the kind the connector has.'}
        settings: {type: object}
        secretName: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
        defaultEventType: {type: string}
        ratePerSecond: {type: integer, minimum: 1, maximum: 10000, default: 200}
        status: {type: string, enum: [ACTIVE, PAUSED], default: ACTIVE}
    DeadLetter:
      type: object
      required: [id, position, reason, headers, body, truncated, receivedAt]
      properties:
        id: {type: string, format: uuid}
        position: {type: string, description: 'Where it was: topic/partition/offset, a stream sequence, a message id.'}
        reason: {type: string, enum: [NO_EVENT_TYPE, BAD_ENVELOPE, NOT_A_JSON_OBJECT, TOO_LARGE, EVENT_ID_REUSED]}
        headers: {type: object, additionalProperties: {type: string}}
        body: {type: string}
        truncated: {type: boolean}
        receivedAt: {type: string, format: date-time}
    Alert:
      type: object
      required: [id, namespaceId, kind, subject, state, severity, summary, runbook, firstSeenAt, lastSeenAt, firedCount, items, oldestSeconds]
      properties:
        id: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        kind: {type: string, enum: [OUTBOX_STUCK, LEASE_NOT_REAPED, STEP_UNCLAIMED, REVIEW_PENDING, DEAD_ITEMS]}
        subject: {type: string, maxLength: 120, description: 'What the alert is about within its kind: an activity name for STEP_UNCLAIMED, `events`, `webhooks` or `connectors` for DEAD_ITEMS; empty for the others.'}
        state: {type: string, enum: [FIRING, RESOLVED]}
        severity: {type: string, enum: [warning, critical]}
        summary: {type: string, description: 'The condition in a sentence that names no data.'}
        runbook: {type: string, description: 'Where to read what to do about it: a path or URL with the anchor of the section.'}
        firstSeenAt: {type: string, format: date-time, description: 'When the current firing began.'}
        lastSeenAt: {type: string, format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
        firedCount: {type: integer, minimum: 1}
        items: {type: integer, format: int64, minimum: 0, description: 'How many things are in the condition at the last look.'}
        oldestSeconds: {type: number, minimum: 0, description: 'The age of the oldest of them.'}
    AlertPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Alert'}}
        nextCursor: {type: [string, 'null']}
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 8, maxLength: 2000, description: 'Counted after trimming; plain text; kept whole in the audit trail.'}
    Worker:
      type: object
      required: [workerId, subject, name, activities, languages, pools, maxInflight, inFlight, registeredAt, expiresAt, draining]
      properties:
        workerId: {type: string, format: uuid}
        subject: {type: string, description: 'The identity (the `sub` of its token).'}
        name: {type: string}
        activities: {type: array, items: {type: string}}
        languages: {type: array, items: {type: string}}
        pools: {type: array, items: {type: string}}
        maxInflight: {type: integer, minimum: 1}
        inFlight: {type: integer, minimum: 0, description: 'Attempts it holds a lease on right now.'}
        registeredAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        draining: {type: boolean}
    Drain:
      type: object
      required: [subject, reason, drainedBy, drainedAt]
      properties:
        subject: {type: string}
        reason: {type: string}
        drainedBy: {type: string}
        drainedAt: {type: string, format: date-time}
    WorkerList:
      type: object
      required: [items, drains]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Worker'}}
        drains: {type: array, items: {$ref: '#/components/schemas/Drain'}}
    Undrain:
      type: object
      required: [wasDraining]
      properties:
        wasDraining: {type: boolean}
    AuditRecord:
      type: object
      required: [id, actor, action, resourceType, resourceId, createdAt]
      properties:
        id: {type: string, format: uuid}
        actor: {type: string, description: 'The subject (`sub`) of the person or worker, or `system:<component>` for the platform.'}
        action: {type: string, description: 'A dotted name such as `run.rerun`, `worker.drained`, `saga.step_retried`.'}
        resourceType: {type: string}
        resourceId: {type: string}
        reason: {type: [string, 'null'], description: 'What the person wrote, or the platform recorded; credential-shaped text is replaced on the way out.'}
        traceId: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    AuditPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditRecord'}}
        nextCursor: {type: [string, 'null']}
    DeadLetterPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DeadLetter'}}
        nextCursor: {type: string}
    ScriptPolicy:
      type: object
      additionalProperties: false
      description: 'What a script is held to. Every field has a floor and a ceiling, and the platform has a ceiling of its own that a script cannot ask past.'
      properties:
        memoryMib: {type: integer, minimum: 16, maximum: 2048, description: 'Memory with swap off; the container is killed above it.'}
        cpuMillis: {type: integer, minimum: 100, maximum: 4000}
        timeoutMs: {type: integer, minimum: 1000, maximum: 900000, description: 'Wall clock; the container is killed after it.'}
        processes: {type: integer, minimum: 8, maximum: 512}
        outputBytes: {type: integer, minimum: 1024, maximum: 1048576, description: 'Log kept; more is cut and the script is stopped if it keeps writing.'}
        scratchMib: {type: integer, minimum: 1, maximum: 512, description: 'Writable, not executable scratch space.'}
        egress: {type: string, enum: [none, namespace], description: '`none`: no way out. `namespace`: requests through octopus.fetch, under the namespace''s egress policy.'}
    ScriptPolicyView:
      type: object
      required: [memoryMib, cpuMillis, timeoutMs, processes, outputBytes, scratchMib, egress]
      properties:
        memoryMib: {type: integer}
        cpuMillis: {type: integer}
        timeoutMs: {type: integer}
        processes: {type: integer}
        outputBytes: {type: integer}
        scratchMib: {type: integer}
        egress: {type: string, enum: [none, namespace]}
    Script:
      type: object
      required: [id, namespaceId, name, language, source, policy, retentionDays, revision, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        name: {type: string}
        language: {type: string, enum: [typescript, python, csharp, go, java]}
        source: {type: string}
        lockfile: {type: string}
        inputSchema: {type: object}
        outputSchema: {type: object}
        policy: {$ref: '#/components/schemas/ScriptPolicyView'}
        retentionDays: {type: integer, minimum: 1, maximum: 365}
        revision: {type: integer}
        latestVersion: {type: integer}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScriptSummary:
      type: object
      required: [id, namespaceId, name, language, policy, retentionDays, revision, sourceBytes, createdBy, createdAt, updatedAt]
      description: 'A script as a listing shows it: without its source, lockfile and schemas (up to 640 KiB a script). `getScript` has them.'
      properties:
        id: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        name: {type: string}
        language: {type: string, enum: [typescript, python, csharp, go, java]}
        policy: {$ref: '#/components/schemas/ScriptPolicyView'}
        retentionDays: {type: integer, minimum: 1, maximum: 365}
        revision: {type: integer}
        latestVersion: {type: integer}
        sourceBytes: {type: integer, description: 'How big the source of the draft is.'}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScriptList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScriptSummary'}}
    CreateScriptRequest:
      type: object
      additionalProperties: false
      required: [name, language, source]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        language: {type: string, description: 'typescript or python; csharp, go and java are refused until they are built.'}
        source: {type: string, minLength: 1, maxLength: 262144}
        lockfile: {type: string, maxLength: 262144}
        inputSchema: {type: object}
        outputSchema: {type: object}
        policy: {$ref: '#/components/schemas/ScriptPolicy'}
        retentionDays: {type: integer, minimum: 1, maximum: 365, default: 14, description: "New choices, publications and test admissions must fit the current namespace script_retention_days policy. Lowering policy preserves existing records and exact publication replay."}
    UpdateScriptRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, minimum: 1}
        source: {type: string, minLength: 1, maxLength: 262144}
        lockfile: {type: [string, 'null']}
        inputSchema: {type: [object, 'null']}
        outputSchema: {type: [object, 'null']}
        policy: {$ref: '#/components/schemas/ScriptPolicy'}
        retentionDays: {type: integer, minimum: 1, maximum: 365}
    ScriptVersion:
      type: object
      required: [id, scriptId, number, language, status, source, policy, retentionDays, contentDigest, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        scriptId: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        language: {type: string, enum: [typescript, python, csharp, go, java]}
        status: {type: string, enum: [BUILDING, READY, FAILED]}
        source: {type: string}
        lockfile: {type: string}
        inputSchema: {type: object}
        outputSchema: {type: object}
        policy: {$ref: '#/components/schemas/ScriptPolicyView'}
        retentionDays: {type: integer}
        contentDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$', description: 'Of everything that defines the version: two publications with the same one are one version.'}
        buildKey: {type: string, pattern: '^sha256:[0-9a-f]{64}$', description: 'Of what the build was made from: source, lockfile, toolchain, limits and schemas.'}
        artifactDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$', description: 'What a workflow pins (`artifactDigest` of a `script` node).'}
        activity: {type: string, description: 'The activity a `script` node of this artifact becomes.'}
        keyId: {type: string}
        toolchain: {type: string}
        buildLog: {type: string}
        buildLogTruncated: {type: boolean, description: "True when the retained build diagnostic or log was truncated, including an empty log at zero allowance."}
        failureCode: {type: string, enum: [SCRIPT_BUILD_REJECTED, SCRIPT_SANDBOX_UNAVAILABLE, STORAGE_QUOTA_EXCEEDED]}
        failure: {type: string, description: 'Retained build diagnostic, possibly empty when the log allowance is exhausted. failureCode preserves the terminal category independently; buildLogTruncated records omitted diagnostics.'}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        builtAt: {type: string, format: date-time}
    ScriptVersionSummary:
      type: object
      required: [id, scriptId, number, language, status, policy, retentionDays, contentDigest, createdBy, createdAt]
      description: 'A version as a listing shows it: without its source, lockfile, schemas and build log. `getScriptVersion` has them.'
      properties:
        id: {type: string, format: uuid}
        scriptId: {type: string, format: uuid}
        number: {type: integer, minimum: 1}
        language: {type: string, enum: [typescript, python, csharp, go, java]}
        status: {type: string, enum: [BUILDING, READY, FAILED]}
        policy: {$ref: '#/components/schemas/ScriptPolicyView'}
        retentionDays: {type: integer}
        contentDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        buildKey: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        artifactDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        activity: {type: string}
        keyId: {type: string}
        toolchain: {type: string}
        failure: {type: string}
        failureCode: {type: string, enum: [SCRIPT_BUILD_REJECTED, SCRIPT_SANDBOX_UNAVAILABLE, STORAGE_QUOTA_EXCEEDED]}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        builtAt: {type: string, format: date-time}
    ScriptVersionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScriptVersionSummary'}}
    PublishedScriptVersion:
      type: object
      required: [version, created]
      properties:
        version: {$ref: '#/components/schemas/ScriptVersion'}
        created: {type: boolean}
    ScriptArtifact:
      type: object
      required: [digest, language, size, keyId, signature, toolchain, createdAt]
      properties:
        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        language: {type: string}
        size: {type: integer}
        keyId: {type: string}
        signature: {type: string, description: 'Ed25519, base64, over the tenant, the digest and the language.'}
        toolchain: {type: string}
        sbom: {type: [object, 'null'], description: CycloneDX}
        createdAt: {type: string, format: date-time}
    TestRunRequest:
      type: object
      additionalProperties: false
      properties:
        input: {description: 'Any JSON value; at most 240 KiB.'}
    ScriptTestRun:
      type: object
      required: [id, scriptId, language, status, log, logTruncated, denied, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        scriptId: {type: string, format: uuid}
        language: {type: string}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        input: {}
        result: {}
        failure: {type: string, pattern: '^(SCRIPT_[A-Z_]+|STORAGE_QUOTA_EXCEEDED)$'}
        retryable: {type: boolean}
        log: {type: string}
        logTruncated: {type: boolean}
        denied: {type: array, items: {type: string}}
        exitCode: {type: integer}
        wallMs: {type: integer}
        startMs: {type: integer}
        memoryPeakBytes: {type: integer}
        inferredInputSchema: {type: object}
        inferredOutputSchema: {type: object}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    ScriptTestRunSummary:
      type: object
      required: [id, scriptId, language, status, createdBy, createdAt]
      description: 'A test run as a listing shows it: how it went. `getScriptTestRun` has what it said and returned.'
      properties:
        id: {type: string, format: uuid}
        scriptId: {type: string, format: uuid}
        language: {type: string}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]}
        failure: {type: string, pattern: '^(SCRIPT_[A-Z_]+|STORAGE_QUOTA_EXCEEDED)$'}
        wallMs: {type: integer}
        startMs: {type: integer}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    ScriptTestRunList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScriptTestRunSummary'}}
    ScriptExecution:
      type: object
      required: [id, artifactDigest, status, log, logTruncated, denied, wallMs, startMs, createdAt, expiresAt]
      properties:
        id: {type: string, format: uuid}
        artifactDigest: {type: string}
        runId: {type: string, format: uuid}
        node: {type: string}
        attempt: {type: integer}
        status: {type: string, enum: [SUCCEEDED, FAILED]}
        failure: {type: string}
        exitCode: {type: integer}
        log: {type: string}
        logTruncated: {type: boolean}
        denied: {type: array, items: {type: string}}
        wallMs: {type: integer}
        startMs: {type: integer}
        memoryPeakBytes: {type: integer}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$', not: {const: '00000000000000000000000000000000'}}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    ScriptExecutionSummary:
      type: object
      required: [id, artifactDigest, status, logTruncated, denied, wallMs, startMs, createdAt, expiresAt]
      description: 'An execution as a listing shows it: without its log, which `getScriptExecution` has.'
      properties:
        id: {type: string, format: uuid}
        artifactDigest: {type: string}
        runId: {type: string, format: uuid}
        node: {type: string}
        attempt: {type: integer}
        status: {type: string, enum: [SUCCEEDED, FAILED]}
        failure: {type: string}
        exitCode: {type: integer}
        logTruncated: {type: boolean}
        denied: {type: array, items: {type: string}}
        wallMs: {type: integer}
        startMs: {type: integer}
        memoryPeakBytes: {type: integer}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$', not: {const: '00000000000000000000000000000000'}}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    ScriptExecutionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScriptExecutionSummary'}}
    ClaimBuildRequest:
      type: object
      additionalProperties: false
      required: [toolchains]
      properties:
        toolchains: {type: object, additionalProperties: {type: string, maxLength: 512}, description: 'Language to the identity of the toolchain that builds it (the digest of its image and the version of the runner''s shim).'}
    BuildAssignment:
      type: object
      required: [jobId, leaseToken, leaseSeconds, versionId, scriptId, language, source, policy, buildKey]
      properties:
        jobId: {type: string, format: uuid}
        leaseToken: {type: string}
        leaseSeconds: {type: integer}
        versionId: {type: string, format: uuid}
        scriptId: {type: string, format: uuid}
        language: {type: string}
        source: {type: string}
        lockfile: {type: string}
        policy: {type: string, description: 'The limits as the platform writes them (`v1;memory=..`), to be built into the artifact.'}
        inputSchema: {type: object}
        outputSchema: {type: object}
        buildKey: {type: string}
    LeaseRequest:
      type: object
      additionalProperties: false
      required: [leaseToken]
      properties:
        leaseToken: {type: string}
    LeaseExtended:
      type: object
      required: [leaseSeconds]
      properties:
        leaseSeconds: {type: integer}
    CompleteBuildRequest:
      type: object
      additionalProperties: false
      required: [leaseToken, outcome]
      properties:
        leaseToken: {type: string}
        outcome: {type: string, enum: [built, failed]}
        artifact: {type: string, description: 'Base64; at most 2 MiB.'}
        sbom: {type: object}
        toolchain: {type: string}
        log: {type: string}
        kind: {type: string, enum: [rejected, lockfile, limit, unsupported, unavailable]}
        message: {type: string}
    ClaimTestRequest:
      type: object
      additionalProperties: false
      required: [languages]
      properties:
        languages: {type: array, items: {type: string}}
    TestAssignment:
      type: object
      required: [runId, leaseToken, leaseSeconds, scriptId, namespaceId, language, source, policy, input]
      properties:
        runId: {type: string, format: uuid}
        leaseToken: {type: string}
        leaseSeconds: {type: integer}
        scriptId: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        language: {type: string}
        source: {type: string}
        lockfile: {type: string}
        inputSchema: {type: object}
        outputSchema: {type: object}
        policy: {type: string}
        input: {}
    CompleteTestRequest:
      type: object
      additionalProperties: false
      required: [leaseToken]
      properties:
        leaseToken: {type: string}
        result: {}
        failure: {type: string, pattern: '^(SCRIPT_[A-Z_]+|STORAGE_QUOTA_EXCEEDED)$'}
        log: {type: string}
        logTruncated: {type: boolean}
        denied: {type: array, items: {type: string}}
        exitCode: {type: integer}
        wallMs: {type: integer}
        startMs: {type: integer}
        memoryPeakBytes: {type: integer}
        inferredInputSchema: {type: object}
        inferredOutputSchema: {type: object}
    RunnerArtifact:
      type: object
      required: [tenantId, digest, language, artifact, signature, keyId, toolchain]
      properties:
        tenantId: {type: string, format: uuid}
        digest: {type: string}
        language: {type: string}
        artifact: {type: string, description: Base64}
        signature: {type: string, description: Base64}
        keyId: {type: string}
        toolchain: {type: string}
    SigningKey:
      type: object
      required: [keyId, publicKey]
      properties:
        keyId: {type: string}
        publicKey: {type: string, description: 'Ed25519, base64.'}
    RunnerEgressPolicy:
      type: object
      required: [rules, ports, allowHttp]
      properties:
        rules: {type: array, items: {type: string}}
        ports: {type: array, items: {type: integer}}
        allowHttp: {type: boolean}
    PendingActivities:
      type: object
      required: [activities]
      properties:
        activities: {type: array, items: {type: string, pattern: '^script\.sha256-[0-9a-f]{64}$'}}
    RecordExecutionRequest:
      type: object
      additionalProperties: false
      required: [namespaceId, digest, status]
      properties:
        namespaceId: {type: string, format: uuid}
        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        runId: {type: string, format: uuid}
        node: {type: string}
        attempt: {type: integer, minimum: 0}
        status: {type: string, enum: [SUCCEEDED, FAILED]}
        failure: {type: string, pattern: '^(SCRIPT_[A-Z_]+|STORAGE_QUOTA_EXCEEDED)$'}
        exitCode: {type: integer}
        log: {type: string}
        logTruncated: {type: boolean}
        denied: {type: array, items: {type: string}}
        wallMs: {type: integer, minimum: 0}
        startMs: {type: integer, minimum: 0}
        memoryPeakBytes: {type: integer, minimum: 0}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$', not: {const: '00000000000000000000000000000000'}}
    Recorded:
      type: object
      required: [recorded]
      properties:
        recorded: {type: boolean}
    RecordRunnerIncidentRequest:
      type: object
      additionalProperties: false
      required: [target, category]
      properties:
        target:
          oneOf:
            - $ref: '#/components/schemas/ProductionIncidentTarget'
            - $ref: '#/components/schemas/TestIncidentTarget'
          discriminator:
            propertyName: kind
            mapping:
              production: '#/components/schemas/ProductionIncidentTarget'
              test: '#/components/schemas/TestIncidentTarget'
        category:
          type: string
          enum: [EGRESS_DISABLED, UNSUPPORTED_SCHEME, INVALID_HOST, PORT_NOT_ALLOWED, NOT_ALLOWLISTED, FORBIDDEN_ADDRESS, NO_ADDRESS]
    ProductionIncidentTarget:
      type: object
      additionalProperties: false
      required: [kind, namespaceId, runId, stepId, attempt, generation, leaseToken]
      properties:
        kind: {type: string, const: production}
        namespaceId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        stepId: {type: string, format: uuid}
        attempt: {type: integer, format: int32, minimum: 1}
        generation: {type: integer, format: int64, minimum: 1}
        leaseToken: {type: string, minLength: 1, maxLength: 128}
    TestIncidentTarget:
      type: object
      additionalProperties: false
      required: [kind, namespaceId, testRunId, leaseToken]
      properties:
        kind: {type: string, const: test}
        namespaceId: {type: string, format: uuid}
        testRunId: {type: string, format: uuid}
        leaseToken: {type: string, minLength: 1, maxLength: 128}
    PublicationPolicy:
      type: object
      required: [namespaceId, environment, requiredApprovals, source]
      properties:
        namespaceId: {type: string, format: uuid}
        environment: {type: string, enum: [dev, staging, prod]}
        requiredApprovals: {type: integer, minimum: 0, maximum: 3}
        source: {type: string, enum: [default, set], description: '`default`: what the environment asks for until someone sets it (one in production, none elsewhere).'}
        setBy: {type: [string, 'null']}
        setAt: {type: [string, 'null'], format: date-time}
    SetPublicationPolicy:
      type: object
      additionalProperties: false
      required: [requiredApprovals, reason]
      properties:
        requiredApprovals: {type: integer, minimum: 0, maximum: 3}
        reason: {type: string, minLength: 8, maxLength: 2000}
    OpenPublicationRequest:
      type: object
      additionalProperties: false
      required: [draftRevision]
      properties:
        draftRevision: {type: integer, format: int64, minimum: 1}
        releaseNotes: {type: string, maxLength: 2048}
    PublicationDecision:
      type: object
      required: [by, verdict, reason, at]
      properties:
        by: {type: string}
        verdict: {type: string, enum: [APPROVED, REJECTED]}
        reason: {type: string}
        at: {type: string, format: date-time}
    PublicationRequest:
      type: object
      required: [id, workflowId, namespaceId, kind, state, draftRevision, digest, requestedBy, requestedAt, requiredApprovals, approvals, decisions]
      properties:
        id: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        namespaceId: {type: string, format: uuid}
        kind: {type: string, enum: [PUBLISH, PROMOTE]}
        state: {type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, SUPERSEDED, PUBLISHED]}
        draftRevision: {type: integer, format: int64}
        digest: {type: string, pattern: '^[0-9a-f]{64}$', description: 'Of the document the approvers saw.'}
        releaseNotes: {type: [string, 'null']}
        promotedFromVersionId: {type: [string, 'null'], format: uuid, description: 'For a promotion: the version whose document this publishes.'}
        requestedBy: {type: string}
        editedBy: {type: [string, 'null'], description: 'Who saved the document the request is about (the last person to save the draft at that revision), when the platform knows; a draft saved before it kept that has no one. Neither they nor the requester may decide the request.'}
        requestedAt: {type: string, format: date-time}
        requiredApprovals: {type: integer, minimum: 0, maximum: 3, description: 'What the policy asked for when the request was opened; the policy in force is read again when it is published.'}
        approvals: {type: integer, minimum: 0}
        decisions: {type: array, items: {$ref: '#/components/schemas/PublicationDecision'}}
        published:
          type: [object, 'null']
          required: [versionId, by, at]
          properties:
            versionId: {type: string, format: uuid}
            by: {type: string}
            at: {type: string, format: date-time}
    PublicationRequestPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PublicationRequest'}}
        nextCursor: {type: [string, 'null']}
    ActivateVersion:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: {type: integer, minimum: 1}
        reason: {type: string, minLength: 8, maxLength: 2000}
        expectedVersion: {type: integer, minimum: 1, description: 'The version the caller saw active; the change is refused if it is not any more.'}
        acceptBreaking: {type: boolean, default: false, description: 'The caller accepts that callers and emitters of the workflow may fail.'}
    Activation:
      type: object
      required: [id, workflowId, version, versionId, kind, actor, at]
      properties:
        id: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        versionId: {type: string, format: uuid}
        previousVersion: {type: [integer, 'null'], minimum: 1}
        kind: {type: string, enum: [PUBLISH, PROMOTE, ROLLBACK, ACTIVATE]}
        reason: {type: [string, 'null']}
        actor: {type: string}
        requestId: {type: [string, 'null'], format: uuid}
        promotedFrom:
          type: [object, 'null']
          required: [namespaceId, workflowId, version]
          properties:
            namespaceId: {type: string, format: uuid}
            workflowId: {type: string, format: uuid}
            version: {type: integer, minimum: 1}
        at: {type: string, format: date-time}
    ActivationResult:
      allOf:
        - $ref: '#/components/schemas/Activation'
        - type: object
          required: [changed]
          properties:
            changed: {type: boolean, description: 'False when the version was the active one already.'}
    ActivationPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Activation'}}
        nextCursor: {type: [string, 'null']}
    PromoteVersion:
      type: object
      additionalProperties: false
      required: [namespaceId, reason]
      properties:
        namespaceId: {type: string, format: uuid}
        reason: {type: string, minLength: 8, maxLength: 2000}
        acceptBreaking: {type: boolean, default: false}
    Promotion:
      type: object
      required: [outcome]
      properties:
        outcome: {type: string, enum: [PUBLISHED, REQUESTED, ALREADY_ACTIVE]}
        version: {oneOf: [{$ref: '#/components/schemas/WorkflowVersion'}, {type: 'null'}]}
        request: {oneOf: [{$ref: '#/components/schemas/PublicationRequest'}, {type: 'null'}]}
        activeVersion: {type: [integer, 'null'], minimum: 1}
  responses:
    PayloadTooLarge: {description: 'The body is larger than this endpoint takes', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    BadRequest: {description: 'A required header is missing or the body is not valid JSON', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
