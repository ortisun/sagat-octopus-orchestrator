      responses:
        '200': {description: 'The bindings', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerBindingList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces/{namespaceId}/worker-bindings/{subject}:
    put:
      operationId: bindWorker
      summary: Bind a worker identity to activities of a namespace
      tags: [Governance]
      x-implemented: '009'
      description: |
        Replaces what the identity was bound to in this namespace. Each entry is an activity name (`payments.charge`), a prefix ending in `.*` (`payments.*`, which does not cover `payments` itself) or `*`. Sessions the new binding no longer covers are closed and the attempts they hold are released. Needs `worker:bind`. Audited.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
        - {$ref: '#/components/parameters/WorkerSubject'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetWorkerBindingRequest'}
      responses:
        '200': {description: 'The binding now in force and what the change released', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkerBinding'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: unbindWorker
      summary: Remove the binding of a worker identity in a namespace
      tags: [Governance]
      x-implemented: '009'
      description: The identity can no longer register in this namespace; its sessions are closed and the attempts they hold are released. 404 when it has no binding there. Needs `worker:bind`. Audited.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
        - {$ref: '#/components/parameters/WorkerSubject'}
      responses:
        '200': {description: 'What the removal released', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RevokedWorkers'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces/{namespaceId}/secrets:
    get:
      operationId: listSecrets
      summary: The secrets of a namespace, by name, without values
      tags: [Governance]
      x-implemented: '009'
      description: |
        Needs `secret:read`. These operations exist only on instances configured with a key ring (`SAGAT_SECRETS_KEYS`); elsewhere they answer 404. A value is accepted here and nowhere else, and is never returned by any operation: workers receive it through `ResolveSecrets` of the worker protocol while they hold the lease of a step whose definition declares it.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
      responses:
        '200': {description: 'The secrets', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SecretList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces/{namespaceId}/secrets/{secretName}:
    put:
      operationId: putSecret
      summary: Store a secret, or a new version of it
      tags: [Governance]
      x-implemented: '009'
      description: |
        Needs `secret:manage`. Stores the value sealed under the active key and keeps the last five versions. Counts against the namespace's `secrets` quota when the secret is new. Audited (the name and the actor, never the value). These operations exist only on instances configured with a key ring (`SAGAT_SECRETS_KEYS`); elsewhere they answer 404. A value is accepted here and nowhere else, and is never returned by any operation: workers receive it through `ResolveSecrets` of the worker protocol while they hold the lease of a step whose definition declares it.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
        - {$ref: '#/components/parameters/SecretName'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetSecretRequest'}
      responses:
        '200': {description: 'What is now stored: the name and the version, never the value', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Secret'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteSecret
      summary: Delete a secret with all its versions and its access list
      tags: [Governance]
      x-implemented: '009'
      description: Needs `secret:manage`. Workflows that declare it stop resolving it at once. Audited.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
        - {$ref: '#/components/parameters/SecretName'}
      responses:
        '204': {description: 'Deleted', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces/{namespaceId}/secrets/{secretName}/access:
    get:
      operationId: listSecretAccess
      summary: Who may reference the secret from workflows they publish
      tags: [Governance]
      x-implemented: '009'
      description: Needs `secret:manage`. Administrators may always use a secret and are not listed.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
        - {$ref: '#/components/parameters/SecretName'}
      responses:
        '200': {description: 'The identities on the list', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SecretAccess'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces/{namespaceId}/secrets/{secretName}/access/{subject}:
    put:
      operationId: grantSecretAccess
      summary: Let an identity reference the secret from workflows it publishes
      tags: [Governance]
      x-implemented: '009'
      description: Needs `secret:manage`. Idempotent. The identity also needs a role that holds `secret:use`. Audited.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
        - {$ref: '#/components/parameters/SecretName'}
        - {$ref: '#/components/parameters/WorkerSubject'}
      responses:
        '204': {description: 'The identity is on the list', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: revokeSecretAccess
      summary: Take an identity off the secret's list
      tags: [Governance]
      x-implemented: '009'
      description: Needs `secret:manage`. The next time a worker asks for the value of a step that identity published, it is refused. 404 when the identity was not on the list. Audited.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
        - {$ref: '#/components/parameters/SecretName'}
        - {$ref: '#/components/parameters/WorkerSubject'}
      responses:
        '204': {description: 'The identity is off the list', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces/{namespaceId}/egress-policy:
    get:
      operationId: getEgressPolicy
      summary: Where outbound requests of a namespace may go
      tags: [Governance]
      x-implemented: '009'
      description: |
        Needs `egress:manage`. Default-deny: a namespace without a policy may reach nothing (the answer is then an empty policy). Whatever the policy says, loopback, link-local and cloud-metadata addresses, multicast and reserved space are never reachable, and private space only through an explicit network rule.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
      responses:
        '200': {description: 'The policy', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/EgressPolicy'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    put:
      operationId: setEgressPolicy
      summary: Replace the egress policy of a namespace
      tags: [Governance]
      x-implemented: '009'
      description: |
        Needs `egress:manage`. A rule is an exact host name, `*.domain` (any host below it, not the domain itself) or a CIDR network (which also allows addressing it by IP literal). Audited: the trail records how many rules and ports changed, not what they are.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetEgressPolicyRequest'}
      responses:
        '200': {description: 'The policy now in force, in canonical text', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/EgressPolicy'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: resetEgressPolicy
      summary: Remove the egress policy of a namespace
      tags: [Governance]
      x-implemented: '009'
      description: The namespace may reach nothing again. Needs `egress:manage`. Audited.
      parameters:
        - {$ref: '#/components/parameters/NamespaceId'}
      responses:
        '204': {description: 'The policy is removed', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /events:
    post:
      operationId: publishEvent
      summary: Publish an event to the inbox
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IncomingEvent'}
      responses:
        '202': {description: Event persisted to inbox}
        '409': {$ref: '#/components/responses/Conflict'}
  /webhooks/{endpointId}:
    post:
      security: []
      operationId: receiveSignedWebhook
      summary: Receive a signed webhook
      tags: [Events]
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: {type: string}
        - name: X-Octopus-Signature
          in: header
          required: true
          schema: {type: string}
        - name: X-Octopus-Timestamp
          in: header
          required: true
          schema: {type: string}
        - name: X-Octopus-Event-Id
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventPayload'}
      responses:
        '202': {description: "Signature verified, event durably admitted"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /scripts/builds:
    post:
      operationId: buildInlineScript
      summary: Build an inline script
      tags: [Scripts]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BuildRequest'}
      responses:
        '202': {description: Async isolated build accepted, content: {application/json: {schema: {$ref: '#/components/schemas/BuildStatus'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    TraceId:
      description: W3C trace id (32 lowercase hex characters) of the request, for log and trace correlation.
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  parameters:
    Namespace:
      name: X-Octopus-Namespace
      in: header
      required: true
      description: Namespace; authorization derives tenant from token, not header.
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 160}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `nextCursor` by the previous page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size; values outside 1..200 are clamped.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    WorkerSubject:
      name: subject
      in: path
      required: true
      description: The identity (the `sub` of its token), URL-encoded.
      schema: {type: string, minLength: 1, maxLength: 255}
    SecretName:
      name: secretName
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$'}
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    QuotaResourceName:
      name: resource
      in: path
      required: true
      schema: {type: string, enum: [active_runs, tenant_active_runs, workflows, worker_sessions, secrets]}
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: {type: string}
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    JsonObject: {type: object, additionalProperties: true}
    Error:
      type: object
      required: [code, message, retryable, traceId]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, RATE_LIMITED, QUOTA_EXCEEDED, UNAVAILABLE, INTERNAL]
        message: {type: string, description: "Safe, human-readable summary. Never contains secrets, payloads or other tenants' data."}
        retryable: {type: boolean}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
        details: {type: object, additionalProperties: true}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    AuthContext:
      type: object
      required: [tenant, subject, role, permissions, traceId]
      properties:
        tenant: {type: string, description: Slug of the caller's tenant.}
        subject: {type: string}
        role: {type: string, enum: [admin, developer, operator, viewer]}
        permissions:
          type: array
          items: {type: string, example: 'workspace:read'}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
    Workspace:
      type: object
      required: [id, slug, createdAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        createdAt: {type: string, format: date-time}
    CreateWorkspaceRequest:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', description: 'Unique inside the tenant. 3-63 characters; no consecutive hyphens.'}
    WorkspacePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Workspace'}}
        nextCursor: {type: [string, 'null']}
    NamespaceResource:
      type: object
      required: [id, workspaceId, slug, environment, createdAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        environment: {type: string, enum: [dev, staging, prod]}
        createdAt: {type: string, format: date-time}
    CreateNamespaceRequest:
      type: object
      required: [slug, environment]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', description: 'Unique inside the tenant (not only inside the workspace).'}
        environment: {type: string, enum: [dev, staging, prod]}
    NamespacePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/NamespaceResource'}}
        nextCursor: {type: [string, 'null']}
    CreateWorkflowRequest:
      type: object
      required: [name, ir]
      properties:
        name: {type: string, description: 'Workflow name (a slug); the document must name the same workflow.'}
        ir: {$ref: '#/components/schemas/JsonObject'}
    UpdateDraftRequest:
      type: object
      required: [draftRevision, ir]
      additionalProperties: false
      properties:
        draftRevision: {type: integer, minimum: 1, description: 'The revision the client edited; a stale one is refused with 409.'}
        ir: {$ref: '#/components/schemas/JsonObject'}
    PublishRequest:
      type: object
      required: [draftRevision]
      additionalProperties: false
      properties:
        draftRevision: {type: integer, minimum: 1}
        releaseNotes: {type: string, maxLength: 2048}
    VersionSummary:
      type: object
      required: [workflowId, versionId, versionNumber, digest]
      properties:
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        versionNumber: {type: integer, minimum: 1}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        publishedBy: {type: string}
        publishedAt: {type: string, format: date-time}
    WorkflowDraft:
      type: object
      required: [id, name, draftRevision, ir]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        draftRevision: {type: integer, minimum: 1}
        ir: {$ref: '#/components/schemas/JsonObject'}
        activeVersion: {oneOf: [{$ref: '#/components/schemas/VersionSummary'}, {type: 'null'}]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    WorkflowVersion:
      allOf:
        - $ref: '#/components/schemas/VersionSummary'
        - type: object
          required: [created, warnings]
          properties:
            created: {type: boolean, description: 'False when the document was identical to an existing version, which was re-activated.'}
            warnings: {type: array, items: {type: string}}
    WorkflowVersionDocument:
      allOf:
        - $ref: '#/components/schemas/VersionSummary'
        - type: object
          required: [document]
          properties:
            releaseNotes: {type: [string, 'null']}
            document: {$ref: '#/components/schemas/JsonObject'}
    VersionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkflowVersionDocument'}}
        nextCursor: {type: [string, 'null']}
    WorkflowPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkflowDraft'}}
        nextCursor: {type: [string, 'null']}
    StartRunRequest:
      type: object
      required: [workflowId, input]
      additionalProperties: false
      properties:
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid, description: 'Optional explicit pin; the active version otherwise.'}
        input: {$ref: '#/components/schemas/JsonObject'}
        correlationId: {type: string, maxLength: 160}
        deadline: {type: string, format: date-time, description: 'Must be in the future and within a year; the run times out at this instant.'}
    Run:
      type: object
      required: [runId, workflowId, versionId, status, version, createdAt]
      properties:
        runId: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        status: {type: string, enum: [RUNNING, WAITING, PAUSED, CANCELLING, COMPENSATING, MANUAL_REVIEW, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, COMPENSATED, PARTIAL, COMPENSATION_FAILED]}
        version: {type: integer, format: int64, minimum: 0, description: 'Number of journal events applied; usable as expectedRunVersion.'}
        paused: {type: boolean}
        startedBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        deadline: {type: [string, 'null'], format: date-time}
        traceId: {type: [string, 'null']}
        correlationId: {type: [string, 'null']}
        depth: {type: integer, minimum: 0, maximum: 8, description: 'Nesting of child runs: 0 for a run started through the API.'}
        parent:
          type: [object, 'null']
          description: 'Set when this run is the child of a `child` node of another run.'
          required: [runId, node, cancelPolicy]
          properties:
            runId: {type: string, format: uuid}
            node: {type: string}
            cancelPolicy: {type: string, enum: [PROPAGATE, REQUEST_CANCEL, DETACH]}
    RunPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Run'}}
        nextCursor: {type: [string, 'null']}
    JournalEvent:
      type: object
      required: [seq, eventType, occurredAt, actor]
      properties:
        seq: {type: integer, format: int64, minimum: 1}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        stepId: {type: [string, 'null'], description: 'The node id the event concerns.'}
        attempt: {type: [integer, 'null']}
        actor: {type: string, description: 'user:<sub>, worker:<id> or system:<component>.'}
        traceId: {type: [string, 'null']}
        payloadRef: {type: [string, 'null'], description: 'SHA-256 of the output payload the event refers to.'}
    JournalPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/JournalEvent'}}
        nextCursor: {type: [string, 'null']}
    RuntimeGraph:
      type: object
      required: [runId, projectionSeq, nodes, edges]
      properties:
        runId: {type: string, format: uuid}
        status: {type: string}
        projectionSeq: {type: integer, format: int64}
        projectionLagMs: {type: integer, minimum: 0}
        nodes:
          type: array
          items:
            type: object
            required: [id, type, status]
            properties:
              id: {type: string}
              type: {type: string}
              status: {type: string, enum: [NOT_STARTED, PENDING, READY, LEASED, RUNNING, WAITING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED, SKIPPED]}
              attempt: {type: integer}
              generation: {type: integer}
              cancelRequested: {type: boolean}
              failureCode: {type: [string, 'null']}
              nextAttemptAt: {type: [string, 'null'], format: date-time}
              dueAt: {type: [string, 'null'], format: date-time}
              waitingOn: {type: [string, 'null'], enum: [timer, event, branches, child, saga, reconciliation, operator, null], description: '`saga`: a saga node while its body works, compensates or waits. `reconciliation`: the lookup `<id>~r` is finding out whether the effect happened. `operator`: a person has to decide (RETRY_STEP, RETRY_COMPENSATION, SKIP_COMPENSATION or RESOLVE_STEP).'}
              childRunId: {type: [string, 'null'], format: uuid, description: 'The child run a `child` node reserved.'}
              kind: {type: string, enum: [FORWARD, COMPENSATION, RECONCILIATION], description: 'Forward work, the compensation `<id>~c` of a node, or the lookup `<id>~r` that finds out whether it happened.'}
              forward: {type: [string, 'null'], description: 'For a compensation or a reconciliation: the forward node it is about.'}
              saga:
                type: [object, 'null']
                description: 'For a `saga` node: what the run knows about it.'
                required: [phase, irreversible]
                properties:
                  phase: {type: string, enum: [FORWARD, ABORTING, COMPENSATING, DONE]}
                  cause: {type: [string, 'null'], description: 'Why the saga compensates, or did.'}
                  outcome: {type: [string, 'null'], enum: [COMPENSATED, PARTIAL, COMPENSATION_FAILED, null]}
                  irreversible: {type: array, items: {type: string}, description: 'Completed steps whose effect could not be undone.'}
        edges:
          type: array
          items:
            type: object
            required: [from, to, kind]
            properties:
              from: {type: string}
              to: {type: string}
              kind: {type: string, enum: [next, error, 'true', 'false', branch, timeout, compensation, reconcile], description: '`compensation`: the compensation at `to` waits for the one at `from`. `reconcile`: `to` finds out whether `from` happened.'}
    CompensationPlans:
      type: object
      required: [sagas]
      properties:
        sagas:
          type: array
          items:
            type: object
            required: [saga, onCompensationFailure, cancelPolicy, irreversible, compensations]
            properties:
              saga: {type: string}
              onCompensationFailure: {type: string, enum: [manual_review, fail]}
              cancelPolicy: {type: string, enum: [compensate_completed, abort_no_compensation, wait_in_flight_then_compensate]}
              irreversible: {type: array, items: {type: string}, description: 'Nodes whose effect cannot be undone: a saga that compensates past one ends PARTIAL.'}
              compensations:
                type: array
                description: In an order a worker could follow one by one; the last forward node comes first.
                items:
                  type: object
                  required: [position, node, compensationId, activity, after]
                  properties:
                    position: {type: integer, minimum: 0}
                    node: {type: string, description: 'The forward node the compensation undoes.'}
                    compensationId: {type: string, format: uuid, description: 'Stable for this version and node; with the run id it makes the idempotency key a provider sees.'}
                    activity: {type: string, description: 'The activity that undoes the node (`compensateWith`).'}
                    after: {type: array, items: {type: string}, description: 'Forward nodes whose compensations must finish before this one starts.'}
    OperationRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [PAUSE, RESUME, CANCEL, RETRY_STEP, RETRY_COMPENSATION, SKIP_COMPENSATION, RESOLVE_STEP, RERUN_AS_NEW, MARK_MANUAL_REVIEW]}
        stepId: {type: string, description: 'The node id of the step the operation is about (`reserve~c` for the compensation of `reserve`). Required for RETRY_STEP, RETRY_COMPENSATION, SKIP_COMPENSATION and RESOLVE_STEP; refused for the others.'}
        outcome: {type: string, enum: [SUCCEEDED, FAILED], description: 'For RESOLVE_STEP: the step happened, or it did not.'}
        errorCode: {type: string, description: 'For RESOLVE_STEP with outcome FAILED: the code the step is recorded as failed with.'}
        reason: {type: string, minLength: 8, maxLength: 2000, description: 'Counted after trimming; for the decisions of a saga it is kept whole in the audit trail.'}
        expectedRunVersion: {type: integer, minimum: 0, description: 'Optimistic concurrency: refused with 409 if the run moved on.'}
    OperationResult:
      type: object
      required: [operationId, accepted]
      properties:
        operationId: {type: string, format: uuid}
        accepted: {type: boolean}
        runStatus: {type: string}
        runVersion: {type: integer, format: int64}
    RevokedWorkers:
      type: object
      required: [sessionsClosed, leasesReleased]
      properties:
        sessionsClosed: {type: integer, minimum: 0}
        leasesReleased: {type: integer, minimum: 0}
    WorkerBinding:
      type: object
      required: [subject, activities]
      properties:
        subject: {type: string}
        activities: {type: array, items: {type: string}, description: 'Activity names, `<prefix>.*` or `*`.'}
        revoked: {$ref: '#/components/schemas/RevokedWorkers'}
    WorkerBindingList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkerBinding'}}
    SetWorkerBindingRequest:
      type: object
      additionalProperties: false
      required: [activities]
      properties:
        activities: {type: array, minItems: 1, maxItems: 64, items: {type: string, minLength: 1, maxLength: 130}}
    Secret:
      type: object
      required: [name, version, keyId, createdBy, updatedAt]
      properties:
        name: {type: string}
        version: {type: integer, minimum: 1}
        keyId: {type: string, description: 'The key of the ring the current version is sealed under.'}
        createdBy: {type: string}
        updatedAt: {type: string, format: date-time}
    SecretList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Secret'}}
    SecretAccess:
      type: object
      required: [subjects]
      properties:
        subjects: {type: array, items: {type: string}}
    SetSecretRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: string, minLength: 1, maxLength: 16384, writeOnly: true, description: 'The secret, UTF-8 text of 1 to 16384 bytes. Never returned.'}
    EgressPolicy:
      type: object
      required: [rules, ports, allowHttp]
      properties:
        rules: {type: array, items: {type: string}, description: 'Exact hosts, `*.domain` rules and CIDR networks, lower-cased and masked.'}
        ports: {type: array, items: {type: integer, minimum: 1, maximum: 65535}, description: 'Empty means 443 (and 80 when plain HTTP is allowed).'}
        allowHttp: {type: boolean}
    SetEgressPolicyRequest:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules: {type: array, maxItems: 256, items: {type: string, minLength: 1, maxLength: 260}}
        ports: {type: array, maxItems: 32, items: {type: integer, minimum: 1, maximum: 65535}}
        allowHttp: {type: boolean, default: false}
    Quota:
      type: object
      required: [resource, limit, source, ceiling]
      properties:
        resource: {type: string, enum: [active_runs, tenant_active_runs, workflows, worker_sessions, secrets]}
        limit: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        source: {type: string, enum: [default, tenant, namespace], description: 'Where the limit in force comes from. default means the tenant set nothing and the ceiling applies.'}
        ceiling: {type: integer, format: int64, minimum: 0, maximum: 1000000000, description: 'The most the tenant may set for this resource, and the most that can be in force. The platform default unless an operator granted the tenant more. No API call raises it.'}
        used: {type: integer, format: int64, minimum: 0, description: 'Exact count now. Absent for a per-namespace resource in the tenant-wide view.'}
    QuotaList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Quota'}}
    SetQuotaRequest:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
    SignalResult:
      type: object
      required: [deliveredTo]
      properties:
        deliveredTo: {type: array, items: {type: string}, description: 'The waitEvent nodes the signal woke.'}
    EventPayload: {$ref: '#/components/schemas/JsonObject'}
    IncomingEvent:
      type: object
      required: [eventId, type, data]
      properties:
        eventId: {type: string}
        type: {type: string}
        subject: {type: string}
        occurredAt: {type: string, format: date-time}
        correlationKey: {type: string}
        data: {$ref: '#/components/schemas/JsonObject'}
    BuildRequest:
      type: object
      required: [language, source, lockfile]
      properties:
        language: {type: string, enum: [typescript, python, csharp, go, java]}
        source: {type: string}
        lockfile: {type: string}
        toolchain: {type: string}
    BuildStatus:
      type: object
      required: [buildId, status]
      properties:
        buildId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, BUILDING, SUCCEEDED, FAILED, CANCELLED]}
        artifactDigest: {type: string}
  responses:
    BadRequest: {description: 'A required header is missing or the body is not valid JSON', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflict or stale version, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Invalid input/schema/graph, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooManyRequests: {description: 'The caller exceeded its request budget (per token subject, checked before any database lookup, or per tenant); retry after the delay in Retry-After', headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: A dependency is temporarily unavailable; retry later, headers: {Retry-After: {schema: {type: integer, minimum: 0}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InternalError: {description: "Any other failure: 500 for an unexpected error, 408 when the request timed out. Same envelope.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
