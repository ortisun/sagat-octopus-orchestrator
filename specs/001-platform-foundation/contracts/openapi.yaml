        - {name: endpointId, in: path, required: true, schema: {type: string}}
        - {name: X-Octopus-Signature, in: header, required: true, schema: {type: string}}
        - {name: X-Octopus-Timestamp, in: header, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
        - {name: X-Octopus-Event-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: X-Octopus-Event-Type, in: header, required: false, description: 'Required unless the endpoint has a default event type.', schema: {type: string}}
        - {name: X-Octopus-Subject, in: header, required: false, schema: {type: string, maxLength: 256}}
        - {name: X-Octopus-Correlation-Key, in: header, required: false, schema: {type: string, maxLength: 256}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventPayload'}
