openapi: 3.1.0
info:
  title: Sagat Octopus Orchestrator Control & Execution API
  version: 0.1.0
  description: |
    Operations tagged `Identity` are implemented by the control plane (feature 001); operations marked
    `x-implemented: '002'` (workflow definitions, runs, operator actions and signals) by the durable
    execution engine (feature 002). Every other operation is a design proposal that is not implemented
    yet. The worker protocol is gRPC (`worker.proto`), not REST.
    The database is the source of truth; commands may be redelivered.
    Tenant resolved by authentication, never from a free-form tenant_id supplied by the client.

    Authentication: `Authorization: Bearer <JWT>` issued by the configured OIDC provider. The token MUST carry
    `iss`, `aud`, `sub`, `exp`, `iat` and a tenant claim (default name `tenant`, the tenant slug). Only
    asymmetric algorithms (RS256, ES256) are accepted. A tenant is NEVER read from a header or a body.

    Errors use one envelope (`Error`). A resource that exists only in another tenant is reported as
    `NOT_FOUND`, indistinguishable from a missing one.

    Known gap: creating workspaces and namespaces is not yet idempotent through `Idempotency-Key`; a retry after
    an ambiguous response returns `409 CONFLICT` and the client should read the resource back.
servers:
  - url: https://api.sagat-octopus-orchestrator.example/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Workflows
  - name: Runs
  - name: Events
  - name: Scripts
  - name: Operations
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [Identity]
      security: []
      responses:
        '200': {description: 'The process is alive', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
        default: {$ref: '#/components/responses/InternalError'}
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe (checks the database)
      tags: [Identity]
      security: []
      responses:
        '200': {description: 'Ready to serve traffic', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/context:
    get:
      operationId: getAuthContext
      summary: Describe the authenticated caller
      tags: [Identity]
      responses:
        '200': {description: 'Resolved identity of the caller', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AuthContext'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces of the caller's tenant
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: 'Page of workspaces', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspacePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201': {description: 'Workspace created', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get a workspace
      tags: [Identity]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'The workspace', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workspaces/{workspaceId}/namespaces:
    post:
      operationId: createNamespace
      summary: Create a namespace inside a workspace
      tags: [Identity]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateNamespaceRequest'}
      responses:
        '201': {description: 'Namespace created', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespaceResource'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces:
    get:
      operationId: listNamespaces
      summary: List namespaces of the caller's tenant
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: 'Page of namespaces', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespacePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces/{namespaceId}:
    get:
      operationId: getNamespace
      summary: Get a namespace
      tags: [Identity]
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'The namespace', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespaceResource'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows:
    get:
      operationId: listWorkflows
      summary: List the workflows of a namespace
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'Page of workflows', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createWorkflowDraft
      summary: Create a workflow with its first draft
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkflowRequest'}
      responses:
        '201': {description: 'Draft created', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowDraft'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}:
    get:
      operationId: getWorkflow
      summary: Get a workflow with its draft and active version
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
      responses:
        '200': {description: 'The workflow', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowDraft'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    put:
      operationId: updateWorkflowDraft
      summary: Replace the draft if it is still at the given revision
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDraftRequest'}
      responses:
        '200': {description: 'Draft updated', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowDraft'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/publish:
    post:
      operationId: publishWorkflow
      summary: Publish an immutable workflow version and make it active
      tags: [Workflows]
      x-implemented: '002'
      description: Validates the draft against the workflow schema, the graph rules and the expression subset. A document with no engine yet (saga, script, child, foreach, humanApproval) is refused with a reason. compensateWith/reconcileWith are accepted with a warning because compensation is not executed yet.
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '201': {description: 'Immutable version published (or an identical one re-activated)', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowVersion'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/versions:
    get:
      operationId: listWorkflowVersions
      summary: List the published versions of a workflow
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'Page of versions', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/VersionPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/versions/{versionNumber}:
    get:
      operationId: getWorkflowVersion
      summary: Get a published version with the document it froze
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/VersionNumber'}
      responses:
        '200': {description: 'The version', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowVersionDocument'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /runs:
    get:
      operationId: listRuns
      summary: List the runs of a namespace, newest first
      tags: [Runs]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: workflowId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [RUNNING, WAITING, PAUSED, CANCELLING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]}}
      responses:
        '200': {description: 'Page of runs', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RunPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: startRun
      summary: Start a run of a published version
      tags: [Runs]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartRunRequest'}
      responses:
        '202': {description: 'Run durably accepted: its first steps exist and workers can claim them', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Get run state
      tags: [Runs]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: 'Run state', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /runs/{runId}/events:
    get:
      operationId: listRunJournalEvents
      summary: List run journal events in sequence order
      tags: [Runs]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'Paged journal timeline', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/JournalPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /runs/{runId}/graph:
    get:
      operationId: getRuntimeGraph
      summary: Get the definition graph overlaid with the run state of every step
      tags: [Runs]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: 'Runtime graph', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeGraph'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /runs/{runId}/operations:
    post:
      operationId: operateRun
      summary: Cancel, pause or resume a run
      tags: [Operations]
      x-implemented: '002'
      description: CANCEL, PAUSE and RESUME are supported. The other actions of the enumeration are declared for later features and are refused with 422.
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationRequest'}
      responses:
        '202': {description: 'Operation accepted', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/OperationResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /runs/{runId}/signals/{signalName}:
    post:
      operationId: signalRun
      summary: Send a signal to the waiting steps of a run that expect it
      tags: [Events]
      x-implemented: '002'
      description: The payload becomes the output of each woken waitEvent step. A signal that no step is waiting for is refused with 409, never buffered or dropped silently. A signal that would take the run over what a run may retain (4 MiB of step outputs and signal payloads) is refused with 429 and code `QUOTA_EXCEEDED`; retrying it will not help.
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: signalName, in: path, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventPayload'}
      responses:
        '202': {description: 'Signal durably admitted; names the waiting steps it woke', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SignalResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /events:
    post:
      operationId: publishEvent
      summary: Publish an event to the inbox
      tags: [Events]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IncomingEvent'}
      responses:
        '202': {description: Event persisted to inbox}
        '409': {$ref: '#/components/responses/Conflict'}
  /webhooks/{endpointId}:
    post:
      security: []
      operationId: receiveSignedWebhook
      summary: Receive a signed webhook
      tags: [Events]
      parameters:
        - name: endpointId
          in: path
          required: true
          schema: {type: string}
        - name: X-Octopus-Signature
          in: header
          required: true
          schema: {type: string}
        - name: X-Octopus-Timestamp
          in: header
          required: true
          schema: {type: string}
        - name: X-Octopus-Event-Id
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventPayload'}
      responses:
        '202': {description: "Signature verified, event durably admitted"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /scripts/builds:
    post:
      operationId: buildInlineScript
      summary: Build an inline script
      tags: [Scripts]
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BuildRequest'}
      responses:
        '202': {description: Async isolated build accepted, content: {application/json: {schema: {$ref: '#/components/schemas/BuildStatus'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  headers:
    TraceId:
      description: W3C trace id (32 lowercase hex characters) of the request, for log and trace correlation.
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  parameters:
    Namespace:
      name: X-Octopus-Namespace
      in: header
      required: true
      description: Namespace; authorization derives tenant from token, not header.
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 160}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `nextCursor` by the previous page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size; values outside 1..200 are clamped.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: {type: string}
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    JsonObject: {type: object, additionalProperties: true}
    Error:
      type: object
      required: [code, message, retryable, traceId]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, RATE_LIMITED, QUOTA_EXCEEDED, UNAVAILABLE, INTERNAL]
        message: {type: string, description: "Safe, human-readable summary. Never contains secrets, payloads or other tenants' data."}
        retryable: {type: boolean}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
        details: {type: object, additionalProperties: true}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    AuthContext:
      type: object
      required: [tenant, subject, role, permissions, traceId]
      properties:
        tenant: {type: string, description: Slug of the caller's tenant.}
        subject: {type: string}
        role: {type: string, enum: [admin, developer, operator, viewer]}
        permissions:
          type: array
          items: {type: string, example: 'workspace:read'}
        traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
    Workspace:
      type: object
      required: [id, slug, createdAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        createdAt: {type: string, format: date-time}
    CreateWorkspaceRequest:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', description: 'Unique inside the tenant. 3-63 characters; no consecutive hyphens.'}
    WorkspacePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Workspace'}}
        nextCursor: {type: [string, 'null']}
    NamespaceResource:
      type: object
      required: [id, workspaceId, slug, environment, createdAt]
      properties:
        id: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$'}
        environment: {type: string, enum: [dev, staging, prod]}
        createdAt: {type: string, format: date-time}
    CreateNamespaceRequest:
      type: object
      required: [slug, environment]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: '^[a-z][a-z0-9-]{1,61}[a-z0-9]$', description: 'Unique inside the tenant (not only inside the workspace).'}
        environment: {type: string, enum: [dev, staging, prod]}
    NamespacePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/NamespaceResource'}}
        nextCursor: {type: [string, 'null']}
    CreateWorkflowRequest:
      type: object
      required: [name, ir]
      properties:
        name: {type: string, description: 'Workflow name (a slug); the document must name the same workflow.'}
        ir: {$ref: '#/components/schemas/JsonObject'}
    UpdateDraftRequest:
      type: object
      required: [draftRevision, ir]
      additionalProperties: false
      properties:
        draftRevision: {type: integer, minimum: 1, description: 'The revision the client edited; a stale one is refused with 409.'}
        ir: {$ref: '#/components/schemas/JsonObject'}
    PublishRequest:
      type: object
      required: [draftRevision]
      additionalProperties: false
      properties:
        draftRevision: {type: integer, minimum: 1}
        releaseNotes: {type: string, maxLength: 2048}
    VersionSummary:
      type: object
      required: [workflowId, versionId, versionNumber, digest]
      properties:
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        versionNumber: {type: integer, minimum: 1}
        digest: {type: string, pattern: '^[0-9a-f]{64}$'}
        publishedBy: {type: string}
        publishedAt: {type: string, format: date-time}
    WorkflowDraft:
      type: object
      required: [id, name, draftRevision, ir]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        draftRevision: {type: integer, minimum: 1}
        ir: {$ref: '#/components/schemas/JsonObject'}
        activeVersion: {oneOf: [{$ref: '#/components/schemas/VersionSummary'}, {type: 'null'}]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    WorkflowVersion:
      allOf:
        - $ref: '#/components/schemas/VersionSummary'
        - type: object
          required: [created, warnings]
          properties:
            created: {type: boolean, description: 'False when the document was identical to an existing version, which was re-activated.'}
            warnings: {type: array, items: {type: string}}
    WorkflowVersionDocument:
      allOf:
        - $ref: '#/components/schemas/VersionSummary'
        - type: object
          required: [document]
          properties:
            releaseNotes: {type: [string, 'null']}
            document: {$ref: '#/components/schemas/JsonObject'}
    VersionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkflowVersionDocument'}}
        nextCursor: {type: [string, 'null']}
    WorkflowPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WorkflowDraft'}}
        nextCursor: {type: [string, 'null']}
    StartRunRequest:
      type: object
      required: [workflowId, input]
      additionalProperties: false
      properties:
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid, description: 'Optional explicit pin; the active version otherwise.'}
        input: {$ref: '#/components/schemas/JsonObject'}
        correlationId: {type: string, maxLength: 160}
        deadline: {type: string, format: date-time, description: 'Must be in the future and within a year; the run times out at this instant.'}
    Run:
      type: object
      required: [runId, workflowId, versionId, status, version, createdAt]
      properties:
        runId: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        status: {type: string, enum: [RUNNING, WAITING, PAUSED, CANCELLING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]}
        version: {type: integer, format: int64, minimum: 0, description: 'Number of journal events applied; usable as expectedRunVersion.'}
        paused: {type: boolean}
        startedBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: [string, 'null'], format: date-time}
        deadline: {type: [string, 'null'], format: date-time}
        traceId: {type: [string, 'null']}
        correlationId: {type: [string, 'null']}
        depth: {type: integer, minimum: 0, maximum: 8, description: 'Nesting of child runs: 0 for a run started through the API.'}
        parent:
          type: [object, 'null']
          description: 'Set when this run is the child of a `child` node of another run.'
          required: [runId, node, cancelPolicy]
          properties:
            runId: {type: string, format: uuid}
            node: {type: string}
            cancelPolicy: {type: string, enum: [PROPAGATE, REQUEST_CANCEL, DETACH]}
    RunPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Run'}}
        nextCursor: {type: [string, 'null']}
    JournalEvent:
      type: object
      required: [seq, eventType, occurredAt, actor]
      properties:
        seq: {type: integer, format: int64, minimum: 1}
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        stepId: {type: [string, 'null'], description: 'The node id the event concerns.'}
        attempt: {type: [integer, 'null']}
        actor: {type: string, description: 'user:<sub>, worker:<id> or system:<component>.'}
        traceId: {type: [string, 'null']}
        payloadRef: {type: [string, 'null'], description: 'SHA-256 of the output payload the event refers to.'}
    JournalPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/JournalEvent'}}
        nextCursor: {type: [string, 'null']}
    RuntimeGraph:
      type: object
      required: [runId, projectionSeq, nodes, edges]
      properties:
        runId: {type: string, format: uuid}
        status: {type: string}
        projectionSeq: {type: integer, format: int64}
        projectionLagMs: {type: integer, minimum: 0}
        nodes:
          type: array
          items:
            type: object
            required: [id, type, status]
            properties:
              id: {type: string}
              type: {type: string}
              status: {type: string, enum: [NOT_STARTED, PENDING, READY, LEASED, RUNNING, WAITING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]}
              attempt: {type: integer}
              generation: {type: integer}
              cancelRequested: {type: boolean}
              failureCode: {type: [string, 'null']}
              nextAttemptAt: {type: [string, 'null'], format: date-time}
              dueAt: {type: [string, 'null'], format: date-time}
              waitingOn: {type: [string, 'null'], enum: [timer, event, branches, child, null]}
              childRunId: {type: [string, 'null'], format: uuid, description: 'The child run a `child` node reserved.'}
        edges:
          type: array
          items:
            type: object
            required: [from, to, kind]
            properties:
              from: {type: string}
              to: {type: string}
              kind: {type: string, enum: [next, error, 'true', 'false', branch, timeout]}
    OperationRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [PAUSE, RESUME, CANCEL, RETRY_STEP, RETRY_COMPENSATION, RERUN_AS_NEW, MARK_MANUAL_REVIEW]}
        stepId: {type: string}
        reason: {type: string, minLength: 8, maxLength: 2000}
        expectedRunVersion: {type: integer, minimum: 0, description: 'Optimistic concurrency: refused with 409 if the run moved on.'}
    OperationResult:
      type: object
      required: [operationId, accepted]
      properties:
        operationId: {type: string, format: uuid}
        accepted: {type: boolean}
        runStatus: {type: string}
        runVersion: {type: integer, format: int64}
    SignalResult:
      type: object
      required: [deliveredTo]
      properties:
        deliveredTo: {type: array, items: {type: string}, description: 'The waitEvent nodes the signal woke.'}
    EventPayload: {$ref: '#/components/schemas/JsonObject'}
    IncomingEvent:
      type: object
      required: [eventId, type, data]
      properties:
        eventId: {type: string}
        type: {type: string}
        subject: {type: string}
        occurredAt: {type: string, format: date-time}
        correlationKey: {type: string}
        data: {$ref: '#/components/schemas/JsonObject'}
    BuildRequest:
      type: object
      required: [language, source, lockfile]
      properties:
        language: {type: string, enum: [typescript, python, csharp, go, java]}
        source: {type: string}
        lockfile: {type: string}
        toolchain: {type: string}
    BuildStatus:
      type: object
      required: [buildId, status]
      properties:
        buildId: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, BUILDING, SUCCEEDED, FAILED, CANCELLED]}
        artifactDigest: {type: string}
  responses:
    BadRequest: {description: 'A required header is missing or the body is not valid JSON', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflict or stale version, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Invalid input/schema/graph, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooManyRequests: {description: 'The caller exceeded its request budget (per token subject, checked before any database lookup, or per tenant); retry after the delay in Retry-After', headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: A dependency is temporarily unavailable; retry later, headers: {Retry-After: {schema: {type: integer, minimum: 0}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InternalError: {description: "Any other failure: 500 for an unexpected error, 408 when the request timed out. Same envelope.", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
