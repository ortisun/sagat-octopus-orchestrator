openapi: 3.1.0
info:
  title: Sagat Octopus Orchestrator Control & Execution API
  version: 0.1.0
  description: |
    Operations tagged `Identity` are implemented by the control plane (feature 001); operations marked
    `x-implemented: '002'` (workflow definitions, runs, operator actions and signals) by the durable
    execution engine (feature 002), and those marked `x-implemented: '009'` (quotas, worker bindings, secrets, egress policy) by the governance routes
    of feature 009. Feature 003 (sagas) adds `getCompensationPlans` (`x-implemented: '003'`) and extends `operateRun`
    (`x-extended: '003'`), the run statuses and the runtime graph. Every other operation is a design proposal that is not implemented yet. The worker protocol is gRPC (`worker.proto`), not REST.
    The database is the source of truth; commands may be redelivered.
    Tenant resolved by authentication, never from a free-form tenant_id supplied by the client.

    Authentication: `Authorization: Bearer <JWT>` issued by the configured OIDC provider. The token MUST carry
    `iss`, `aud`, `sub`, `exp`, `iat` and a tenant claim (default name `tenant`, the tenant slug). Only
    asymmetric algorithms (RS256, ES256) are accepted. A tenant is NEVER read from a header or a body.

    Errors use one envelope (`Error`). A resource that exists only in another tenant is reported as
    `NOT_FOUND`, indistinguishable from a missing one.

    Known gap: creating workspaces and namespaces is not yet idempotent through `Idempotency-Key`; a retry after
    an ambiguous response returns `409 CONFLICT` and the client should read the resource back.
servers:
  - url: https://api.sagat-octopus-orchestrator.example/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Workflows
  - name: Runs
  - name: Events
  - name: Scripts
  - name: Operations
  - name: Governance
    description: Quotas, worker bindings, secrets and egress policy of a tenant or namespace (feature 009).
  - name: Versions
    description: Approvals before a publication, the active version of a workflow and its history, and promotion between environments (feature 011).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [Identity]
      security: []
      responses:
        '200': {description: 'The process is alive', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe (checks the database)
      tags: [Identity]
      security: []
      responses:
        '200': {description: 'Ready to serve traffic', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/InternalError'}
  /auth/context:
    get:
      operationId: getAuthContext
      summary: Describe the authenticated caller
      tags: [Identity]
      responses:
        '200': {description: 'Resolved identity of the caller', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AuthContext'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /version:
    get:
      operationId: getPlatformVersion
      summary: Say which build, which API and which worker protocols this platform speaks
      tags: [Identity]
      x-implemented: '012'
      description: >-
        Needs a token and no permission. A client compares it with what it was written for (`sagat doctor` does):
        `version` is the build, `apiVersion` the path prefix, `workerProtocol` the lowest and highest protocol a
        worker may offer. A platform older than feature 012 answers `404 ROUTE_NOT_FOUND`.
      responses:
        '200': {description: 'The versions', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformVersion'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces of the caller's tenant
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: 'Page of workspaces', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspacePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '201': {description: 'Workspace created', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get a workspace
      tags: [Identity]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'The workspace', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workspaces/{workspaceId}/namespaces:
    post:
      operationId: createNamespace
      summary: Create a namespace inside a workspace
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
        - name: workspaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateNamespaceRequest'}
      responses:
        '400': {$ref: '#/components/responses/BadRequest'}
        '201': {description: 'Namespace created', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespaceResource'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces:
    get:
      operationId: listNamespaces
      summary: List namespaces of the caller's tenant
      tags: [Identity]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: 'Page of namespaces', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespacePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /namespaces/{namespaceId}:
    get:
      operationId: getNamespace
      summary: Get a namespace
      tags: [Identity]
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: 'The namespace', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/NamespaceResource'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows:
    get:
      operationId: listWorkflows
      summary: List the workflows of a namespace
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'Page of workflows', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createWorkflowDraft
      summary: Create a workflow with its first draft
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkflowRequest'}
      responses:
        '201': {description: 'Draft created', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowDraft'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}:
    get:
      operationId: getWorkflow
      summary: Get a workflow with its draft and active version
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
      responses:
        '200': {description: 'The workflow', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowDraft'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
    put:
      operationId: updateWorkflowDraft
      summary: Replace the draft if it is still at the given revision
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDraftRequest'}
      responses:
        '200': {description: 'Draft updated', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowDraft'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/publish:
    post:
      operationId: publishWorkflow
      summary: Publish an immutable workflow version and make it active
      tags: [Workflows]
      x-implemented: '002'
      description: Validates the draft against the workflow schema, the graph rules and the expression subset. A namespace that asks for approvals (production by default, see `getPublicationPolicy`) refuses it with `409 APPROVAL_REQUIRED`, and the draft goes through `openPublicationRequest` instead. A document with no engine yet (foreach, humanApproval) is refused with a reason. A `script` node pins the digest of a ready script artifact of the tenant (`UNKNOWN_SCRIPT` otherwise) and runs as the activity `script.sha256-<hex>`. compensateWith/reconcileWith are accepted with a warning because compensation is not executed yet.
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublishRequest'}
      responses:
        '201': {description: 'Immutable version published (or an identical one re-activated)', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowVersion'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/validate:
    post:
      operationId: validateWorkflowDraft
      summary: Check a document without saving or publishing it
      tags: [Workflows]
      x-implemented: '007'
      description: |
        A dry run of what `publishWorkflow` checks, for an editor that wants to show every problem while the author works. The
        document is the `ir` in the body or, when the body is `{}`, the stored draft. It is answered **200** whether the
        document is valid or not: `valid` is false when any problem has the severity `error`, and the problems say where
        (`nodeId` for a rule that names a node, `path` as a JSON pointer for a schema problem). Schema problems are listed all
        (at most 20); the graph rules stop at the first one broken, so fix it and validate again. `warnings` are the ones
        `publishWorkflow` would return. Nothing is stored and nothing is audited. A secret the caller may not use and a script
        digest no build produced are problems too, answered as publish would. Needs `definition:write`.
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ValidateRequest'}
      responses:
        '200': {description: 'The problems found, possibly none', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Validation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/diff:
    get:
      operationId: diffWorkflow
      summary: Compare two documents of a workflow and say which changes break its contract
      tags: [Workflows]
      x-implemented: '007'
      description: |
        Compares two documents of the workflow, each the draft (`draft`) or a published version (its number). The default is the
        active version against the draft; a workflow with no version compares an empty document against the draft. The comparison
        is of the documents as written, so a draft that does not validate can be compared. `breaking` lists what can make a
        caller or an emitter of the contract fail: a trigger removed or changed, an input property removed, retyped or newly
        required, an output property removed or retyped, an awaited event type removed or renamed. `attention` lists what
        somebody must prepare: an activity name added or changed (a worker must serve it and be bound to it), a secret name added,
        a script digest changed. Runs already started are pinned to their version and are not affected by either. Needs
        `definition:read`.
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {name: from, in: query, required: false, schema: {type: string, pattern: '^(draft|[1-9][0-9]{0,8})$'}, description: 'The older side: `draft` or a version number. Default: the active version.'}
        - {name: to, in: query, required: false, schema: {type: string, pattern: '^(draft|[1-9][0-9]{0,8})$'}, description: 'The newer side. Default: `draft`.'}
      responses:
        '200': {description: 'The differences', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/DefinitionDiff'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/versions:
    get:
      operationId: listWorkflowVersions
      summary: List the published versions of a workflow
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'Page of versions', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/VersionPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/versions/{versionNumber}:
    get:
      operationId: getWorkflowVersion
      summary: Get a published version with the document it froze
      tags: [Workflows]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/VersionNumber'}
      responses:
        '200': {description: 'The version', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowVersionDocument'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /workflows/{workflowId}/versions/{versionNumber}/compensation-plans:
    get:
      operationId: getCompensationPlans
      summary: Get the compensation plans a version was published with
      tags: [Workflows]
      x-implemented: '003'
      description: One plan per saga, recorded when the version was published and never changed afterwards. A workflow without a saga has none (an empty list).
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/VersionNumber'}
      responses:
        '200': {description: 'The plans', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/CompensationPlans'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /run-input-blobs:
    post:
      operationId: uploadRunInput
      summary: Stage a streaming run input owned by the authenticated uploader
      description: 'Requires run:start and a configured shared blob provider. The raw bytes remain opaque; starting a run validates the canonical $blob descriptor against its inputSchema. Staging is not automatically retried: an uncertain response may leave an unused upload for durable cleanup. The ordinary JSON body limit is unchanged.'
      tags: [Runs]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {name: X-Octopus-Blob-Size, in: header, required: false, schema: {type: integer, format: int64, minimum: 0}}
        - {name: X-Octopus-Blob-Sha256, in: header, required: false, schema: {type: string, pattern: '^[0-9a-fA-F]{64}$'}}
      requestBody:
        required: true
        content:
          '*/*':
            schema: {type: string, format: binary}
      responses:
        '201': {description: 'Fully measured staged input; only its uploader may bind it to one new run', headers: {X-Trace-Id: {$ref: '#/components/headers/TraceId'}, X-Request-Id: {$ref: '#/components/headers/HttpRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/BlobDescriptor'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '408': {description: 'The transfer deadline expired'}
        '413': {description: 'The configured blob size limit was exceeded'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /runs:
    get:
      operationId: listRuns
      summary: List the runs of a namespace, newest first
      tags: [Runs]
      x-implemented: '002'
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: workflowId, in: query, schema: {type: string}}
