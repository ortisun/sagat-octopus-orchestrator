      summary: Receive an authenticated webhook
      tags: [Events]
      x-implemented: '004'
      description: |
        The public URL of an event endpoint. Authentication is selected by its persisted profile; profiles never fall back to one another. HMAC requires X-Octopus-Signature. OIDC requires an Authorization bearer token from the deployment-approved verifier and the exact configured subject. MTLS requires a native TLS client certificate with the configured verified leaf fingerprint; forwarded headers are ignored. OIDC and MTLS authenticate the sender over TLS, not a detached body signature. All profiles require the timestamp and event ID. An unavailable OIDC key provider returns 503. For HMAC, the signature is `v1=` and the hex HMAC-SHA256, under the endpoint's secret, of `"octopus-event-in-v1\n{timestamp}\n{eventId}\n{eventType}\n{subject}\n{correlationKey}\n"` followed by the body, where the type, the subject and the correlation key are the values of the headers of the same names *as sent* (an absent one is the empty string; the endpoint's default type is not signed). They are covered because the type chooses the workflows that start and the key the waits that wake. A secret of fewer than 16 bytes verifies nothing. The timestamp is in seconds and must be within the endpoint's allowed skew of the platform's clock (300 s unless set); a copy of a signed request replayed within the window is answered `DUPLICATE`, because the event id is remembered for at least twice the skew. Up to four comma-separated signatures (512 bytes at most) are accepted, so a secret can be rotated; the three newest versions of the secret are tried. A header that is too long, or a timestamp outside the window, is refused before any secret is read. **Every request that does not verify gets the same 401**: an unknown endpoint, a missing header, a stale timestamp, a wrong signature. The body must be a JSON object of at most the endpoint's limit (240 KiB at most). A paused endpoint answers 503, an endpoint over its rate 429, and a full backlog 429; both with `Retry-After`.
