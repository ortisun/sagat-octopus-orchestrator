asyncapi: 3.0.0
info:
  title: Sagat Octopus Orchestrator Integration Events
  version: 0.3.0
  description: |
    Event contract; at-least-once everywhere. Internal hints use the selected NATS or Redis transport. NATS deduplicates within its configured window using Nats-Msg-Id (the outbox row id); Redis carries the same stable id in message-id and may contain duplicate physical entries; events that come in (webhook, API, broker) are deduplicated by (tenant, namespace, source, eventId) for the endpoint's window; events that go out (webhooks and broker subscriptions) carry a stable delivery id.

    Evolution (FR-004-007): within a version of this document a message only grows. A property is never removed, renamed or given another type; a new property is optional; an enumeration gains values and never loses them; `required` never gains a member. A change that cannot be made that way is a new message with a new name next to the old one, and the old one is kept for the period the deprecation notice in `docs/event-schema-evolution.md` states. `tests/contract/events-webhooks-messaging/asyncapi` holds the previous shape of every message (`events.baseline.json`) and fails a change that breaks it.
defaultContentType: application/json
servers:
  internal:
    host: nats:4222
    protocol: nats
  internalRedis:
    host: redis:6379
    protocol: redis
    description: 'Optional internal transport. XADD into SAGAT_REDIS_STREAM carries binary fields message-id, subject and payload. The subject retains the logical channel address. Exact MAXLEN retention applies only to hints; PostgreSQL remains authoritative. Selection requires a deployment-wide cold cutover.'
  public:
    host: platform.example.com
    protocol: https
    description: The control plane, where providers post webhooks.
channels:
  # --- Implemented by feature 002 (the outbox dispatcher of the execution engine) ---------------
  # Hints and events carry identifiers only: never payloads, tokens or secrets. Delivery is
  # at-least-once; the `Nats-Msg-Id` header is the outbox row id, so JetStream drops duplicates
  # inside its window. A message is a hint: a worker still has to claim the step through the worker
  # API (PollTasks), and a consumer must treat `run.finished` as a notification to read the run.
  taskReady:
    address: sagat.v1.task.ready.{tenant}.{activity}
    description: A step became ready for a worker. One subject per tenant and activity name (bounded by the tenant's definitions, never by runs); the activity name may contain dots, which are further subject tokens, so a pool filters with `sagat.v1.task.ready.<tenant>.<activity>`.
    parameters:
      tenant:
        description: Tenant id (UUID).
      activity:
        description: Activity name as declared by the definition, for example payments.charge.
    messages:
      taskReady:
        $ref: '#/components/messages/TaskReady'
  runFinished:
    address: sagat.v1.run.finished.{tenant}
    description: A run reached a terminal status.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      runFinished:
        $ref: '#/components/messages/RunFinished'
  # --- Implemented by feature 014 (workflow primitives) -------------------------------------
  # The same outbox and dispatcher as above publish these hints: identifiers, statuses, indices and
  # revisions only, never inputs, results, declared state or secrets. Nothing in the platform
  # consumes them; they let an operator or an integration watch a primitive without polling. A hint
  # is redeliverable and may arrive out of order: read the run (or chain) before acting on it.
  runContinued:
    address: sagat.v1.run.continued.{tenant}
    description: A chain segment handed off to its successor (Continue-As-New).
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      runContinued:
        $ref: '#/components/messages/RunContinued'
  chainFinished:
    address: sagat.v1.chain.finished.{tenant}
    description: A continuation chain reached its final outcome; `headRunId` is the segment that ended it.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      chainFinished:
        $ref: '#/components/messages/ChainFinished'
  capacityMemberFinished:
    address: sagat.v1.capacity.member.finished.{tenant}
    description: A dormant capacity member settled after its own child chain FINAL. Reference-only discovery hint, not execution or foreign-run scheduling authority; no production caller is enabled by this vocabulary.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      capacityMemberFinished:
        $ref: '#/components/messages/CapacityMemberFinished'
  capacityMemberVacated:
    address: sagat.v1.capacity.member.vacated.{tenant}
    description: A quiescent ChildRoot member vacated capacity possession while retaining active membership. Reference-only discovery hint, not execution or foreign-run scheduling authority; no production caller is enabled by this vocabulary.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      capacityMemberVacated:
        $ref: '#/components/messages/CapacityMemberVacated'
  capacityScopedMemberFinished:
    address: sagat.v1.capacity.scoped_member.finished.{tenant}
    description: A dormant scoped-path capacity member settled from retained OrdinaryLeafV1 source evidence. Reference-only discovery hint, not execution or foreign-run scheduling authority; no production caller is enabled by this vocabulary.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      capacityScopedMemberFinished:
        $ref: '#/components/messages/CapacityScopedMemberFinished'
  loopFinished:
    address: sagat.v1.loop.finished.{tenant}
    description: A loop node finished (the run may continue past it).
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      loopFinished:
        $ref: '#/components/messages/LoopHint'
  loopIterationLimit:
    address: sagat.v1.loop.iteration_limit.{tenant}
    description: A loop exhausted `maxIterations` or the run's instance budget; the run is stopping with ITERATION_LIMIT or INSTANCE_LIMIT.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      loopIterationLimit:
        $ref: '#/components/messages/LoopHint'
  loopDrainStarted:
    address: sagat.v1.loop.drain_started.{tenant}
    description: A loop started draining its active iteration (failure, cancellation or deadline).
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      loopDrainStarted:
        $ref: '#/components/messages/LoopHint'
  loopIterationDrained:
    address: sagat.v1.loop.iteration.drained.{tenant}
    description: The active iteration of a draining loop has settled.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      loopIterationDrained:
        $ref: '#/components/messages/LoopHint'
  loopTimerScheduled:
    address: sagat.v1.loop.timer.scheduled.{tenant}
    description: A loop scheduled its durable delay before the next iteration.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      loopTimerScheduled:
        $ref: '#/components/messages/LoopTimerScheduled'
  approvalOpened:
    address: sagat.v1.approval.opened.{tenant}
    description: An approval request opened and waits for an eligible decision.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      approvalOpened:
        $ref: '#/components/messages/ApprovalOpened'
  approvalSettled:
    address: sagat.v1.approval.settled.{tenant}
    description: An approval request was decided or expired, and the run took the matching route.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      approvalSettled:
        $ref: '#/components/messages/ApprovalSettled'
  approvalCancelled:
    address: sagat.v1.approval.cancelled.{tenant}
    description: An open approval request was cancelled with its run.
    parameters:
      tenant:
        description: Tenant id (UUID).
    messages:
      approvalCancelled:
        $ref: '#/components/messages/ApprovalCancelled'
  runStateUpdated:
    address: sagat.v1.run.state_updated.{tenant}.{routingKey}
    description: A declared Update was applied and the run's declared state revision advanced.
    parameters:
      tenant:
        description: Tenant id (UUID).
      routingKey:
        description: The declared update operation name, mapped onto subject-safe tokens.
    messages:
      runStateUpdated:
        $ref: '#/components/messages/RunStateUpdated'
  collectionIterationCheckpointed:
    address: sagat.v1.collection.iteration.checkpointed.{tenant}.{routingKey}
    description: One iteration of a forEach/map collection committed its result.
    parameters:
      tenant:
        description: Tenant id (UUID).
      routingKey:
        description: The collection node id, mapped onto subject-safe tokens.
    messages:
      collectionIterationCheckpointed:
        $ref: '#/components/messages/CollectionIteration'
  collectionDrainStarted:
    address: sagat.v1.collection.drain.started.{tenant}.{routingKey}
    description: A collection stopped admitting iterations and drains the active ones.
    parameters:
      tenant:
        description: Tenant id (UUID).
      routingKey:
        description: The collection node id, mapped onto subject-safe tokens.
    messages:
      collectionDrainStarted:
        $ref: '#/components/messages/CollectionDrainStarted'
  collectionIterationDrained:
    address: sagat.v1.collection.iteration.drained.{tenant}.{routingKey}
    description: An active iteration of a draining collection has settled.
    parameters:
      tenant:
        description: Tenant id (UUID).
      routingKey:
        description: The collection node id, mapped onto subject-safe tokens.
    messages:
      collectionIterationDrained:
        $ref: '#/components/messages/CollectionIteration'
  collectionFinished:
    address: sagat.v1.collection.finished.{tenant}.{routingKey}
    description: A collection node finished.
    parameters:
      tenant:
        description: Tenant id (UUID).
      routingKey:
        description: The collection node id, mapped onto subject-safe tokens.
    messages:
      collectionFinished:
        $ref: '#/components/messages/CollectionFinished'
  # --- Implemented by feature 004 ------------------------------------------------------------
  inboundWebhook:
    address: /v1/webhooks/{endpointId}
    description: A provider posts a signed event. The signature is the credential; every request that does not verify gets the same 401.
    servers: [{$ref: '#/servers/public'}]
    parameters:
      endpointId:
        description: The id of an event endpoint (a random UUID).
    messages:
      webhookEvent:
        $ref: '#/components/messages/WebhookEvent'
  outboundWebhook:
    address: '{subscriberUrl}'
    description: The platform posts an event to a subscriber's URL, signed with a secret of the namespace, from the egress client that obeys the namespace's egress policy.
    parameters:
      subscriberUrl:
        description: The URL of a webhook subscription.
    messages:
      runFinishedWebhook:
        $ref: '#/components/messages/RunFinishedWebhook'
      operationalAlertWebhook:
        $ref: '#/components/messages/OperationalAlertWebhook'
  outboundBroker:
    address: '{subjectTopicOrQueue}'
    description: The platform publishes an event to a managed NATS JetStream subject, Kafka topic, SQS queue or Redis Stream after the namespace egress policy permits the destination. The delivery id stays stable across retries. JetStream receives it as Nats-Msg-Id, Kafka as the record key, and an SQS FIFO queue as MessageDeduplicationId. Redis receives XADD fields event-id, event-type, delivery-id, attempt, schema-version, optional traceparent, content-type and body (raw JSON bytes), without MAXLEN trimming. XADD acknowledgement confirms acceptance, not arbitrary fsync or failover durability. A lost acknowledgement may produce a repeat.
    parameters:
      subjectTopicOrQueue:
        description: The NATS subject, Kafka topic, SQS queue URL or Redis stream key of a broker subscription.
    messages:
      runFinishedBroker:
        $ref: '#/components/messages/RunFinishedBroker'
  brokerMessages:
    address: '{topicOrQueue}'
    description: A Kafka topic, an SQS queue or a NATS JetStream stream that a connector reads. Whatever the broker, the message is the event data (a JSON object) and the envelope travels in headers (Kafka, NATS) or message attributes (SQS).
    parameters:
      topicOrQueue:
        description: The topic, queue or stream a connector is configured with.
    messages:
      brokerMessage:
        $ref: '#/components/messages/BrokerMessage'
operations:
  publishTaskReady:
    action: send
    channel: {$ref: '#/channels/taskReady'}
    messages: [{$ref: '#/channels/taskReady/messages/taskReady'}]
  publishRunFinished:
    action: send
    channel: {$ref: '#/channels/runFinished'}
    messages: [{$ref: '#/channels/runFinished/messages/runFinished'}]
  publishRunContinued:
    action: send
    channel: {$ref: '#/channels/runContinued'}
    messages: [{$ref: '#/channels/runContinued/messages/runContinued'}]
  publishChainFinished:
    action: send
    channel: {$ref: '#/channels/chainFinished'}
    messages: [{$ref: '#/channels/chainFinished/messages/chainFinished'}]
  publishCapacityMemberFinished:
    action: send
    channel: {$ref: '#/channels/capacityMemberFinished'}
    messages: [{$ref: '#/channels/capacityMemberFinished/messages/capacityMemberFinished'}]
  publishCapacityMemberVacated:
    action: send
    channel: {$ref: '#/channels/capacityMemberVacated'}
    messages: [{$ref: '#/channels/capacityMemberVacated/messages/capacityMemberVacated'}]
  publishCapacityScopedMemberFinished:
    action: send
    channel: {$ref: '#/channels/capacityScopedMemberFinished'}
    messages: [{$ref: '#/channels/capacityScopedMemberFinished/messages/capacityScopedMemberFinished'}]
  publishLoopFinished:
    action: send
    channel: {$ref: '#/channels/loopFinished'}
    messages: [{$ref: '#/channels/loopFinished/messages/loopFinished'}]
  publishLoopIterationLimit:
    action: send
    channel: {$ref: '#/channels/loopIterationLimit'}
    messages: [{$ref: '#/channels/loopIterationLimit/messages/loopIterationLimit'}]
  publishLoopDrainStarted:
    action: send
    channel: {$ref: '#/channels/loopDrainStarted'}
    messages: [{$ref: '#/channels/loopDrainStarted/messages/loopDrainStarted'}]
  publishLoopIterationDrained:
    action: send
    channel: {$ref: '#/channels/loopIterationDrained'}
    messages: [{$ref: '#/channels/loopIterationDrained/messages/loopIterationDrained'}]
  publishLoopTimerScheduled:
    action: send
    channel: {$ref: '#/channels/loopTimerScheduled'}
    messages: [{$ref: '#/channels/loopTimerScheduled/messages/loopTimerScheduled'}]
  publishApprovalOpened:
    action: send
    channel: {$ref: '#/channels/approvalOpened'}
    messages: [{$ref: '#/channels/approvalOpened/messages/approvalOpened'}]
  publishApprovalSettled:
    action: send
    channel: {$ref: '#/channels/approvalSettled'}
    messages: [{$ref: '#/channels/approvalSettled/messages/approvalSettled'}]
  publishApprovalCancelled:
    action: send
    channel: {$ref: '#/channels/approvalCancelled'}
    messages: [{$ref: '#/channels/approvalCancelled/messages/approvalCancelled'}]
  publishRunStateUpdated:
    action: send
    channel: {$ref: '#/channels/runStateUpdated'}
    messages: [{$ref: '#/channels/runStateUpdated/messages/runStateUpdated'}]
  publishCollectionIterationCheckpointed:
    action: send
    channel: {$ref: '#/channels/collectionIterationCheckpointed'}
    messages: [{$ref: '#/channels/collectionIterationCheckpointed/messages/collectionIterationCheckpointed'}]
  publishCollectionDrainStarted:
    action: send
    channel: {$ref: '#/channels/collectionDrainStarted'}
    messages: [{$ref: '#/channels/collectionDrainStarted/messages/collectionDrainStarted'}]
  publishCollectionIterationDrained:
    action: send
    channel: {$ref: '#/channels/collectionIterationDrained'}
    messages: [{$ref: '#/channels/collectionIterationDrained/messages/collectionIterationDrained'}]
  publishCollectionFinished:
    action: send
    channel: {$ref: '#/channels/collectionFinished'}
    messages: [{$ref: '#/channels/collectionFinished/messages/collectionFinished'}]
  receiveWebhook:
    action: receive
    channel: {$ref: '#/channels/inboundWebhook'}
    messages: [{$ref: '#/channels/inboundWebhook/messages/webhookEvent'}]
  sendRunFinishedWebhook:
    action: send
    channel: {$ref: '#/channels/outboundWebhook'}
    messages: [{$ref: '#/channels/outboundWebhook/messages/runFinishedWebhook'}]
  sendOperationalAlertWebhook:
    action: send
    channel: {$ref: '#/channels/outboundWebhook'}
    messages: [{$ref: '#/channels/outboundWebhook/messages/operationalAlertWebhook'}]
  sendRunFinishedBroker:
    action: send
    channel: {$ref: '#/channels/outboundBroker'}
    messages: [{$ref: '#/channels/outboundBroker/messages/runFinishedBroker'}]
  consumeBrokerMessage:
    action: receive
    channel: {$ref: '#/channels/brokerMessages'}
    messages: [{$ref: '#/channels/brokerMessages/messages/brokerMessage'}]
components:
  messages:
    TaskReady:
      name: TaskReady
      contentType: application/json
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, node, activity]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          node: {type: string}
          activity: {type: string}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
          instancePath:
            type: array
            maxItems: 8
            description: 'Feature 014: the scoped instance of the step, outermost first; empty for a root step. Absent from hints written before worker protocol 1.5.'
            items:
              type: object
              required: [scope, index]
              properties:
                scope: {type: string, description: 'The node id of the collection or loop that owns the scope.'}
                index: {type: integer, minimum: 0, maximum: 9999}
    RunFinished:
      name: RunFinished
      contentType: application/json
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, status]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          status: {type: string, enum: [SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, COMPENSATED, PARTIAL, COMPENSATION_FAILED], description: "How the run ended. COMPENSATED, PARTIAL and COMPENSATION_FAILED are the ends of a run whose saga undid its work (feature 003); a cancelled or timed-out run is reported as such once what it had done was undone."}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    RunContinued:
      name: RunContinued
      contentType: application/json
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, chainId, predecessorRunId, successorRunId]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          chainId: {type: string, format: uuid}
          predecessorRunId: {type: string, format: uuid}
          successorRunId: {type: string, format: uuid}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    ChainFinished:
      name: ChainFinished
      contentType: application/json
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, chainId, headRunId, status]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          chainId: {type: string, format: uuid}
          headRunId: {type: string, format: uuid, description: 'The segment whose end is the chain outcome.'}
          status: {type: string, enum: [SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, COMPENSATED, PARTIAL, COMPENSATION_FAILED]}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    CapacityMemberFinished:
      name: CapacityMemberFinished
      contentType: application/json
      description: Reference-only capacity settlement metadata. Read current guarded state before acting; revisions here describe the committed receipt, not current execution authority.
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        additionalProperties: false
        required: [tenantId, namespaceId, groupId, memberId, chainId, headRunId, resultingRevision, epoch, retired]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          groupId: {type: string, format: uuid}
          memberId: {type: string, format: uuid}
          chainId: {type: string, format: uuid}
          headRunId: {type: string, format: uuid}
          resultingRevision: {type: integer, minimum: 2, maximum: 9223372036854775807}
          epoch: {type: integer, minimum: 1, maximum: 9223372036854775807}
          retired: {type: boolean}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the owning run.'}
    CapacityMemberVacated:
      name: CapacityMemberVacated
      contentType: application/json
      description: Reference-only capacity vacancy metadata. Read current guarded state before acting; revisions here describe the committed receipt, not current execution authority.
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        additionalProperties: false
        required: [tenantId, namespaceId, groupId, memberId, chainId, headRunId, resultingRevision, epoch]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          groupId: {type: string, format: uuid}
          memberId: {type: string, format: uuid}
          chainId: {type: string, format: uuid}
          headRunId: {type: string, format: uuid}
          resultingRevision: {type: integer, minimum: 2, maximum: 9223372036854775807}
          epoch: {type: integer, minimum: 2, maximum: 9223372036854775807}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the owning run.'}
    CapacityScopedMemberFinished:
      name: CapacityScopedMemberFinished
      contentType: application/json
      description: Reference-only scoped capacity settlement metadata. Read qualified durable state before acting; revisions here describe the committed receipt, not current execution authority.
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        additionalProperties: false
        required: [tenantId, namespaceId, groupId, memberId, originalRunId, rootOwnerNode, iterationIndex, resultingRevision, epoch, retired]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          groupId: {type: string, format: uuid}
          memberId: {type: string, format: uuid}
          originalRunId: {type: string, format: uuid}
          rootOwnerNode: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'}
          iterationIndex: {type: integer, minimum: 0, maximum: 9999}
          resultingRevision: {type: integer, minimum: 2, maximum: 9223372036854775807}
          epoch: {type: integer, minimum: 1, maximum: 9223372036854775807}
          retired: {type: boolean}
          traceId: {type: [string, 'null'], pattern: '^[0-9a-f]{32}$', description: 'W3C trace id (32 lowercase hex) of the guarded original run.'}
    LoopHint:
      name: LoopHint
      contentType: application/json
      description: 'Shared by loop.finished, loop.iteration_limit (FAILED), loop.drain_started and loop.iteration.drained (DRAINING).'
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, node, status]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          node: {type: string, description: 'The loop node id.'}
          status: {type: string, enum: [SUCCEEDED, FAILED, CANCELLED, DRAINING]}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    LoopTimerScheduled:
      name: LoopTimerScheduled
      contentType: application/json
      description: 'tenantId and namespaceId were added before the first release that published this hint.'
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, timerId, dueAtMicros]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          timerId: {type: string, format: uuid}
          dueAtMicros: {type: integer, description: 'When the delay elapses, in microseconds since the Unix epoch (UTC).'}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    ApprovalOpened:
      name: ApprovalOpened
      contentType: application/json
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, requestId, deadline]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          requestId: {type: string, format: uuid}
          deadline: {type: integer, description: 'When the request expires, in seconds since the Unix epoch (UTC).'}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    ApprovalSettled:
      name: ApprovalSettled
      contentType: application/json
      description: 'The decider and any reason code stay in the audit trail; they are never in a hint.'
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, requestId, status, route, outcomeSequence]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          requestId: {type: string, format: uuid}
          status: {type: string, enum: [APPROVED, REJECTED, EXPIRED]}
          route: {type: string, description: 'The node the run continues at.'}
          outcomeSequence: {type: integer, minimum: 1, description: 'Journal sequence of the outcome.'}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    ApprovalCancelled:
      name: ApprovalCancelled
      contentType: application/json
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, requestId, outcomeSequence]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          requestId: {type: string, format: uuid}
          outcomeSequence: {type: integer, minimum: 1}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    RunStateUpdated:
      name: RunStateUpdated
      contentType: application/json
      description: 'Never carries the arguments, the new state or the result; read them through the declared Query.'
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, operation, runVersion, stateRevision]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          operation: {type: string, description: 'The declared update name.'}
          runVersion: {type: integer, minimum: 1}
          stateRevision: {type: integer, minimum: 1}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    CollectionIteration:
      name: CollectionIteration
      contentType: application/json
      description: 'Shared by collection.iteration.checkpointed and collection.iteration.drained.'
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, scopeId, index]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          scopeId: {type: string, format: uuid, description: 'The collection scope instance.'}
          index: {type: integer, minimum: 0, maximum: 9999}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    CollectionDrainStarted:
      name: CollectionDrainStarted
      contentType: application/json
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, scopeId, reason]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          scopeId: {type: string, format: uuid}
          reason: {type: string, enum: [FAILED, STORAGE_QUOTA, CANCELLED]}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    CollectionFinished:
      name: CollectionFinished
      contentType: application/json
      headers:
        type: object
        properties:
          Nats-Msg-Id: {type: string, description: 'The outbox row id; stable across redeliveries.'}
      payload:
        type: object
        required: [tenantId, namespaceId, runId, scopeId, status]
        properties:
          tenantId: {type: string, format: uuid}
          namespaceId: {type: string, format: uuid}
          runId: {type: string, format: uuid}
          scopeId: {type: string, format: uuid}
          status: {type: string, enum: [SUCCEEDED, FAILED, CANCELLED]}
          traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run.'}
    WebhookEvent:
      name: WebhookEvent
      contentType: application/json
      headers:
        type: object
        required: [X-Octopus-Signature, X-Octopus-Timestamp, X-Octopus-Event-Id]
        properties:
          X-Octopus-Signature: {type: string, description: '`v1=` and the hex HMAC-SHA256 of "octopus-event-in-v1\n{timestamp}\n{eventId}\n{eventType}\n{subject}\n{correlationKey}\n" followed by the body, with the type, the subject and the correlation key as sent in the headers below (absent: empty). Up to four, comma separated, 512 bytes at most, are accepted while a secret is rotated.'}
          X-Octopus-Timestamp: {type: string, pattern: '^[0-9]+$', description: 'Seconds since the epoch; within the endpoint''s skew (300 s by default) of the platform''s clock.'}
          X-Octopus-Event-Id: {type: string, description: 'Unique within the endpoint for the deduplication window (24 hours by default, at least twice the skew).'}
          X-Octopus-Event-Type: {type: string, description: 'Required unless the endpoint has a default type.'}
          X-Octopus-Subject: {type: string}
          X-Octopus-Correlation-Key: {type: string}
      payload:
        type: object
        description: 'The event data: any JSON object of at most 240 KiB.'
        additionalProperties: true
    EventDocument:
      name: EventDocument
      contentType: application/json
      summary: What a run started by an event is given as its input, and what a step woken by an event gets as its output.
      payload:
        type: object
        required: [event, data]
        properties:
          event:
            type: object
            required: [id, source, type, receivedAt]
            properties:
              id: {type: string}
              source: {type: string, description: 'api, the slug of an endpoint or of a connector, or cron.'}
              type: {type: string}
              subject: {type: [string, 'null']}
              correlationKey: {type: [string, 'null']}
              occurredAt: {type: [string, 'null'], format: date-time}
              receivedAt: {type: string, format: date-time}
          data:
            type: object
            additionalProperties: true
    BrokerMessage:
      name: BrokerMessage
      contentType: application/json
      headers:
        type: object
        description: Kafka headers, NATS headers or SQS message attributes (String). Names are case-insensitive.
        properties:
          eventId: {type: string, description: 'Absent: the broker''s own identity of the message (topic/partition/offset, stream sequence or Nats-Msg-Id, message id).'}
          eventType: {type: string, description: 'Absent: the connector''s default event type; absent too, the message is set aside.'}
          subject: {type: string}
          correlationKey: {type: string}
          occurredAt: {type: string, format: date-time}
      payload:
        type: object
        description: 'The event data: a JSON object of at most 240 KiB. Anything else is set aside as a dead letter.'
        additionalProperties: true
    RunFinishedWebhook:
      name: RunFinishedWebhook
      contentType: application/json
      headers:
        type: object
        required: [X-Octopus-Signature, X-Octopus-Timestamp, X-Octopus-Event-Id, X-Octopus-Event-Type, X-Octopus-Delivery-Id, X-Octopus-Attempt, X-Octopus-Schema-Version]
        properties:
          X-Octopus-Signature: {type: string, description: 'As for an inbound webhook, over "octopus-event-out-v1\n{timestamp}\n{eventId}\n{eventType}\n\n\n" followed by the body; one signature for each of the two newest versions of the secret, comma separated.'}
          X-Octopus-Timestamp: {type: string}
          X-Octopus-Event-Id: {type: string, description: 'The id of the event (the outbox message): the same for every subscription it goes to.'}
          X-Octopus-Event-Type: {type: string, enum: [run.finished]}
          X-Octopus-Delivery-Id: {type: string, format: uuid, description: 'Identifies this delivery and does not change between attempts: a receiver that keeps it can drop a repeat.'}
          X-Octopus-Attempt: {type: string, pattern: '^[0-9]+$'}
          X-Octopus-Schema-Version: {type: string, description: 'The version of the shape of the payload.'}
          traceparent: {type: string, description: "W3C Trace Context. Sent when the event is about a run that belongs to a trace: the trace is the run's, and the parent is this attempt to deliver, itself a child of the run's span, so what the receiver does about the event is in the run's trace."}
      payload:
        type: object
        required: [id, type, time, data]
        properties:
          id: {type: string}
          type: {type: string, enum: [run.finished]}
          time: {type: string, format: date-time}
          data:
            type: object
            required: [tenantId, namespaceId, runId, workflow, status]
            properties:
              tenantId: {type: string, format: uuid}
              namespaceId: {type: string, format: uuid}
              runId: {type: string, format: uuid}
              workflow: {type: string}
              status: {type: string, enum: [SUCCEEDED, FAILED, CANCELLED, TIMED_OUT, COMPENSATED, PARTIAL, COMPENSATION_FAILED]}
              traceId: {type: [string, 'null'], description: 'W3C trace id (32 hex) of the run, so a subscriber can put what it does about the run in the run''s trace.'}
    RunFinishedBroker:
      name: RunFinishedBroker
      contentType: application/json
      headers:
        type: object
        required: [event-id, event-type, delivery-id, attempt, schema-version]
        properties:
          event-id: {type: string, description: 'The event id shared by every subscription.'}
          event-type: {type: string, enum: [run.finished]}
          delivery-id: {type: string, format: uuid, description: 'Stable across attempts and used for protocol-native deduplication metadata.'}
          attempt: {type: string, pattern: '^[0-9]+$'}
          schema-version: {type: string}
          traceparent: {type: string}
          Nats-Msg-Id: {type: string, description: 'For JetStream, the delivery id.'}
      payload: {$ref: '#/components/messages/RunFinishedWebhook/payload'}
    OperationalAlertWebhook:
      name: OperationalAlertWebhook
      contentType: application/json
      headers:
        type: object
        required: [X-Octopus-Signature, X-Octopus-Timestamp, X-Octopus-Event-Id, X-Octopus-Event-Type, X-Octopus-Delivery-Id, X-Octopus-Attempt, X-Octopus-Schema-Version]
        properties:
          X-Octopus-Signature: {type: string, description: 'As for the delivery of a finished run.'}
          X-Octopus-Timestamp: {type: string}
          X-Octopus-Event-Id: {type: string, description: 'One per change of an alert: the alert, how many times it has begun to fire, and which change.'}
          X-Octopus-Event-Type: {type: string, enum: [ops.alert.fired, ops.alert.resolved]}
          X-Octopus-Delivery-Id: {type: string, format: uuid}
          X-Octopus-Attempt: {type: string, pattern: '^[0-9]+$'}
          X-Octopus-Schema-Version: {type: string}
      payload:
        type: object
        required: [id, type, time, data]
        properties:
          id: {type: string}
          type: {type: string, enum: [ops.alert.fired, ops.alert.resolved]}
          time: {type: string, format: date-time}
          data:
            type: object
            description: 'Counts, ages and names; never data of a run.'
            required: [tenantId, namespaceId, alertId, kind, subject, severity, state, firstSeenAt, items, oldestSeconds, summary, runbook]
            properties:
              tenantId: {type: string, format: uuid}
              namespaceId: {type: string, format: uuid}
              alertId: {type: string, format: uuid}
              kind: {type: string, enum: [OUTBOX_STUCK, LEASE_NOT_REAPED, STEP_UNCLAIMED, REVIEW_PENDING, DEAD_ITEMS]}
              subject: {type: string, maxLength: 120}
              severity: {type: string, enum: [warning, critical]}
              state: {type: string, enum: [FIRING, RESOLVED]}
              firstSeenAt: {type: string, format: date-time}
              items: {type: integer, minimum: 0}
              oldestSeconds: {type: number, minimum: 0}
              summary: {type: string}
              runbook: {type: string}

