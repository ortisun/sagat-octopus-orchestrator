syntax = "proto3";
package sagat_octopus_orchestrator.v1;
option csharp_namespace = "SagatOctopusOrchestrator.Protocol.V1";
option go_package = "github.com/ortisun/sagat-octopus-orchestrator/proto/sagat_octopus_orchestrator/v1;sagatoctopusorchestratorv1";
option java_package = "dev.sagatoctopusorchestrator.protocol.v1";

// The worker protocol (feature 002), implemented by the execution engine and generated into the Rust
// server (`sagat-api-grpc`). Every call carries `authorization: Bearer <jwt>` metadata (the worker's
// OIDC identity, role `worker`).
//
// Errors (gRPC status; the stable machine code is in the `x-sagat-error` trailing metadata):
//   UNAUTHENTICATED     no or invalid credentials, unknown or expired session
//   PERMISSION_DENIED   the identity is not a worker
//                       x-sagat-error: NOT_BOUND            the identity is not bound to the namespace and
//                       activity it asked to serve (an administrator binds it, feature 009)
//                       x-sagat-error: SECRET_NOT_USABLE    a secret the step declares does not exist or
//                       its publisher may no longer use it
//   INVALID_ARGUMENT    a malformed field, an unsupported protocol version, an invalid output
//   ABORTED             x-sagat-error: STALE_ATTEMPT        the lease is no longer current (reclaimed,
//                       cancelled or finished): stop, do not retry the report
//                       x-sagat-error: IDEMPOTENCY_KEY_REUSED  the key was used for a different report
//   RESOURCE_EXHAUSTED  rate limited; `retry-after-ms` metadata
//   UNAVAILABLE         storage unavailable; retry with the same idempotency key
// Delivery is at-least-once: a lost response is retried with the same idempotency key and answered
// with the original result and `already_applied = true`.
service WorkerService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc PollTasks(PollTasksRequest) returns (PollTasksResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc CompleteStep(CompleteStepRequest) returns (StepCommandResponse);
  rpc FailStep(FailStepRequest) returns (StepCommandResponse);
  // Added in 1.2 (additive, feature 009). The values of the secrets the step's definition declares,
  // for the length of the attempt the lease belongs to: the lease is the capability. All or nothing.
  // The values are credentials: use this call only over TLS, never log or persist them, and drop them
  // when the attempt ends. Every call is audited (names and versions, never values).
  rpc ResolveSecrets(ResolveSecretsRequest) returns (ResolveSecretsResponse);
}

message WorkerCapabilities {
  repeated string languages = 1;
  repeated string activities = 2;
  repeated string pools = 3;
  int32 max_inflight = 4;
  string protocol_version = 5;
}
message RegisterWorkerRequest { string worker_name = 1; string namespace = 2; WorkerCapabilities capabilities = 3; }
message RegisterWorkerResponse { string worker_id = 1; string session_token = 2; string accepted_protocol_version = 3; }
message PollTasksRequest { string worker_id = 1; string session_token = 2; int32 max_tasks = 3; }
message TaskLease {
  string task_id = 1;
  string run_id = 2;
  string step_id = 3;
  int32 attempt = 4;
  int64 generation = 5;
  string lease_token = 6;
  int64 expires_at_epoch_ms = 7;
  string activity_name = 8;
  string input_json = 9;
  string input_blob_ref = 10;
  string traceparent = 11;
  string tenant_alias = 12;
  string idempotency_key = 13;
  // Added in 1.2 (additive; feature 003 sagas). A worker that ignores them keeps working: a
  // compensation is an ordinary activity task whose `activity_name` is the one the workflow
  // declared in `compensateWith`.
  // FORWARD (empty is FORWARD), COMPENSATION or RECONCILIATION.
  string task_kind = 14;
  // For a COMPENSATION or a RECONCILIATION: the forward step it is about, and the idempotency key
  // that step's own attempts carried, which is what identifies the effect at the provider.
  // `idempotency_key` is then the key of this compensation (stable per run, step and action) or of
  // this lookup, and must be sent to the provider so that asking again never repeats the effect.
  string target_node = 15;
  string target_idempotency_key = 16;
}
message PollTasksResponse { repeated TaskLease tasks = 1; int32 retry_after_ms = 2; }
message HeartbeatRequest {
  string task_id = 1; string worker_id = 2; int64 generation = 3; string lease_token = 4;
  // Added in 1.1 (additive): identify the step exactly, as CompleteStep and FailStep do.
  string run_id = 5; string step_id = 6; int32 attempt = 7;
}
message HeartbeatResponse { int64 lease_expires_at_epoch_ms = 1; bool cancel_requested = 2; }
message CompleteStepRequest {
  string task_id = 1; string run_id = 2; string step_id = 3;
  int32 attempt = 4; int64 generation = 5; string lease_token = 6;
  string idempotency_key = 7; string output_json = 8; string output_blob_ref = 9;
  string output_sha256 = 10; string traceparent = 11;
}
message FailStepRequest {
  string task_id = 1; string run_id = 2; string step_id = 3;
  int32 attempt = 4; int64 generation = 5; string lease_token = 6;
  string idempotency_key = 7; string error_code = 8; string safe_message = 9;
  bool retryable = 10; string traceparent = 11;
}
message ResolveSecretsRequest {
  string task_id = 1; string run_id = 2; string step_id = 3;
  int32 attempt = 4; int64 generation = 5; string lease_token = 6;
  string traceparent = 7;
}
message ResolvedSecret { string name = 1; bytes value = 2; uint32 version = 3; }
message ResolveSecretsResponse { repeated ResolvedSecret secrets = 1; }
message StepCommandResponse { string command_id = 1; bool already_applied = 2; string step_status = 3; string run_status = 4; }
