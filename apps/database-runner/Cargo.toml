[package]
name = "sagat-database-runner"
description = "Isolated managed PostgreSQL executor using lease-scoped gRPC capabilities."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
bytes.workspace = true
ipnet = "2"
metrics.workspace = true
sagat-api-grpc.workspace = true
sagat-application.workspace = true
sagat-domain.workspace = true
sagat-infra-database.workspace = true
sagat-infra-secrets.workspace = true
sagat-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
time = { workspace = true, features = ["parsing", "macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util"] }
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { workspace = true, features = ["tls-native-roots"] }
tracing.workspace = true
url = "2"
uuid.workspace = true
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "database-runner"
path = "src/main.rs"
