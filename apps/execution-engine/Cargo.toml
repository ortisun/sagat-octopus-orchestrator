[package]
name = "sagat-execution-engine"
description = "Execution engine process: worker gRPC API, scheduler loop and outbox dispatcher."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "sagat_execution_engine"
path = "src/lib.rs"

[[bin]]
name = "execution-engine"
path = "src/main.rs"

[dependencies]
sagat-infra-blobstore.workspace = true
axum.workspace = true
metrics.workspace = true
sagat-api-grpc.workspace = true
sagat-api-http.workspace = true
sagat-application.workspace = true
sagat-control-plane.workspace = true
sagat-domain.workspace = true
sagat-infra-connectors.workspace = true
sagat-infra-ir.workspace = true
sagat-infra-nats.workspace = true
sagat-infra-postgres.workspace = true
sagat-infra-secrets.workspace = true
sagat-scheduler.workspace = true
sagat-telemetry.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
