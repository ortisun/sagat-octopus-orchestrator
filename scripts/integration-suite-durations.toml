# How long each integration suite (a [[test]] target of tests/Cargo.toml) runs on the CI runner, in whole seconds.
# scripts/select-test-targets.py balances the shards of the CI integration jobs by these figures; it does not decide
# which suites run. scripts/tests/test_select_test_targets.py (DurationTable) fails when this table and the manifest
# do not list the same suites: add a figure with a new suite (until then it is planned at 600 seconds) and remove it with
# the suite.
#
# How the figures were measured (2026-11-20): from the log of the step that ran the suites one after another
# (`gh run view <run> --job <job> --log`), the time from a suite's "Running <path> (<binary>)" line to the next
# binary's, or to the end of the step for the last one; a suite cut off by a timeout counts as a lower bound. That
# is the suite's wall time, PostgreSQL containers included, without its build. The figure is the largest seen, rounded
# up to ten seconds; a suite whose tests are all #[ignore] (it needs toolchains this job does not have) measures 0 to
# 10 seconds. The comment after each figure is how many runs saw the suite.
#
# Source runs (run / job of `rust (fmt, clippy, tests)`), 17 of them, all on 2026-11-20:
#   44793165198 / 136485917661  pull request #241 (feature/041), every suite, timed out at 110 minutes
#   44783905511 / 136453649809  feature/041, every suite, timed out
#   44766932112 / 136401487972  feature/041, every suite, timed out
#   44765147390 / 136390979791  feature/041, every suite
#   44761985947 / 136376723599  feature/041, every suite, timed out
#   44757295350 / 136360370005  feature/041, every suite, timed out
#   44777596057 / 136434400409  pull request into release/0.3.0
#   44777587433 / 136431929237  push to release/0.3.0
#   44678068505 / 136095441716  pull request into release/0.3.0
#   44678062541 / 136095387401  push to release/0.3.0
#   44776859843 / 136428857201  push to main (cargo test --workspace)
#   44677885196 / 136093984309  push to main (cargo test --workspace)
#   44758274618 / 136363686889  push to hotfix/0.2.1 (cargo test --workspace)
#   44678800283 / 136096958957  push to hotfix/0.2.1 (cargo test --workspace)
#   44678807693 / 136096983351  pull request from hotfix/0.2.1
#   44767441802 / 136402616110  feature/022, nine suites
#   44765364955 / 136391114805  feature/022, nine suites
# Refresh it the same way when a suite grows or shrinks noticeably; a lower figure is a finding to explain, not a
# number to take on one run.

