[package]
name = "sagat-infra-secrets"
description = "AES-256-GCM sealing of secrets with a rotatable key ring."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
metrics.workspace = true
memchr = "2"
reqwest.workspace = true
rustls.workspace = true
sagat-application.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
tracing = { workspace = true, features = ["attributes"] }
uuid.workspace = true
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
base64 = "0.23"
getrandom = "0.4"
sagat-domain.workspace = true
thiserror.workspace = true
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
testcontainers-modules.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
