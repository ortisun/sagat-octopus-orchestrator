[package]
name = "sagat-infra-postgres"
description = "PostgreSQL adapter: migrations and implementations of the application storage ports."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Feature 022 (T022-096): `PgRunStore::admitting_step_gates_for_tests`, which admits a definition gated only at its steps
# before the run-level admission and the grant and timeout routines exist. Test suites only, enabled in
# `[dev-dependencies]` (scripts/check-architecture.py).
step-gates-for-tests = []

[dependencies]
sagat-application.workspace = true
metrics.workspace = true
sagat-telemetry.workspace = true
sagat-domain.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sqlx.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true
