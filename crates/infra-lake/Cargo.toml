[package]
name = "sagat-infra-lake"
description = "The lake runner's side of the lake runtime: the sagat.lake.v1 protocol and the relay."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
ipnet = "2"
sagat-domain.workspace = true
sagat-infra-database.workspace = true
sagat-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

[dev-dependencies]
ipnet = "2"
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
