[package]
name = "sagat-application"
description = "Use cases and ports. Depends on the domain only; adapters implement the ports."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
futures-core.workspace = true
getrandom = "0.4"
hmac = "0.13"
metrics.workspace = true
ring = { version = "0.17", default-features = false }
sagat-domain.workspace = true
sagat-telemetry.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tracing = { workspace = true, features = ["attributes"] }
uuid.workspace = true

[features]
# The constructor of `CheckedRunInput` that skips the gate, and doubles of the validator port, for tests that build a
# creation by hand (design 043). Enabled only in `[dev-dependencies]` (scripts/check-architecture.py).
test-support = []

[dev-dependencies]
futures-util.workspace = true
sagat-application = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
