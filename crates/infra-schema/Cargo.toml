[package]
name = "sagat-infra-schema"
description = "Adapter: JSON Schema for the input and result of scripts — checking a schema, validating a value against it without echoing the value, inferring a schema from a value."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = "1"
base64 = "0.23"
metrics.workspace = true
sagat-application.workspace = true
sagat-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
# No network or file resolution: a `$ref` to anything outside the document is an error, never a request. The scripts'
# schemas (feature 005) and the classification carriers use it; the run-input validator does not (D043-074): there it is
# the oracle of a test only.
jsonschema = { version = "0.58", default-features = false }
# The run-input validator's patterns: parsed against an allowlist, compiled with every runtime engine bounded (design 043).
regex-automata = "0.4"
regex-syntax = "0.8"

[features]
# Counts the run-input validator's primitive operations, so the adversarial tests hold them to a multiple of the units.
test-support = []

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
sagat-infra-schema = { path = ".", features = ["test-support"] }
