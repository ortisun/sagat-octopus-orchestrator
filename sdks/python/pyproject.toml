[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sagat-octopus-orchestrator"
version = "0.1.0"
description = "Python SDK for the Sagat Octopus Orchestrator: an asyncio client for runs and events, a worker host for activities, sagas and reconciliations, and typed builders of the workflow IR."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["workflow", "orchestration", "saga", "durable-execution", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
# The floors are the versions the generated gRPC code was produced with (it refuses an older runtime).
dependencies = [
    "httpx>=0.28.1,<1",
    "grpcio>=1.84.0,<2",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
opentelemetry = ["opentelemetry-api>=1.39.1,<2"]

[project.urls]
Repository = "https://github.com/ortisun/sagat-octopus-orchestrator/tree/main/sdks/python"

[tool.setuptools.packages.find]
include = ["sagat_octopus_orchestrator*"]

[tool.setuptools.package-data]
sagat_octopus_orchestrator = ["py.typed", "_proto/*.pyi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["sagat_octopus_orchestrator", "tests", "conformance", "scripts"]
exclude = ["sagat_octopus_orchestrator/_proto/"]

[[tool.mypy.overrides]]
module = ["sagat_octopus_orchestrator._proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["grpc_tools.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["sagat_octopus_orchestrator/_proto", "sagat_octopus_orchestrator/_catalog.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "ASYNC110", "PT018", "PT011", "E501"]
"conformance/*" = ["ASYNC110"]
