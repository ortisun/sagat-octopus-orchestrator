# Design 041's spike T041-35, second run, on a dedicated GitHub-hosted runner: the declared environment of
# OD-2026-11-20-6 (delegate), since the shared laptop could not give a quiet round. A push to a `perf/**` branch runs
# the branch's own copy of this file; it is kept on the perf branch and the feature branch only (research.md, D041-103).
name: perf-spike

on:
  push:
    branches: ['perf/**']

permissions:
  contents: read

concurrency:
  group: perf-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  carry-spike:
    # Four runners, three rounds each (D041-104): a round's validity looks only at its capture-off baselines, so more
    # rounds make three valid ones likely without touching the gates; `judge` takes the first three valid in the order
    # shard 1 to 4, round 1 to 3, fixed before measuring.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # A cold release build of sagat-tests takes about 30 minutes; each round about 10 to 20 minutes here.
    timeout-minutes: 300
    env:
      SAGAT_SPIKE_DEDICATED: "1"
      ROUNDS: "3"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # The runner context is not available in a job's env, so the rounds' directory is set here.
      - run: echo "OUT=$RUNNER_TEMP/carry-spike" >> "$GITHUB_ENV"
      - name: free disk space
        # The image carries toolchains this job never uses; a release build of sagat-tests needs the room (ci.yml).
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the exact compiler; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: perf-spike
          cache-on-failure: true
      - name: declared environment
        run: |
          nproc
          lscpu | sed -n 's/^Model name: *//p'
          free -g
          df -h /
          uptime
          ls -d /usr/lib/postgresql/*/bin
      - name: build the spike
        run: cargo test -p sagat-tests --test perf_scalability_ha --release --features perf-spike --locked --no-run
      - name: rounds
        run: tests/performance/scalability-ha/carry_spike_rounds.sh
      - name: verdict
        if: always()
        run: python3 -I tests/performance/scalability-ha/carry_spike_judge.py "$OUT" | tee "$OUT/verdict.txt"
      - name: keep the rounds and the verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carry-spike-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/carry-spike/

  judge:
    needs: carry-spike
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: carry-spike-${{ github.sha }}-*
          path: ${{ runner.temp }}/shards
      - name: rounds in the fixed order (shard, then round)
        run: |
          all="$RUNNER_TEMP/all"; mkdir -p "$all"; k=0
          for shard in 1 2 3 4; do
            dir="$RUNNER_TEMP/shards/carry-spike-${GITHUB_SHA}-$shard"
            for r in 1 2 3; do
              k=$((k+1))
              [ -f "$dir/second-round-$r.log" ] || { echo "shard $shard round $r: missing (round $k)"; continue; }
              for ext in log md quiet; do cp "$dir/second-round-$r.$ext" "$all/second-round-$k.$ext"; done
              echo "shard $shard round $r -> round $k"
            done
          done
      - name: verdict over every shard
        run: python3 -I tests/performance/scalability-ha/carry_spike_judge.py "$RUNNER_TEMP/all" | tee "$RUNNER_TEMP/all/verdict.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carry-spike-${{ github.sha }}-verdict
          path: ${{ runner.temp }}/all/
