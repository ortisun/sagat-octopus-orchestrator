name: sdk packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sdk-packages.yml"
      - "scripts/package-sdks.sh"
      - "sdks/**"
      - "LICENSE"
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

jobs:
  packages:
    name: package and clean-install smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.14"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.401
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Build packages and run clean consumers
        run: bash scripts/package-sdks.sh "${RUNNER_TEMP}/sdk-packages"
      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-packages-${{ github.sha }}
          path: ${{ runner.temp }}/sdk-packages/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
