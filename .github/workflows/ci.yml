name: ci

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep filename/line backtraces in CI without full type/variable debug metadata.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    # A cold build takes about 30 minutes and the workspace tests about as long again. A test that hangs
    # must not hold the runner for the default six hours (it did on pull request 45).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the exact compiler; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: isolated C# compiler and runtime images
        run: |
          docker build -f runners/dotnet/Dockerfile.builder -t sagat/dotnet-builder:10.0.401 .
          docker build -f runners/dotnet/Dockerfile.runtime -t sagat/dotnet-runtime:10.0.12 .
      # Integration tests start PostgreSQL through Testcontainers (Docker is preinstalled).
      # The workspace also verifies worker/event compatibility baselines and that applying
      # platform migrations twice is a no-op (T001-030/031).
      # Every failing test is reported, not only the first binary's: a first run on a new platform is the time to see them all.
      - name: build isolated database executor for process tests
        run: cargo build -p sagat-database-runner --bin database-runner --locked
      - run: cargo test --workspace --locked --no-fail-fast
        timeout-minutes: 110

  native-runners:
    name: native Go and Java (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build native images without emulation
        run: |
          docker build -f runners/go/Dockerfile.builder -t sagat/go-builder:1.25.3 .
          docker build -f runners/go/Dockerfile.runtime -t sagat/go-runtime:1.25.3 .
          docker build -f runners/java/Dockerfile.builder -t sagat/java-builder:17.0.16 .
          docker build -f runners/java/Dockerfile.runtime -t sagat/java-runtime:17.0.16 .
      - name: prove exact production isolation and native loading
        run: cargo test -p sagat-infra-sandbox --lib --locked -- --ignored --nocapture --test-threads=1

  architecture:
    name: architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check-architecture.py
      - run: python3 scripts/check-vendor.py
      - run: python3 scripts/check-agent-config.py

  sdks:
    name: sdks (unit tests, conformance suite, user stories, faults)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      # The C# SDK targets net8.0 and net10.0; global.json asks for the 10.0.4xx SDK.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # The unit tests of each SDK run offline against fakes; the commands are the ones in its README.
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Python SDK
        working-directory: sdks/python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.lock.txt
          .venv/bin/python -m pytest
          .venv/bin/mypy
          .venv/bin/ruff check .
      - name: Go SDK
        working-directory: sdks/go
        run: |
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: C# SDK
        working-directory: sdks/dotnet
        run: |
          dotnet test
          dotnet format --verify-no-changes
      - name: Java SDK
        working-directory: sdks/java
        run: ./mvnw -q verify
      # These three targets play every SDK against a real platform (PostgreSQL through Testcontainers, the
      # engine and the API in the test process). They are #[ignore] in the workspace run above because they
      # need the five toolchains.
      - name: build isolated database executor for SDK conformance
        run: cargo build -p sagat-database-runner --bin database-runner --locked
      - name: conformance suite, user stories and faults, five languages
        run: cargo test -p sagat-tests --test sdk_conformance --test e2e_sdk_multilanguage --test fault_sdk_multilanguage --locked -- --ignored
      # The hello-world and order-processing examples of each SDK run against a real platform: all five
      # produce the same persisted semantics; and the payment saga runs on a good day, a declined card
      # and a lost answer, plus the real sandbox.
      # The browser journey runs in the studio job, which installs the frontend and Chromium.
      - name: examples, five languages, payment saga and script sandbox
        run: |
          cargo test -p sagat-tests --test e2e_developer_experience --locked -- --ignored us03:: order_processing:: saga:: scripts::

  studio:
    name: studio (lint, types, unit tests, build, browser journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The lockfile is the record: exact versions, no install scripts (frontend/.npmrc).
      - name: dependencies
        working-directory: frontend
        run: npm ci
      # The journeys' workers use the TypeScript SDK (frontend/e2e depends on it by path), so it is built before the
      # journeys' code is type-checked: its dist/ is what the package exports.
      - name: TypeScript SDK
        run: bash sdks/typescript/conformance/prepare.sh
      # Production and tooling both; a low advisory is recorded in research.md (G152), moderate and above fail the build.
      - name: advisories
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: lint, types, unit tests, build, generated API types
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck --workspace @sagat/e2e
          npm test
          npm run build
          npm run check:api
      - name: Chromium for Playwright
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium
      # The journeys (US01..US04, SC-007-001, accessibility, security, sign-in) in a real browser against the real
      # platform (PostgreSQL through Testcontainers, the API serving the Studio, the engine, a sandbox runner). They are
      # #[ignore] in the workspace run because they need Node and Chromium. The benchmark runs only with STUDIO_PERF=1.
      - name: browser journeys
        run: cargo test -p sagat-tests --test e2e_workflow_studio --locked -- --ignored journeys
      - name: managed PostgreSQL and OpenBao browser journeys
        timeout-minutes: 30
        run: |
          cargo build -p sagat-database-runner --bin database-runner --locked
          cargo test -p sagat-tests --test e2e_database_connections --locked -- --ignored
      - name: onboarding browser failure redaction
        working-directory: frontend
        run: node --test e2e/compose-security.test.mjs
      - name: CLI, SDK and Studio onboarding journey
        run: |
          cargo test -p sagat-tests --test e2e_developer_experience --locked -- --ignored onboarding_browser::

  contracts:
    name: contracts (OpenAPI, protobuf, AsyncAPI, JSON Schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint specs/001-platform-foundation/contracts/openapi.yaml
      - name: Protobuf compiles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          protoc --proto_path=specs/001-platform-foundation/contracts \
                 --descriptor_set_out=/dev/null \
                 specs/001-platform-foundation/contracts/worker.proto
      - name: AsyncAPI is valid
        # The exact version that `npx @asyncapi/cli@3` resolved on 2026-10-08 (3.6.0), with install
        # scripts disabled, so a new release or a compromised dependency script cannot change what
        # CI executes unnoticed. Transitive dependencies are still resolved at run time (npx has no
        # lockfile); bump the version deliberately and re-run this step locally when you do.
        run: npx --yes --ignore-scripts @asyncapi/cli@3.6.0 validate specs/001-platform-foundation/contracts/events.asyncapi.yaml
      - name: Workflow example validates against the IR schema
        run: |
          # `--strict=false`: the schema carries `x-maxUtf8Bytes`, which documents the byte bound that
          # `maxLength` (characters) cannot express; the platform's own codec enforces it
          # (`contract_workflow_primitives::identity_limits`). ajv's strict mode rejects any keyword it
          # was not told about.
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats --strict=false \
            -s specs/001-platform-foundation/contracts/workflow.schema.json \
            -d examples/payment-saga.workflow.json

  local-environment:
    name: local environment (docker compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The CLI the smoke test uses for the first day: doctor, publish, serve, run.
      - run: cargo build -p sagat-cli --locked
      - name: Prepare the TypeScript SDK example and compose-only browser journey
        run: |
          examples/hello-world/typescript/prepare.sh
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          (cd frontend && npx playwright install --with-deps chromium)
      # Builds the images, starts PostgreSQL + NATS + the development identity provider + control plane +
      # engine, checks health, runs the seed twice, gets a token from the provider, publishes and runs a
      # workflow with the CLI and tears everything down (see scripts/smoke-compose.sh).
      - run: SAGAT_BIN=target/debug/sagat SAGAT_SMOKE_BROWSER=1 scripts/smoke-compose.sh
      - name: managed database containers and coordinated restore
        timeout-minutes: 15
        run: |
          docker build -f infra/docker/Dockerfile --target database-runner -t sagat-octopus-orchestrator/database-runner:dev .
          python3 tests/e2e/database-connections/compose.py

  observability:
    name: observability files (Prometheus rules and configuration, Collector configuration, dashboards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The files the compose overlay mounts, checked by the pinned images that will read them. The
      # cargo tests check that what they say exists (every metric is one the code emits, every alert
      # points to a runbook section); this checks that the tools accept them.
      - name: promtool check config (loads the rules as well)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infra/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro" \
            prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro" \
            prom/prometheus:v3.15.0 check rules /etc/prometheus/alerts.yaml
      - name: OpenTelemetry Collector validate
        run: |
          docker run --rm \
            -v "$PWD/infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.161.0 validate --config=/etc/otelcol/config.yaml
      - name: Grafana dashboards are JSON
        run: |
          for f in infra/observability/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null; done

  scale:
    name: scale and recovery (chart, load harness at a small size, disaster-recovery drill)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The contract test of the chart (`contract_scalability_ha`) renders it with `helm template` in the
      # workspace run above; this lints it with the example an operator starts from.
      - run: helm lint infra/helm -f infra/helm/examples/ha.yaml
      - run: for script in tests/performance/scalability-ha/run.sh infra/dr/drill.sh; do bash -n "$script"; done
      - run: sh -n tests/security/sandbox/kubernetes-network-policy.sh
      # The scenarios of the benchmark at a size CI can afford, against a PostgreSQL the script starts
      # itself: proof that the harness runs and that its assertions hold, not a measurement (the figures of
      # the report are from a quiet machine, tests/performance/reports/scalability-ha.md).
      - name: load harness, small
        env:
          SAGAT_PERF_MAX_WAITS: "2000"
          SAGAT_PERF_FIRING_WAITS: "3000"
          SAGAT_PERF_FIRING_BURST: "300"
          SAGAT_PERF_NOISY: "300"
          SAGAT_PERF_QUIET: "60"
          SAGAT_PERF_TRANSITION_RUNS: "60"
          SAGAT_PERF_REPORT: ${{ runner.temp }}/scalability-ha.md
        run: |
          tests/performance/scalability-ha/run.sh
          cat "$SAGAT_PERF_REPORT"
      # The point-in-time restore (journal digest before and after, every run replayed) and the failover
      # to a synchronous standby (no acknowledged run missing), on clusters the script starts itself.
      - name: disaster-recovery drill, small
        env:
          SAGAT_DR_RUNS: "300"
          SAGAT_DR_REPORT: ${{ runner.temp }}/disaster-recovery.md
        run: |
          infra/dr/drill.sh
          cat "$SAGAT_DR_REPORT"

  dependencies:
    name: dependency advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Every ignored advisory, why, and when it expires are in .cargo/audit.toml and research.md (G16, G271, G700 to G703).
      - run: cargo audit --deny warnings
