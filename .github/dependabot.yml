# Keeps the pinned GitHub Actions (by commit SHA) and the Rust dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: cargo
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
